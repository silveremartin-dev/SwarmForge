# ==============================================================================
# SwarmForge Helm Values Configuration
# Comprehensive configuration for SwarmForge 1.0.0-beta.1 on Kubernetes (GKE, EKS, AKS, k3s)
# ==============================================================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []

# ------------------------------------------------------------------------------
# 1. SwarmForge Dedicated Server (gRPC + WebSocket / REST telemetry)
# ------------------------------------------------------------------------------
server:
  replicaCount: 1
  image:
    repository: swarmforge/server
    pullPolicy: IfNotPresent
    tag: "latest"
  
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  env:
    scenario: "1"
    nogui: "true"
    worldWidth: "500"
    worldHeight: "100"

# ------------------------------------------------------------------------------
# 2. Distributed Compute Workers (Simulation tick processing offload)
# ------------------------------------------------------------------------------
compute:
  enabled: true
  replicaCount: 2
  image:
    repository: swarmforge/compute
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------
# 3. Web Dashboard (React 18 + Three.js 3D Web Viewer & Controller)
# ------------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 1
  image:
    repository: swarmforge/web
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ------------------------------------------------------------------------------
# 4. Ingress Configuration
# ------------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: swarmforge.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: server
        - path: /ws
          pathType: Prefix
          service: server
  tls: []
  #  - secretName: swarmforge-tls
  #    hosts:
  #      - swarmforge.local

# ------------------------------------------------------------------------------
# 5. Database & Cache Dependencies (Bitnami Charts or External Managed Services)
# ------------------------------------------------------------------------------
# PostgreSQL (Telemetry, run histories, world states)
postgresql:
  enabled: true
  auth:
    database: swarmforge
    username: swarmforge
    password: changeme_swarmforge_db
    postgresPassword: changeme_postgres_admin
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# Redis (Real-time spatial index caching & pub/sub streaming)
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# External Database & Redis (used if postgresql.enabled=false / redis.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  user: "swarmforge"
  password: ""
  database: "swarmforge"

externalRedis:
  host: ""
  port: 6379
  password: ""
