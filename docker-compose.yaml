version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: swarmforge-server/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - PORT=8080
      - GRPC_PORT=50051
    networks:
      - swarmforge-net

  compute:
    build:
      context: .
      dockerfile: swarmforge-compute/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=50051
    depends_on:
      - server
    networks:
      - swarmforge-net

  web:
    build:
      context: ./swarmforge-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - swarmforge-net

networks:
  swarmforge-net:
    driver: bridge
