services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmforge-postgres
    environment:
      - POSTGRES_USER=swarmforge
      - POSTGRES_PASSWORD=swarmforge
      - POSTGRES_DB=swarmforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swarmforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
