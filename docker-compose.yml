version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmforge-postgres
    environment:
      - POSTGRES_USER=swarmforge
      - POSTGRES_PASSWORD=swarmforge
      - POSTGRES_DB=swarmforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - swarmforge-net

  redis:
    image: redis:7-alpine
    container_name: swarmforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - swarmforge-net

  server:
    build:
      context: .
      dockerfile: swarmforge-server/Dockerfile
    container_name: swarmforge-server
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - PORT=8080
      - GRPC_PORT=50051
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=swarmforge
      - DB_USER=swarmforge
      - DB_PASSWORD=swarmforge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCENARIO=${SCENARIO:-1}
      - NOGUI=true
      - JAVA_OPTS=-Xms2g -Xmx6g -XX:+UseZGC -XX:+ZGenerational -XX:+UnlockDiagnosticVMOptions -XX:+UseSuperWord -XX:LoopUnrollLimit=1000 --add-modules jdk.incubator.vector -XX:+UseCompressedOops
    depends_on:
      - postgres
      - redis
    networks:
      - swarmforge-net

  compute:
    build:
      context: .
      dockerfile: swarmforge-compute/Dockerfile
    deploy:
      replicas: 2
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=50051
      - JAVA_OPTS=-Xms1g -Xmx4g -XX:+UseZGC -XX:+ZGenerational -XX:+UnlockDiagnosticVMOptions -XX:+UseSuperWord -XX:LoopUnrollLimit=1000 --add-modules jdk.incubator.vector -XX:+UseCompressedOops
    depends_on:
      - server
    networks:
      - swarmforge-net

  web:
    build:
      context: ./swarmforge-web
      dockerfile: Dockerfile
    container_name: swarmforge-web
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - swarmforge-net

volumes:
  pgdata:
  redisdata:

networks:
  swarmforge-net:
    driver: bridge

