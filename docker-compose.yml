version: '3.8'

services:
  swarmforge-server:
    build: .
    ports:
      - "50051:50051"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=swarmforge
      - DB_PASSWORD=swarmforge
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=swarmforge
      - POSTGRES_PASSWORD=swarmforge
      - POSTGRES_DB=swarmforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
