glossary.biomech.antennal_olfaction.desc=Sensille olfactive tapissant les antennes et offrant une perception stéréoscopique des gradients chimiques. Permet aux individus de déchiffrer les bouquets phéromonaux complexes de la colonie.
glossary.biomech.antennal_olfaction.title=Sensibilité Antennale & Olfaction 3D
glossary.biomech.arolia.desc=Coussinets adhésifs souples situés entre les griffes tarsales. Grâce à la sécrétion d'un film liquide micro-capillaire, l'insecte peut marcher sur les surfaces verticales totalement lisses et le verre.
glossary.biomech.arolia.title=Ventouses Tarsales (Arolia) & Adhérence
glossary.biomech.autothysis.desc=Mécanisme de défense extrême où l'ouvrière contracte violemment ses muscles abdominaux jusqu'à faire exploser sa cuticule, libérant une glu visqueuse et toxique qui englue et paralyse les envahisseurs (Colobopsis explodens).
glossary.biomech.autothysis.title=Autothysis (Mise à Feu Suicidaire)
glossary.biomech.mandible.desc=Pression mécanique de fermeture des mandibules. Varie de la découpe délicate des feuilles tendres à l'enclenchement catapulté des mandibules pièges de Odontomachus atteignant des vitesses de 200 km/h.
glossary.biomech.mandible.title=Force Mandibulaire & Puissance Mâchoire (MPa)
glossary.biomech.subgenual.desc=Organe chordotonal ultrasensible situé dans le tibia des pattes. Capte les micro-vibrations mécaniques transmises par le substrat (fréquences de 100 à 1000 Hz) pour détecter les signaux d'alarme ou les effondrements.
glossary.biomech.subgenual.title=Organe Subgénual (Sub-genual organ)
glossary.biomech.uv.desc=Système de navigation optique exploitant les motifs de polarisation de la lumière ultraviolette du ciel. Permet à la fourmi du désert (Cataglyphis) de retrouver le nid en ligne droite après un parcours sinueux de plusieurs centaines de mètres.
glossary.biomech.uv.title=Boussole Céleste UV & Polarisation
glossary.cat.accessory=Espèces Associées, Proies & Pathogènes
glossary.cat.env=Sol & Géologie SIG
glossary.cat.nest=Architectures de Nids
glossary.cat.reasoning=Moteurs Cognitifs & Raisonnement
glossary.cat.sensors=Capteurs & Biomécanique
glossary.cat.social=Structure Sociale & Reines
glossary.dialog.header=Guide Détaillé des Paramètres Biologiques, Climat & Architectures
glossary.dialog.title=📖 Glossaire & Guide de Conception Eusociale
glossary.editor.unsaved_title=Glossaire Scientifique - Modifications non enregistrées
glossary.engine.audio_synth.desc=Générateur sonore en temps réel modélisant la stridulation des fourmis, le bourdonnement des ailes à fréquence variable (Hz) et les bruits environnementaux (pluie, vent) par synthèse FM/subtractive WebAudio et Java Sound.
glossary.engine.audio_synth.title=Mixeur Audio Synthétique Procédural
glossary.engine.dt.desc=Intervalle temporel physique et biologique calculé à chaque itération du moteur de simulation (dt configurable de 16.6 ms à 1s, jusqu'à x100 en accélération). Régule l'intégration numérique d'Euler/Verlet pour la diffusion phéromonale et le déplacement des agents.
glossary.engine.dt.title=Multiplicateur de Pas Temporel (Pas dt & Sub-stepping)
glossary.engine.god_mode.desc=Module d'interventions directes en temps réel. Permet d'injecter des désastres climatiques (pluie d'acide, inondation par hausse de la nappe phréatique), de modifier instantanément les réserves trophiques (sucre, protéines, eau) et d'altérer les populations par destruction sélective ou création forcée d'individus.
glossary.engine.god_mode.title=Mode Divin (God Mode & System Interventions)
glossary.engine.multi_colony.desc=Gestion simultanée de plusieurs colonies concurrentes ou symbiotiques dans un même espace voxel. Chaque colonie possède son propre réseau de phéromones, sa matrice de castes et son suivi télémétrique distinct.
glossary.engine.multi_colony.title=Multi-Colonies & Suivi Dynamique des Castes
glossary.engine.seed.desc=Graine de nombre pseudo-aléatoire (ex: Seed 42, 64-bit LCG/Xoroshiro) garantissant la réplicabilité exacte à 100% des trajectoires agentiques, des bifurcations décisionnelles et de la météo pour la recherche scientifique.
glossary.engine.seed.title=Seed Déterministe (Master Random Seed)
glossary.engine.time_scale.desc=Système d'horodatage convertissant les ticks de simulation en unités de temps réelles (secondes, minutes, heures, jours de diapause). Permet le suivi précis des courbes de croissance démographique et des taux d'évaporation.
glossary.engine.time_scale.title=Temporalité Réelle & Horloge Écologique
glossary.entry.accessory.aphids.desc=Élevage de pucerons et récolte du miellat sucré échangé contre une protection contre les prédateurs.
glossary.entry.accessory.aphids.title=Pucerons Symbiotiques & Miellat (APHID_MUTUALIST)
glossary.entry.accessory.diapause.desc=Mise en léthargie métabolique sous 10°C ou lors du raccourcissement automnal de la photopériode.
glossary.entry.accessory.diapause.title=Hivernation & Diapause Automatique
glossary.entry.accessory.flora.desc=Plantes, graines et nectaires extrafloraux fournissant de la biomasse et du sucre.
glossary.entry.accessory.flora.title=Flore & Ressources Végétales (FLORA)
glossary.entry.accessory.lat.desc=La latitude définit la déclinaison solaire et la durée du jour tout au long de l'année, synchronisant la reproduction, l'amassage et l'hivernation.
glossary.entry.accessory.lat.title=Latitude & Photopériode Solaire
glossary.entry.accessory.pathogen.desc=Champignons entomopathogènes (Cordyceps), microsporidies et acariens (Varroa) affectant la santé.
glossary.entry.accessory.pathogen.title=Pathogènes & Parasites (PATHOGEN_PARASITE)
glossary.entry.accessory.predator.desc=Araignées, fourmilions et oiseaux exerçant une pression de prédation sur les patrouilleuses.
glossary.entry.accessory.predator.title=Prédateurs Spécialisés (PREDATOR)
glossary.entry.accessory.prey.desc=Chenilles, grillons et mouches apportant les protéines indispensables au développement des larves.
glossary.entry.accessory.prey.title=Insectes Proies (PREY_INSECT)
glossary.entry.accessory.r0.desc=Nombre moyen d'infections secondaires générées par un individu infecté dans la colonie.
glossary.entry.accessory.r0.title=Taux de Transmission Pathogène (R0)
glossary.entry.accessory.trophic_web.desc=Réseau dynamique d'interactions proies-prédateurs régulant les biomasses et l'apport en protéines au sein de l'écosystème.
glossary.entry.accessory.trophic_web.title=Réseaux Trophiques & Chaînes Alimentaires
glossary.entry.accessory.commensalism.desc=Association biologique neutre à bénéfique où des organismes (staphylins, cloportes) cohabitent dans le nid sans altérer la colonie.
glossary.entry.accessory.commensalism.title=Commensalisme & Myrmécophilie
glossary.entry.accessory.myrmecochory.desc=Transport mutualiste de graines pourvues d'élaïosomes nutritifs consommés par la colonie avant la germination.
glossary.entry.accessory.myrmecochory.title=Myrmécochorie & Dispersion des Graines
glossary.entry.accessory.parasitoidism.desc=Infiltration du nid par des insectes ou acariens spécialistes détournant le couvain ou les ressources alimentaires.
glossary.entry.accessory.parasitoidism.title=Parasitoïdisme & Parasites de Nids
glossary.entry.social.polycalism.desc=Interconnexion coopérative de multiples nids satellites partageant ouvrières, couvain et nourriture sans agressivité coloniale.
glossary.entry.social.polycalism.title=Polycalisme & Réseaux de Supercolonies
glossary.entry.env.microclimate.desc=Régulation fine de l'humidité et de la température dans les galeries pour protéger le couvain de la dessiccation et des moisissures.
glossary.entry.env.microclimate.title=Microclimat Souterrain & Gradient Hygrométrique
glossary.entry.env.depth.desc=Épaisseur verticale du sol simulé (0.2m à 5.0m). Limite la profondeur maximale d'excavation et les nappes phréatiques.
glossary.entry.env.depth.title=Profondeur Souterraine (depthMeters)
glossary.entry.env.dim.desc=Échelle horizontale du terrarium simulé en mètres réels.
glossary.entry.env.dim.title=Dimensions Surfaciques (mètres)
glossary.entry.env.res.desc=Précision millimétrique du maillage voxel 3D du sol (ex: 5mm/voxel).
glossary.entry.env.res.title=Résolution Voxel (mm)
glossary.entry.env.sig.desc=Importation directe en 1 clic de données d'altitude réelles (Copernicus DEM / NASA SRTM 30m) basées sur coordonnées GPS.
glossary.entry.env.sig.title=Importation SIG GPS (DEM & Copernicus)
glossary.entry.env.water.desc=Teneur en eau du substrat nécessaire pour éviter la dessiccation des larves et maintenir le couvain.
glossary.entry.env.water.title=Humidité du Sol & Nappe Phréatique (%)
glossary.entry.nest.bivouac.desc=Nid temporaire vivant formé par les corps entrelacés des ouvrières (Fourmis légionnaires Eciton).
glossary.entry.nest.bivouac.title=Bivouac Vivant (BIVOUAC_LIVING_NEST)
glossary.entry.nest.carton.desc=Nid en bois mâché cartonné accroché aux troncs et branches (Fourmis Crematogaster/Azteca).
glossary.entry.nest.carton.title=Nid Ligneux Cartonné (CARTON_NEST)
glossary.entry.nest.cathedral.desc=Tourelles en ciment salivaire avec puits de ventilation convective et loges royales (Termites).
glossary.entry.nest.cathedral.title=Termitière Cathédrale (CATHEDRAL_MOUND)
glossary.entry.nest.fungi.desc=Cavernes souterraines profondes hébergeant des jardins à champignons cultivés (Fourmis Atta/Acromyrmex).
glossary.entry.nest.fungi.title=Jardins à Champignons (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.mound.desc=Dôme parabolique d'aiguilles de pin capteur de chaleur solaire (Fourmis rousses Formica rufa).
glossary.entry.nest.mound.title=Dôme d'Aiguilles (MOUND)
glossary.entry.nest.paper.desc=Nid suspendu en papier mâché rattaché par un pédoncule, enveloppe protectrice (Guêpes & Frelons).
glossary.entry.nest.paper.title=Nid Suspendu en Papier (PAPER_PEDUNCULATE)
glossary.entry.nest.silk.desc=Capsule de feuilles vivantes cousues par de la soie larvaire dans la canopée (Fourmis tisserandes Oecophylla).
glossary.entry.nest.silk.title=Nid de Soie Arboricole (ARBOREAL_SILK_LEAF)
glossary.entry.nest.wax_comb.desc=Rayons verticaux de cire à cellules hexagonales 3D parallèles (Abeilles domestiques Apis mellifera).
glossary.entry.nest.wax_comb.title=Rayons d'Abeille Hexagonaux (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_pots.desc=Grappes de pots sphériques en cire et propolis pour nectar et couvain (Bourdons Bombus).
glossary.entry.nest.wax_pots.title=Pots de Cire & Propolis (WAX_POTS_CLUSTER)
glossary.entry.nest.wood.desc=Galeries excavées dans le bois mort ou le cœur des arbres (Fourmis charpentières Camponotus).
glossary.entry.nest.wood.title=Excavation de Bois Mort (TREE / DEAD_WOOD)
glossary.entry.reasoning.bdi.desc=Modélisation cognitive agentique à haut niveau : croyances environnementales, désirs prioritaires et plan d'action intentionnel.
glossary.entry.reasoning.bdi.title=BDI (Croyances - Désirs - Intentions)
glossary.entry.reasoning.blackboard.desc=Espace de mémoire partagé et décentralisé permettant aux agents de déposer et consulter des besoins prioritaires sans contrôleur central.
glossary.entry.reasoning.blackboard.title=Architecture à Tableau Blanc (Blackboard)
glossary.entry.reasoning.bt.desc=Architecture hiérarchique basée sur des nœuds d'exécution (Séquences, Sélecteurs, Décorateurs et Actions) réévalués périodiquement.
glossary.entry.reasoning.bt.title=Arbre de Comportements (Behavior Tree)
glossary.entry.reasoning.fsm.desc=Modèle comportemental réactif déterministe basculant entre états discrets (ex: Repos -> Exploration -> Transport) selon des déclencheurs stricts.
glossary.entry.reasoning.fsm.title=Automate à États Finis (FSM)
glossary.entry.reasoning.fuzzy.desc=Moteur de décision à logique floue utilisant des degrés d'appartenance continus entre 0 et 1 pour des transitions comportementales graduelles.
glossary.entry.reasoning.fuzzy.title=Logique Floue (Fuzzy Logic)
glossary.entry.reasoning.hybrid.desc=Architecture hybride multi-niveaux couplant une planification stratégique BDI/Arbre de Décision avec un contrôle réactif FSM ou Flou.
glossary.entry.reasoning.hybrid.title=Moteur Hybride Combiné (Hybrid)
glossary.entry.reasoning.snn.desc=Moteur neuromorphique à impulsions couplé à un apprentissage par renforcement (Q-Learning / STDP) pour l'adaptation continue.
glossary.entry.reasoning.snn.title=Réseau de Neurones Spikant (SNN / Neural Network)
glossary.entry.sensors.arolia.desc=Structures d'adhésion cuticulaires assurant la marche sur parois verticales et plafonds lisses.
glossary.entry.sensors.arolia.title=Ventouses Tarsales (Arolia)
glossary.entry.sensors.autothysis.desc=Rupture abdominale défensive libérant des sécrétions toxiques engluantes (Colobopsis explodens).
glossary.entry.sensors.autothysis.title=Autothysis (Explosion Suicidaire)
glossary.entry.sensors.mandible.desc=Force de morsure et pression mécanique maximale mesurée en MégaPascals.
glossary.entry.sensors.mandible.title=Force Mandibulaire & Cisaillement (MPa)
glossary.entry.sensors.subgenual.desc=Capteur mécano-récepteur hautement sensible situé sur les tibias détectant les vibrations du sol et tambourinages d'alerte.
glossary.entry.sensors.subgenual.title=Organe Subgénual (Perception Vibrations)
glossary.entry.sensors.uv.desc=Navigation céleste vectorielle utilisant la polarisation de la lumière UV du ciel (Cataglyphis / Abeilles).
glossary.entry.sensors.uv.title=Boussole Lumière Polarisée UV
glossary.entry.social.flight.desc=AERIAL_SWARM (nuée aérienne), SWARM_DIVISION (division d'essaim abeilles), BUDDING (bouturage de nid), IN_NEST (accouplement interne).
glossary.entry.social.flight.title=Vol Nuptial & Essaimage
glossary.entry.social.gynic.desc=MONOGYNE (1 reine unique par colonie), POLYGYNE (plusieurs reines réparties), GAMERGATES (ouvrières fécondes reproductrices).
glossary.entry.social.gynic.title=Structure Gynique (Monogyne / Polygyne)
glossary.entry.social.inhibition.desc=Phéromone émise par la reine pour bloquer la différenciation de nouvelles reines au sein du couvain.
glossary.entry.social.inhibition.title=Inhibition Phéromonale Royale
glossary.entry.social.king.desc=Caractéristique clé des termites chez qui le mâle (roi) vit en permanence aux côtés de la reine.
glossary.entry.social.king.title=Roi Reproducteur (Isoptera)
glossary.env.co2.desc=Concentration de CO₂ dans les galeries profondes issue de la respiration accumulée de milliers d'individus. Un niveau trop élevé (>2%) déclenche l'ouverture de puits d'aération ou le battement d'ailes synchrone des ouvrières.
glossary.env.co2.title=Dioxyde de Carbone (CO₂ ppm) & Ventilation
glossary.env.magnetic.desc=Champ géomagnétique ambiant détecté par des particules de magnétite présentes dans le corps des insectes. Permet aux termites et aux fourmis souterraines de s'orienter et d'aligner la construction de leurs galeries dans l'obscurité totale.
glossary.env.magnetic.title=Champ Magnétique Terrestre (µT) & Magnétoréception
glossary.env.moisture.desc=Pourcentage de saturation en eau du substrat. Une humidité adéquate est vitale pour empêcher la dessiccation de la cuticule des larves et des œufs, tout en maintenant les conditions optimales de germination des jardins à champignons et la souplesse du terreau.
glossary.env.moisture.title=Humidité du Sol & Hygroréception (%)
glossary.env.pressure.desc=Variation de la pression barométrique détectée par les insectes. Une chute rapide annonce l'arrivée d'une tempête ou d'une averse importante, incitant le nid à fermer les entrées et à stopper les essaimages.
glossary.env.pressure.title=Pression Atmosphérique (hPa) & Baroréception
glossary.env.soil_layers.desc=Propriétés physiques du substrat géologique (sable friable, argile compacte, terreau fertile, roche infranchissable). Détermine la vitesse d'excavation des galeries, le risque d'éboulement et la rétention d'eau.
glossary.env.soil_layers.title=Couches de Sol, Granulométrie & Friction
glossary.env.solar.desc=Intensité du rayonnement solaire direct frappant la surface du terrarium. Influence l'échauffement des dômes, l'évaporation de la rosée matinale et l'orientation des sorties de recherche de nourriture.
glossary.env.solar.title=Rayonnement Solaire & Flux Thermique
glossary.env.temperature.desc=Température ambiante du nid et de l'air extérieur. Les insectes étant ectothermes, le gradient thermique dicte la vitesse du métabolisme, la durée du développement embryonnaire et l'intensité des sorties de foraging.
glossary.env.temperature.title=Température & Thermorégulation (°C)
glossary.env.trail_pheromones.desc=Empreintes chimiques déposées sur le sol par le pygidium des foragères. Leur taux d'évacuation et leur ré-application continue forment les autoroutes chimiques reliant le nid aux sources de ressources abondantes.
glossary.env.trail_pheromones.title=Pistes Phéromonales & Volatilité
glossary.link.wikipedia=🌐 Wikipédia
glossary.nest.arboreal_carton.desc=Réseau étendu de tunnels cartonnés longeant les branches et les troncs jusqu'à la canopée. Permet aux foragères de circuler à l'abri des rayons UV et des attaques aériennes de prédateurs ou d'oiseaux.
glossary.nest.arboreal_carton.title=Galerisme Arboricole Suspendu (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=Pavillon arboricole formé de feuilles vivantes pliées et cousues ensemble par les fourmis tisserandes (Oecophylla smaragdina). Les ouvrières utilisent leurs propres larves comme des navettes de soie vivantes pour tisser les fils adhésifs assurant la cohésion de l'enveloppe végétale dans la canopée.
glossary.nest.arboreal_silk.title=Nid de Soie Arboricole (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=Nid tubulaire tirant parti de la protection naturelle offerte par les entre-nœuds creux des tiges de bambou ou des bois creux. Très prisé par les petites espèces arboricoles (Pseudomyrmex, Camponotus truncatus) qui façonnent un bouchon céphalique pour obturer l'entrée étroite.
glossary.nest.bamboo.title=Tiges Creuses de Bambou (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=Architecture temporaire et dynamique constituée exclusivement des corps entrelacés de centaines de milliers d'ouvrières (Eciton burchellii). Ce nid vivant maintient la température du couvain au centre et se déplace chaque nuit lors des phases nomades de chasse.
glossary.nest.bivouac.title=Bivouac Vivant (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=Structure spongieuse fabriquée à partir de fibres végétales et d'excréments séchés, formant une enveloppe alvéolaire rigide. Accrochée aux troncs d'arbres ou aux rochers par les fourmis arboricoles (Crematogaster, Azteca). Assure une isolation thermique et une protection contre les prédateurs.
glossary.nest.carton.title=Nid Ligneux Cartonné (CARTON_NEST)
glossary.nest.cathedral.desc=Imposantes tourelles en ciment salivaire, argile et fèces construites par les termites (Macrotermes, Nasutitermes). Ces structures atteignent plusieurs mètres et intègrent un système thermodynamique sophistiqué à ventilation convective continue, régulant passivement la température, l'humidité et le taux de CO₂ au cœur de la colonie.
glossary.nest.cathedral.title=Termitière Cathédrale (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=Réseau de cavernes souterraines profondes hébergeant des cultures symbiotiques de champignons (Leucoagaricus) entretenues par les fourmis champignonnières (Atta, Acromyrmex). Exige un microclimat rigoureusement contrôlé (95-99% d'humidité) et une évacuation continue des métabolites d'excavation.
glossary.nest.fungi_vault.title=Jardins à Champignons (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=Nid arboricole excavé dans le bois mort d'un tronc ou d'une grosse branche (Camponotus, termites arboricoles).
glossary.nest.hollow_trunk_nest.title=Nid en Cavité de Tronc (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=Substrats et sécrétions utilisés par les insectes : EARTH (terre/argile), WOOD_PULP_PAPER (papier mâché salivaire), BEESWAX (cire stéarique), STERCORAL_CEMENT (ciment stercoral/excréments), SILK_WEAVE (soie de larve), PROPOLIS (résine végétale antibactérienne), CARTON_PULP (carton mâché), LIVING_INSECT_BODIES (corps d'ouvrières entrelacés).
glossary.nest.materials.title=Matériaux Biologiques de Construction
glossary.nest.mound.desc=Dôme parabolique fait de brindilles, résine et aiguilles de pin érigé par les fourmis rousses des bois (Formica rufa). Orienté vers le sud, ce dôme agit comme un capteur solaire thermique captant les rayons du matin pour réchauffer le couvain et stimuler l'activité printanière.
glossary.nest.mound.title=Dôme d'Aiguilles Solaire (MOUND)
glossary.nest.paper_pedunculate.desc=Nid aérien confectionné en bois mort mâché et mélangé à la salive, formant un papier mâché rigide et imperméable. Rattaché aux branches ou bâtiments par un pédoncule étroit enduit de répulsif à fourmis. Utilisé par les guêpes sociales (Polistes, Vespa) pour protéger le couvain central.
glossary.nest.paper_pedunculate.title=Nid Suspendu en Papier (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=Cycle d'expansion de la colonie : Fondation (< 200 individus, chambre royale unique), Établi (~25% de la taille adulte), Mature (100% de la taille adulte, distribution complète des chambres), Vieux Nid / Supercolonie (> 200%, réseau tentaculaire multi-puits).
glossary.nest.stages.title=Stades de Maturité & Évolution du Nid
glossary.nest.subterranean.desc=Système tridimensionnel complexe de chambres et tunnels souterrains profonds. Comprend des espaces dédiés aux œufs, larves, nymphes, réserves de graines ou d'insectes, ainsi que des tunnels de fuite et puits d'absorption d'eau.
glossary.nest.subterranean.title=Galeries Souterraines (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=Structure souterraine renforcée par la cimentation de particules de calcaire avec la salive et les minéraux dissous. Offre une très haute résistance aux effondrements causés par le piétinement de grands mammifères ou l'érosion pluviale.
glossary.nest.subterranean_lime.title=Nids en Ciment Calcaire (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=Structure alvéolée verticale en cire pure sécrétée par les glandes sternales des abeilles ouvrières (Apis mellifera). La géométrie hexagonale parfaite maximise l'espace de stockage du miel et du couvain tout en minimisant la quantité de matériau requise. Offre une excellente isolation thermique et une rigidité mécanique optimale.
glossary.nest.wax_comb.title=Rayons d'Abeille Hexagonaux (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=Grappes de réserves ovoides ou sphériques façonnées en cire et propolis par les bourdons (Bombus spp.). Ces réceptacles servent d'amphores pour stocker le nectar liquide et le pollen, ou de loges individuelles de couvain. Cette structure flexible s'adapte aux cavités irrégulières du sol ou des nids d'oiseaux abandonnés.
glossary.nest.wax_pots.title=Pots de Cire & Propolis (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=Réseau de galeries longitudinales sculptées à même le cœur des souches ou troncs d'arbres en décomposition (Camponotus pennsylvanicus). Exploite la résistance naturelle du bois dur pour isoler la colonie des gelées hivernales et des attaques de prédateurs.
glossary.nest.wood.title=Excavation de Bois Mort (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=Ruche modulaire en bois (type Dadant ou Langstroth) abritant des cadres verticaux mobiles. Structure rectangulaire optimisée pour la récolte du miel, la thermorégulation hivernale et l'aération.
glossary.nest.wooden_beehive.title=Ruche en Bois à Cadres (WOODEN_BEEHIVE)
glossary.reasoning.bdi.desc=Modèle cognitif agentique à haut niveau : l'insecte entretient des Croyances sur son environnement, évalue des Désirs prioritaires (ex: protéger la reine, ravitailler le couvain) et s'engage dans des Intentions structurées sous forme de plans d'action.
glossary.reasoning.bdi.title=BDI (Croyances - Désirs - Intentions)
glossary.reasoning.blackboard.desc=Espace de mémoire partagé et décentralisé où les individus déposent des signaux ou alertes (ex: pénurie d'eau, fissure de dôme) et lisent les requêtes prioritaires du nid pour coordonner leurs tâches sans contrôleur central.
glossary.reasoning.blackboard.title=Architecture à Tableau Blanc (Blackboard)
glossary.reasoning.bt.desc=Architecture hiérarchique basée sur des nœuds d'exécution (Séquences, Sélecteurs, Décorateurs et Actions). Évalue périodiquement des conditions environnementales pour choisir la branche comportementale réactive appropriée (ex: Forage, Attaque, Restauration).
glossary.reasoning.bt.title=Arbre de Comportements (Behavior Tree)
glossary.reasoning.bulk.desc=Modélisation macroscopique et statistique des grands essaims. Calcule la dynamique globale des masses de fourmis ou termites sans simuler chaque individu séparément, optimisant ainsi les performances de calcul.
glossary.reasoning.bulk.title=Simulations de Foule en Masse (Bulk / Pattern)
glossary.reasoning.fsm.desc=Modèle comportemental réactif déterministe. L'agent bascule d'un état discret à un autre (ex: Repos -> Exploration -> Transport -> Dépôt) en réponse à des seuils environnementaux ou événements immédiats.
glossary.reasoning.fsm.title=Automate à États Finis (FSM)
glossary.reasoning.fuzzy.desc=Moteur de décision à logique floue utilisant des variables linguistiques et des degrés d'appartenance continus entre 0 et 1 (ex: Faim = 0.7, Fatigue = 0.3) pour générer des transitions comportementales graduelles et réalistes.
glossary.reasoning.fuzzy.title=Logique Floue (Fuzzy Logic)
glossary.reasoning.hybrid.desc=Architecture hybride multi-niveaux couplant une planification stratégique BDI ou par Arbre de Décision à haut niveau avec un contrôle exécutif réactif FSM ou Flou à bas niveau pour une flexibilité maximale.
glossary.reasoning.hybrid.title=Moteur Hybride Combiné (Hybrid)
glossary.reasoning.nn.desc=Réseau de neurones artificiels et neuromorphiques à impulsions (Spiking Neural Network) couplé à un apprentissage par renforcement (Q-Learning / STDP), permettant une adaptation continue face aux obstacles et prédateurs.
glossary.reasoning.nn.title=Réseau de Neurones Spikant (SNN / Neural Network)
glossary.reasoning.quorum.desc=Seuil de densité d'individus requis pour valider collectivement un choix d'un nouveau site de nidification ou une attaque majeure. Permet d'éviter les décisions prématurées basées sur des observations isolées.
glossary.reasoning.quorum.title=Détection de Quorum Sensing (Prise de Décision Collective)
glossary.search_prompt=🔍 Rechercher un paramètre, une espèce, une architecture ou un concept (ex: Perlin, SRTM, Cordyceps, BDI, Diapause, Subgenual)...
glossary.social.inhibition.desc=Message chimique émis continuellement par la reine féconde (ex: acide 9-oxo-2-décénoïque chez l'abeille). Bloque le développement des ovaires chez les ouvrières et empêche l'élevage spontaneous de nouvelles reines concurrentes tant que la reine est en bonne santé.
glossary.social.inhibition.title=Inhibition Phéromonale Royale
glossary.social.king.desc=Mâle reproducteur permanent vivant en couple monogame avec la reine chez les termites (Isoptères). Contrairement aux hyménoptères où les mâles meurent après le vol nuptial, le roi termite féconde régulièrement la reine et participe à la régulation phéromonale de la termitière.
glossary.social.king.title=Roi Reproducteur (Termites)
glossary.social.nuptial.desc=Mode de dispersion stratégique de la colonie : AERIAL_SWARM (envol massif synchrone des sexués ailés lors des journées chaudes et humides), SWARM_DIVISION (division d'une colonie d'abeilles avec la reine mère), BUDDING (bouturage au sol d'une reine et d'ouvrières).
glossary.social.nuptial.title=Essaimage & Vol Nuptial
glossary.social.polyethism.desc=Division du travail au sein du nid. Le polyéthisme d'âge implique qu'une ouvrière évolue au cours de sa vie (nourrice au couvain, puis bâtisseuse, et enfin foragère extérieure). Le polyéthisme de caste associe la tâche à la morphologie (soldats, minimes, majeurs).
glossary.social.polyethism.title=Polyéthisme de Caste & d'Âge
glossary.social.queen_mode.desc=Détermine le nombre et le type d'individus reproducteurs : MONOGYNE (une seule reine mère fondatrice), POLYGYNE (coexistence de plusieurs reines fécondes au sein du même nid), GAMERGATES (ouvrières capables de s'accoupler et de pondre en l'absence de reine).
glossary.social.queen_mode.title=Mode de Reine & Polymorphisme Reproducteur
glossary.social.stigmergy.desc=Mécanisme d'ordination indirecte où les traces laissées dans l'environnement par une action individuelle (dépot de boulette de terre ou phéromone) stimulent et guident l'action suivante par d'autres individus sans contrôle centralisé.
glossary.social.stigmergy.title=Stigmergie & Auto-Organisation
glossary.social.trophallaxis.desc=Transfert de nourriture liquide de jabot à jabot (stomodéale) ou d'excrétats (proctodéale) entre individus de la colonie. Sert non seulement à la nutrition partagée, mais transporte également des hormones, micro-organismes intestinaux et phéromones informatives.
glossary.social.trophallaxis.title=Trophallaxie & Partage de Ressources
glossary.species.desiccation.desc=Capacité biologique de la cuticule et des spiracles respiratoires à réduire l'évaporation de l'eau corporelle face aux gradients d'humidité faibles et aux températures ambiantes élevées.
glossary.species.desiccation.title=Résistance à la Dessiccation Atmosphérique
glossary.species.formic_acid.desc=Substance défensive et offensive corrosive (acide méthanoïque) sécrétée par la glande à venin des fourmis de la sous-famille des Formicinae. Elle est pulvérisée par le pore de l'acide (acidopore) pour paralyser les proies ou repousser les prédateurs.
glossary.species.formic_acid.title=Acide Formique & Armes Venimeuses
glossary.species.hydrocarbons.desc=Mélange complexe de cires, lipides et alcanes recouvrant l'exosquelette des insectes eusociaux. Il protège l'organisme de la dessiccation atmosphérique et constitue la "carte d'identité" olfactive de la colonie (reconnaissance du nid et détection des intrus).
glossary.species.hydrocarbons.title=Hydrocarbures Cuticulaires & Identité Chimique
glossary.species.metabolism.desc=Vitesse de consommation des réserves de nutriments (glucose, triglycérides) requise par l'organisme d'un insecte pour maintenir son homéostasie au repos et fournir l'énergie mécanique nécessaire lors du fourrageage ou du creusement.
glossary.species.metabolism.title=Taux Métabolique de Base & Dépense Énergétique
glossary.species.polymorphism.desc=Divergence morphologique marquée au sein de la caste des ouvrières d'une même colonie. Les ouvrières minors assurent le soin au couvain, tandis que les majors/soldats développent une tête surdimensionnée et des mandibules capables de broyer des graines dures ou de défendre le nid.
glossary.species.polymorphism.title=Polymorphisme des Ouvrières (Majors, Médias, Minors)
glossary.subtitle=Référence complète centralisant tous les paramètres de simulation, métriques biologiques, capteurs, substrats géologiques, architectures de nids et espèces associées.
