# Nest Glossary
glossary.nest.wax_comb.title=Rayons d'Abeille Hexagonaux (WAX_COMB_HEXAGONAL)
glossary.nest.wax_comb.desc=Rayons verticaux de cire à cellules hexagonales 3D parallèles (Abeilles domestiques Apis mellifera).
glossary.nest.wax_pots.title=Pots de Cire & Propolis (WAX_POTS_CLUSTER)
glossary.nest.wax_pots.desc=Grappes de pots sphériques en cire et propolis pour nectar et couvain (Bourdons Bombus).
glossary.nest.paper_pedunculate.title=Nid Suspendu en Papier (PAPER_PEDUNCULATE)
glossary.nest.paper_pedunculate.desc=Nid suspendu en papier mâché rattaché par un pédoncule, enveloppe protectrice (Guêpes & Frelons).
glossary.nest.cathedral.title=Termitière Cathédrale (CATHEDRAL_MOUND)
glossary.nest.cathedral.desc=Tourelles en ciment salivaire avec puits de ventilation convective et loges royales (Termites).
glossary.nest.arboreal_silk.title=Nid de Soie Arboricole (ARBOREAL_SILK_LEAF)
glossary.nest.arboreal_silk.desc=Capsule de feuilles vivantes cousues par de la soie larvaire dans la canopée (Fourmis tisserandes Oecophylla).
glossary.nest.fungi_vault.title=Jardins à Champignons (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.fungi_vault.desc=Cavernes souterraines profondes hébergeant des jardins à champignons cultivés (Fourmis Atta/Acromyrmex).
glossary.nest.carton.title=Nid Ligneux Cartonné (CARTON_NEST)
glossary.nest.carton.desc=Nid en bois mâché cartonné accroché aux troncs et branches (Fourmis Crematogaster/Azteca).
glossary.nest.bamboo.title=Tiges Creuses de Bambou (BAMBOO_STEM_NEST)
glossary.nest.bamboo.desc=Nid tubulaire aménagé dans des tiges creuses ou entre-nœuds de bambou (Fourmis Pseudomyrmex).
glossary.nest.bivouac.title=Bivouac Vivant (BIVOUAC_LIVING_NEST)
glossary.nest.bivouac.desc=Nid temporaire vivant formé par les corps entrelacés des ouvrières (Fourmis légionnaires Eciton).
glossary.nest.mound.title=Dôme d'Aiguilles (MOUND)
glossary.nest.mound.desc=Dôme parabolique d'aiguilles de pin capteur de chaleur solaire (Fourmis rousses Formica rufa).
glossary.nest.wood.title=Excavation de Bois Mort (TREE / DEAD_WOOD)
glossary.nest.wood.desc=Galeries excavées dans le bois mort ou le cœur des arbres (Fourmis charpentières Camponotus).
glossary.nest.subterranean.title=Galeries Souterraines (MATURE / SIMPLE)
glossary.nest.subterranean.desc=Réseau de galeries souterraines élémentaires ou matures avec chambres d'œufs et de stockage.

# Social Glossary
glossary.social.queen_mode.title=Mode de Reine
glossary.social.queen_mode.desc=MONOGYNE (1 reine unique), POLYGYNE (plusieurs reines réparties), GAMERGATES (ouvrières fécondes reproductrices).
glossary.social.king.title=Roi Reproducteur
glossary.social.king.desc=Caractéristique clé des termites chez qui le mâle (roi) vit en permanence aux côtés de la reine.
glossary.social.nuptial.title=Essaimage / Vol Nuptial
glossary.social.nuptial.desc=AERIAL_SWARM (nuée aérienne), SWARM_DIVISION (division d'essaim abeilles), BUDDING (bouturage de nid), IN_NEST (accouplement interne).
glossary.social.inhibition.title=Inhibition Phéromonale
glossary.social.inhibition.desc=Phéromone émise par la reine pour bloquer la différenciation de nouvelles reines au sein du couvain.

# Environment Glossary
glossary.env.moisture.title=Humidité du Sol & Hygroréception (%)
glossary.env.moisture.desc=Teneur en eau du substrat nécessaire pour éviter la dessiccation des larves et la survie des champignons.
glossary.env.temperature.title=Température & Régulation Thermique (°C)
glossary.env.temperature.desc=Gradation thermique influençant le métabolisme des insectes ectothermes et la vitesse de croissance du couvain.
glossary.env.co2.title=Dioxyde de Carbone (CO₂ ppm)
glossary.env.co2.desc=Seuil de CO₂ déclenchant la percée de conduits de ventilation convective contre l'asphyxie en nid profond.
glossary.env.solar.title=Rayonnement Solaire & Chaleur
glossary.env.solar.desc=Flux thermique orientant l'architecture des dômes et le réchauffement des chambres supérieures au matin.
glossary.env.magnetic.title=Champ Magnétique Terrestre (µT)
glossary.env.magnetic.desc=Sensibilité géomagnétique permettant aux termites et fourmis de s'orienter sans repères visuels.
glossary.env.soil_layers.title=Couches de Sol & Friction (Sable, Argile, Roche)
glossary.env.soil_layers.desc=Stabilité mécanique et résistance à l'excavation selon le substrat (roche infranchissable, sable instable, terre idéale).

# Reasoning Glossary
glossary.reasoning.fsm.title=Automate à États Finis (FSM)
glossary.reasoning.fsm.desc=Comportement réactif déterministe passant d'un état à un autre selon des déclencheurs stricts (ex: Forage -> Retour Nid).
glossary.reasoning.fuzzy.title=Logique Floue (Fuzzy Logic)
glossary.reasoning.fuzzy.desc=Prise de décision continue basée sur des degrés de vérité (ex: Légèrement affamé, Très effrayé).
glossary.reasoning.bdi.title=BDI (Beliefs-Desires-Intentions)
glossary.reasoning.bdi.desc=Modélisation cognitive complète : croyances sur l'environnement, désirs prioritaires et intentions d'action.
glossary.reasoning.nn.title=Réseau de Neurones / Apprentissage RL
glossary.reasoning.nn.desc=Architecture neuronale adaptative ou apprentissage par renforcement (Q-Learning) pour optimiser les routes de forage.
glossary.reasoning.blackboard.title=Architecture Tableau Noir (Blackboard)
glossary.reasoning.blackboard.desc=Mémoire partagée globale où les spécialistes de la colonie déposent et lisent les signaux d'urgence.
glossary.reasoning.bulk.title=Simulations de Foule en Masse (Bulk / Pattern)
glossary.reasoning.bulk.desc=Modélisation macroscopique basée sur les champs de masse et comportements de foules pour grands essaims.

# Biomechanics Glossary
glossary.biomech.subgenual.title=Organe Subgénual (Sub-genual organ)
glossary.biomech.subgenual.desc=Capteur vibratoire tibia-tarsal détectant les micro-percussions du substrat pour signaux d'alarme.
glossary.biomech.uv.title=Boussole Céleste UV
glossary.biomech.uv.desc=Capteurs de lumière polarisée UV pour navigation d'orientation solaire à longue distance (Cataglyphis/Abeilles).
glossary.biomech.mandible.title=Force Mandibulaire (MPa)
glossary.biomech.mandible.desc=Pression de morsure permettant de couper le bois mort, les tiges ou de découper des proies.
glossary.biomech.autothysis.title=Autothysis (Mise à Feu Suicidaire)
glossary.biomech.autothysis.desc=Rupture suicidaire des glandes hypertrophiées libérant une glu défensive toxique (Colobopsis explodens).
glossary.biomech.arolia.title=Ventouses Tarsales (Arolia)
glossary.biomech.arolia.desc=Coussinets adhésifs assurant l'adhérence sur surfaces lisses, verticales ou au plafond.

# Accessory Species Editor
