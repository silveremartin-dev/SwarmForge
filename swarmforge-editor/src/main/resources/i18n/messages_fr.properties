sim.preset.title.claustral=👑 Fondation Claustrale Monogyne (Lasius niger)
sim.preset.desc.claustral=🔬 SCÉNARIO 1 : FONDATION SOLITAIRE CLAUSTRALE (Lasius niger)\nModélisation dynamique post-vol nuptial estival. Une reine fécondée fonde sa colonie en reclusion souterraine stricte sans foraging extérieur. Elle catabolise ses propres muscles alaires histolysés et ses réserves lipidiques pour nourrir la première génération d'ouvrières nanitiques (minima). Écosystème sous-bois tempéré à hygrométrie stabilisée (75-85%) et gradient thermique printanier.
sim.preset.title.amazon=🌿 Écosystème Amazonien (Atta sexdens & Champignon)
sim.preset.desc.amazon=🌴 SCÉNARIO 2 : ÉCOSYSTÈME NÉOTROPICAL & FONGICULTURE (Atta sexdens)\nSimules la symbiose obligée mutualiste entre les fourmis coupeuses de feuilles (champignonnistes) et le champignon basidiomycète Leucoagaricus gongylophorus. Les ouvrières médias/majors découpent le feuillage frais de la canopée, le transportent le long d'autoroutes de phéromones sur le sol forestier, et le mâchent pour former les meules fongiques souterraines. Les minima soignent le mycélium et inoculent des sécrétions antibiotiques anti-Escovopsis.
sim.preset.title.granivore=🏜 Steppe Aride Granivore (Messor barbatus & Graminées)
sim.preset.desc.granivore = 🌾 SCÉNARIO 3 : ÉCOSYSTÈME XÉRIQUE & MOISSONNEUSES GRANIVORES (Messor barbarus / Pogonomyrmex)
Comportement de récolte en milieu aride méditerranéen. Les ouvrières arpentent le sol désertique à la recherche de caryopses et de graines. Les majors aux mandibules hyper-développées broient les téguments denses pour pétrir le 'pain d'fourmi' starchy. Le nid dispose de chambres greniers thermo-régulées et sèches.
sim.preset.title.war=⚔️ Guerre Territoriale (Solenopsis invicta vs Lasius niger)
sim.preset.desc.war=⚔️ SCÉNARIO 4 : GUERRE TERRITORIALE INTERSPÉCIFIQUE & COMPÉTITION (Solenopsis vs Lasius)\nAffrontement territorial direct entre la fourmi de feu invasive Solenopsis invicta (piqûres à venin d'alkaloïdes solenopsine, recrutement de masse agressif) et la fourmi noire indigène Lasius niger (acide formicique, défense de dôme). Compétition intense pour le contrôle des ressources protéiques (cadavres d'arthropodes) et des foyers de pucerons producteurs de miellat.
sim.preset.title.beehive=🐝 Rucher Arboricole (Apis mellifera & Butinage)
sim.preset.desc.beehive=🐝 SCÉNARIO 5 : ORGANISATION D'UNE COLONIE D'APIS MELLIFERA (Ruche Souterraine / Troncs)\nSimulation d'un superorganisme mellifère. Les butineuses exécutent des danses frétillantes (waggle dance) pour encoder la direction en angle polaire et la distance relative aux patchs de nectaires. Régulation thermique interne du couvain à 35°C par battement alaire et ventilation passive, production de gelée royale par les nourrices.
sim.preset.title.termites=🏛️ Cathédrale de Termites (Reticulitermes & Macrotermes)
sim.preset.desc.termites=🕳️ SCÉNARIO 6 : TERMITIÈRE CATHÉDRALE SOUTERRAINE & BIOCLIMATISATION (Reticulitermes / Macrotermes)\nConstruction et maintenance d'un dôme architectural à ventilation convective thermodynamique. Les termites ouvriers digèrent la lignocellulose du bois grâce aux protozoaires symbiotiques et champignons Termitomyces, tout en régulant les concentrations de CO2 et d'humidité du nid.
sim.preset.title.taiga=🌲 Taïga Boréale (Formica rufa & Dôme d'Aiguilles)
sim.preset.desc.taiga=🌲 SCÉNARIO 7 : DÔME D'AIGUILLES BORÉAL & THERMORÉGULATION SOLAIRE (Formica rufa)\nColonie montagnarde des forêts de conifères. Construction de dômes d'aiguilles de pin orientés sud pour capter le rayonnement infrarouge printanier. Les ouvrières s'exposent au soleil pour transporter les calories accumulées dans les chambres profondes (comportement d'accumulation thermique solarium).
sim.preset.title.supercolony=🌴 Supercolonie Polycalique Invasive (Linepithema humile)
sim.preset.desc.supercolony=🌴 SCÉNARIO 8 : SUPERCOLONIE POLYCALIQUE INVASIVE (Linepithema humile)\nRéseau décentralisé inter-nids de grande échelle. Absence d'agressivité unicoloniale inter-nids et flux continus de reines et d'ouvrières entre les nids secondaires (calies). Compétition par exploitation agressive et monopolisation des ressources alimentaires du biotope.
