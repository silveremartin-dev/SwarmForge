# Species Editor i18n additions
species.type.ant=🐜 Fourmis (Formicidae)
species.type.ant.desc=Insectes eusociaux formant de vastes colonies souterraines aux castes spécialisées.
species.type.bee=🐝 Abeilles (Apidae)
species.type.bee.desc=Hyménoptères producteurs de miel pratiquant la danse des abeilles et bâtissant des rayonnages de cire.
species.type.wasp=🐝 Guêpes (Vespidae)
species.type.wasp.desc=Hyménoptères prédateurs construisant des nids en papier/carton à partir de fibres de bois.
species.type.termite=🐜 Termites (Termitoidae)
species.type.termite.desc=Isoptères xylophages consommant la cellulose, organisés en castes d'ouvriers et soldats aveugles sous un couple royal.
species.type.other=Autres Taxons Eusociaux
species.type.other.desc=Autres taxons d'arthropodes eusociaux ou subsociaux (ex. Thrips, Pucerons à galles, Crevettes eusociales).

species.queen_mode.monogyne=Monogyne (Reine Unique)
species.queen_mode.monogyne.desc=Une seule reine pondeuse tolérée par colonie. Sa mort entraîne le déclin de la colonie.
species.queen_mode.polygyne=Polygyne (Reines Multiples)
species.queen_mode.polygyne.desc=Plusieurs reines fertiles cohabitent paisiblement, assurant une ponte élevée et une grande résilience.
species.queen_mode.gamergates=Gamergates (Ouvrières Reproductrices)
species.queen_mode.gamergates.desc=Absence de caste royale distincte ; des ouvrières spécialisées (gamergates) s'accouplent et ponent.

species.nuptial.aerial_swarm=Vol Nuptial d'Essaimage Aérien
species.nuptial.aerial_swarm.desc=Vol synchrone massif de reines et mâles ailés lors de journées chaudes et humides.
species.nuptial.budding=Bouturage / Sociotomie
species.nuptial.budding.desc=Séparation progressive d'ouvrières accompagnées de reines fertiles vers un nid satellite.
species.nuptial.in_nest=Accouplement Intra-Nid
species.nuptial.in_nest.desc=Les ailés s'accouplent directement à l'intérieur du nid sans prendre le risque d'un vol.
species.nuptial.swarm_division=Division d'Essaim
species.nuptial.swarm_division.desc=La reine mère quitte le nid avec une cohorte d'ouvrières pour fonder une nouvelle colonie.

species.larva_diet.cellulose=Cellulose & Fibres de Bois
species.larva_diet.cellulose.desc=Bois digéré et fibres végétales dégradées par des symbiotes intestinaux (Termites).
species.larva_diet.fungus=Mycélium de Jardin de Champignons
species.larva_diet.fungus.desc=Nourriture mycélienne cultivée par la colonie sur du substrat de feuilles mâchées (Atta).
species.larva_diet.high_protein_meat=Protéines Animales & Insectes
species.larva_diet.high_protein_meat.desc=Régime riche en protéines d'insectes proies, essentiel au développement du couvain et des soldats.
species.larva_diet.omnivore=Régime Mixte Omnivore
species.larva_diet.omnivore.desc=Alimentation variée combinant miellat, restes d'arthropodes, graines et liquides sucrés.
species.larva_diet.seeds=Graines & Grains Récoltés
species.larva_diet.seeds.desc=Graines récoltées, décortiquées et broyées formant le « pain de fourmi » (Messor).
species.larva_diet.sugar_honey=Sucres, Miel & Nectar
species.larva_diet.sugar_honey.desc=Régime liquide riche en glucides (nectar, miellat de puceron, jus de fruits) apportant l'énergie métabolique.

species.diet.sugars_nectar=🍯 Sucres & Nectar Végétal
species.diet.sugars_nectar.desc=Apport en glucides simples fournissant l'énergie métabolique directe pour l'activité adulte.
species.diet.insects_meat=🥩 Insectes & Protéines Carnées
species.diet.insects_meat.desc=Protéines animales essentielles pour les larves en croissance et la ponte de la reine.
species.diet.seeds=🌾 Graines & Grainerie
species.diet.seeds.desc=Stockage et broyage de graines végétales riches en amidon pour les réserves saisonnières.
species.diet.fungus=🍄 Champignons & Mycélium Cultivé
species.diet.fungus.desc=Culture de champignons basidiomycètes sur végétal mâché dans des chambres dédiées.
species.diet.wood_cellulose=🪵 Bois & Fibres de Cellulose
species.diet.wood_cellulose.desc=Digestion de fibres de bois via des protozoaires et bactéries symbiotiques (Termites).
species.diet.honeydew=🐄 Miellat & Trophobiose de Pucerons
species.diet.honeydew.desc=Élevage trophobiotique de pucerons et cochenilles pour la récolte régulière de miellat.
species.diet.omnivore=🥗 Omnivore Polyphage
species.diet.omnivore.desc=Alimentation opportuniste s'adaptant à toutes les ressources trophiques disponibles.
species.diet.none=🚫 Pas de Régime Secondaire
species.diet.none.desc=Aucune source trophique secondaire ou complémentaire requise.

species.nest.wax_comb_hexagonal=🐝 Rayons de Cire Hexagonaux
species.nest.wax_comb_hexagonal.desc=Structure alvéolée suspendue en cire sécrétée par les glandes abdominales des ouvrières (Abeilles).
species.nest.wax_pots_cluster=🍯 Grappes de Pots de Cire
species.nest.wax_pots_cluster.desc=Cellules sphériques de cire et pots de stockage de miel/pollen en grappes (Bourdons).
species.nest.paper_pedunculate=🐝 Nid Suspendu en Papier
species.nest.paper_pedunculate.desc=Alvéoles de papier construites à partir de fibres de bois mâchées avec de la salive (Guêpes).
species.nest.cathedral_mound=🏰 Termitière Cathédrale
species.nest.cathedral_mound.desc=Structure imposante de terre dotée de puits de ventilation régulant température et CO2 (Termites).
species.nest.arboreal_silk_leaf=🍃 Nid Arboricolle Tissé de Soie
species.nest.arboreal_silk_leaf.desc=Feuilles vivantes assemblées par des fils de soie sécrétés par les larves tenues par les ouvrières (Fourmis tisserandes).
species.nest.subterranean_fungi_vault=🍄 Voûtes de Champignonnières Souterraines
species.nest.subterranean_fungi_vault.desc=Vaste réseau de chambres souterraines abritant les jardins de champignons symbiotiques (Fourmis champignonnistes).
species.nest.carton_nest=📦 Nid en Carton Végétal
species.nest.carton_nest.desc=Nid sphérique arboricole ou cavitaire construit à partir de pâte de bois mâché et salive.
species.nest.bamboo_stem_nest=🎋 Nid dans Tiges Creuses & Cavités
species.nest.bamboo_stem_nest.desc=Nid opportuniste aménagé dans des cavités préexistantes (tiges creuses, galles, trous de tarière).
species.nest.bivouac_living_nest=🐜 Bivouac Vivant (Nid Vivant)
species.nest.bivouac_living_nest.desc=Nid temporaire formé exclusivement par le tissage des corps de milliers d'ouvrières (Fourmis légionnaires).
species.nest.mound=🏔️ Dôme de Terre / Aiguilles
species.nest.mound.desc=Nid souterrain surmonté d'un dôme isolant de terre et d'aiguilles de pin (Fourmis des bois).
species.nest.tree=🪵 Nid dans Troncs d'Arbres
species.nest.tree.desc=Galeries creusées directement dans le bois mort ou les troncs en décomposition (Fourmis charpentières).
species.nest.mature=🏛️ Nid Souterrain Établi
species.nest.mature.desc=Nid souterrain très développé avec vastes chambres à couvain, chambres royales et greniers.
species.nest.simple=🕳️ Terriers Souterrains Simples
species.nest.simple.desc=Nid souterrain rudimentaire composé de quelques galeries sous des pierres ou touffes d'herbe.

species.arch.bdi=🧠 BDI (Croyances-Désirs-Intentions)
species.arch.bdi.desc=Architecture cognitive basée sur les Croyances, Désirs et Intentions pour des raisonnements complexes.
species.arch.behavior_tree=🧠 Arbre de Comportement
species.arch.behavior_tree.desc=Arbre hiérarchique récursif de sélecteurs et séquences pour un comportement modulaire.
species.arch.blackboard=🧠 Architecture à Tableau Blanc
species.arch.blackboard.desc=Système de mémoire partagée centralisée où les agents lisent et écrivent les besoins communs.
species.arch.fsm=🧠 Moteur à États Finis (FSM)
species.arch.fsm.desc=Automate déterministe avec transitions rapides d'états (Fourrage, Défense, Soins, Repos).
species.arch.fuzzy_logic=🧠 Moteur de Logique Floue
species.arch.fuzzy_logic.desc=Moteur d'inférence floue permettant de gérer des conditions ambiguës et progressives.
species.arch.hybrid=🧠 Architecture Hybride
species.arch.hybrid.desc=Combinaison hybride associant FSM/Arbre réactif avec planification cognitive BDI.
species.arch.neural_network=🧠 Réseau de Neurones Artificiels
species.arch.neural_network.desc=Réseau de neurones artificiels (SNN/ANN) traitant des signaux sensoriels continus.

species.venom.none=🚫 Sans Venin (Attaque Physique)
species.venom.none.desc=Aucun venin chimique. Combat exclusivement par morsures mandibulaires et force mécanique.
species.venom.formic_acid=🧪 Acide Formique (Projections)
species.venom.formic_acid.desc=Projections à distance ou application d'acide formique concentré causant des brûlures chimiques.
species.venom.venomous_sting=🗡️ Aiguillon Venimeux (Piqûre)
species.venom.venomous_sting.desc=Injection directe de venin protéique au moyen d'un aiguillon abdominal rétractable.
species.venom.chemical_spray=💨 Projections Chimiques Répulsives
species.venom.chemical_spray.desc=Projections de substances chimiques répulsives ou corrosives entraînant la désorientation.
species.venom.acid_spray=💨 Projections d'Acides Répulsifs
species.venom.acid_spray.desc=Projections de substances chimiques répulsives ou corrosives entraînant la désorientation.
species.venom.powerful_mandibles=✂️ Mandibules Puissantes (Cisaillement)
species.venom.powerful_mandibles.desc=Mandibules hypertrophiées capables d'exercer une pression mortelle ou de décapiter des proies.
species.venom.solenopsin=🔥 Solénopsine (Alcaloïde Brûlant)
species.venom.solenopsin.desc=Toxine alcaloïde nécrosante provoquant de vives brûlures et des pustules locales (Solenopsis invicta).
species.venom.neurotoxin=🧠 Neurotoxine Paralysante
species.venom.neurotoxin.desc=Substance ciblant le système nerveux central des arthropodes pour bloquer la transmission.
species.venom.cytotoxin=🧫 Cytotoxine Nécrosante
species.venom.cytotoxin.desc=Toxine nécrosante détruisant les membranes cellulaires de l'adversaire lors de la piqûre.
species.venom.terpene_resin=🌲 Résine Terpénique Gluante
species.venom.terpene_resin.desc=Liquide terpénique visqueux expulsé sous pression de la tête des soldats nasutes.
species.venom.autothysis_bomb=💥 Autothysie (Explosion Suicidaire)
species.venom.autothysis_bomb.desc=Contraction musculaire extrême rompant la paroi abdominale et projetant une glu toxique.

