glossary.entry.nest.wax_comb.title=Rayons d'Abeille Hexagonaux (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_comb.desc=Rayons verticaux de cire à cellules hexagonales 3D parallèles (Abeilles domestiques Apis mellifera).
glossary.entry.nest.wax_pots.title=Pots de Cire & Propolis (WAX_POTS_CLUSTER)
glossary.entry.nest.wax_pots.desc=Grappes de pots sphériques en cire et propolis pour nectar et couvain (Bourdons Bombus).
glossary.entry.nest.paper.title=Nid Suspendu en Papier (PAPER_PEDUNCULATE)
glossary.entry.nest.paper.desc=Nid suspendu en papier mâché rattaché par un pédoncule, enveloppe protectrice (Guêpes & Frelons).
glossary.entry.nest.cathedral.title=Termitière Cathédrale (CATHEDRAL_MOUND)
glossary.entry.nest.cathedral.desc=Tourelles en ciment salivaire avec puits de ventilation convective et loges royales (Termites).
glossary.entry.nest.silk.title=Nid de Soie Arboricole (ARBOREAL_SILK_LEAF)
glossary.entry.nest.silk.desc=Capsule de feuilles vivantes cousues par de la soie larvaire dans la canopée (Fourmis tisserandes Oecophylla).
glossary.entry.nest.fungi.title=Jardins à Champignons (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.fungi.desc=Cavernes souterraines profondes hébergeant des jardins à champignons cultivés (Fourmis Atta/Acromyrmex).
glossary.entry.nest.carton.title=Nid Ligneux Cartonné (CARTON_NEST)
glossary.entry.nest.carton.desc=Nid en bois mâché cartonné accroché aux troncs et branches (Fourmis Crematogaster/Azteca).
glossary.entry.nest.bivouac.title=Bivouac Vivant (BIVOUAC_LIVING_NEST)
glossary.entry.nest.bivouac.desc=Nid temporaire vivant formé par les corps entrelacés des ouvrières (Fourmis légionnaires Eciton).
glossary.entry.nest.mound.title=Dôme d'Aiguilles (MOUND)
glossary.entry.nest.mound.desc=Dôme parabolique d'aiguilles de pin capteur de chaleur solaire (Fourmis rousses Formica rufa).
glossary.entry.nest.wood.title=Excavation de Bois Mort (TREE / DEAD_WOOD)
glossary.entry.nest.wood.desc=Galeries excavées dans le bois mort ou le cœur des arbres (Fourmis charpentières Camponotus).
glossary.entry.social.gynic.title=Structure Gynique (Monogyne / Polygyne)
glossary.entry.social.gynic.desc=MONOGYNE (1 reine unique par colonie), POLYGYNE (plusieurs reines réparties), GAMERGATES (ouvrières fécondes reproductrices).
glossary.entry.social.king.title=Roi Reproducteur (Isoptera)
glossary.entry.social.king.desc=Caractéristique clé des termites chez qui le mâle (roi) vit en permanence aux côtés de la reine.
glossary.entry.social.flight.title=Vol Nuptial & Essaimage
glossary.entry.social.flight.desc=AERIAL_SWARM (nuée aérienne), SWARM_DIVISION (division d'essaim abeilles), BUDDING (bouturage de nid), IN_NEST (accouplement interne).
glossary.entry.social.inhibition.title=Inhibition Phéromonale Royale
glossary.entry.social.inhibition.desc=Phéromone émise par la reine pour bloquer la différenciation de nouvelles reines au sein du couvain.
glossary.entry.env.dim.title=Dimensions Surfaciques (mètres)
glossary.entry.env.dim.desc=Échelle horizontale du terrarium simulé en mètres réels.
glossary.entry.env.depth.title=Profondeur Souterraine (depthMeters)
glossary.entry.env.depth.desc=Épaisseur verticale du sol simulé (0.2m à 5.0m). Limite la profondeur maximale d'excavation et les nappes phréatiques.
glossary.entry.env.res.title=Résolution Voxel (mm)
glossary.entry.env.res.desc=Précision millimétrique du maillage voxel 3D du sol (ex: 5mm/voxel).
glossary.entry.env.sig.title=Importation SIG GPS (DEM & Copernicus)
glossary.entry.env.sig.desc=Importation directe en 1 clic de données d'altitude réelles (Copernicus DEM / NASA SRTM 30m) basées sur coordonnées GPS.
glossary.entry.env.water.title=Humidité du Sol & Nappe Phréatique (%)
glossary.entry.env.water.desc=Teneur en eau du substrat nécessaire pour éviter la dessiccation des larves et maintenir le couvain.
glossary.entry.reasoning.bt.title=Arbre de Comportements (Behavior Tree)
glossary.entry.reasoning.bt.desc=Architecture hiérarchique basée sur des nœuds d'exécution (Séquences, Sélecteurs, Décorateurs et Actions) réévalués périodiquement.
glossary.entry.reasoning.blackboard.title=Architecture à Tableau Blanc (Blackboard)
glossary.entry.reasoning.blackboard.desc=Espace de mémoire partagé et décentralisé permettant aux agents de déposer et consulter des besoins prioritaires sans contrôleur central.
glossary.entry.reasoning.fsm.title=Automate à États Finis (FSM)
glossary.entry.reasoning.fsm.desc=Modèle comportemental réactif déterministe basculant entre états discrets (ex: Repos -> Exploration -> Transport) selon des déclencheurs stricts.
glossary.entry.reasoning.bdi.title=BDI (Croyances - Désirs - Intentions)
glossary.entry.reasoning.bdi.desc=Modélisation cognitive agentique à haut niveau : croyances environnementales, désirs prioritaires et plan d'action intentionnel.
glossary.entry.reasoning.fuzzy.title=Logique Floue (Fuzzy Logic)
glossary.entry.reasoning.fuzzy.desc=Moteur de décision à logique floue utilisant des degrés d'appartenance continus entre 0 et 1 pour des transitions comportementales graduelles.
glossary.entry.reasoning.hybrid.title=Moteur Hybride Combiné (Hybrid)
glossary.entry.reasoning.hybrid.desc=Architecture hybride multi-niveaux couplant une planification stratégique BDI/Arbre de Décision avec un contrôle réactif FSM ou Flou.
glossary.entry.reasoning.snn.title=Réseau de Neurones Spikant (SNN / Neural Network)
glossary.entry.reasoning.snn.desc=Moteur neuromorphique à impulsions couplé à un apprentissage par renforcement (Q-Learning / STDP) pour l'adaptation continue.
glossary.entry.sensors.subgenual.title=Organe Subgénual (Perception Vibrations)
glossary.entry.sensors.subgenual.desc=Capteur mécano-récepteur hautement sensible situé sur les tibias détectant les vibrations du sol et tambourinages d'alerte.
glossary.entry.sensors.uv.title=Boussole Lumière Polarisée UV
glossary.entry.sensors.uv.desc=Navigation céleste vectorielle utilisant la polarisation de la lumière UV du ciel (Cataglyphis / Abeilles).
glossary.entry.sensors.mandible.title=Force Mandibulaire & Cisaillement (MPa)
glossary.entry.sensors.mandible.desc=Force de morsure et pression mécanique maximale mesurée en MégaPascals.
glossary.entry.sensors.autothysis.title=Autothysis (Explosion Suicidaire)
glossary.entry.sensors.autothysis.desc=Rupture abdominale défensive libérant des sécrétions toxiques engluantes (Colobopsis explodens).
glossary.entry.sensors.arolia.title=Ventouses Tarsales (Arolia)
glossary.entry.sensors.arolia.desc=Structures d'adhésion cuticulaires assurant la marche sur parois verticales et plafonds lisses.
glossary.entry.accessory.flora.title=Flore & Ressources Végétales (FLORA)
glossary.entry.accessory.flora.desc=Plantes, graines et nectaires extrafloraux fournissant de la biomasse et du sucre.
glossary.entry.accessory.aphids.title=Pucerons Symbiotiques & Miellat (APHID_MUTUALIST)
glossary.entry.accessory.aphids.desc=Élevage de pucerons et récolte du miellat sucré échangé contre une protection contre les prédateurs.
glossary.entry.accessory.prey.title=Insectes Proies (PREY_INSECT)
glossary.entry.accessory.prey.desc=Chenilles, grillons et mouches apportant les protéines indispensables au développement des larves.
glossary.entry.accessory.predator.title=Prédateurs Spécialisés (PREDATOR)
glossary.entry.accessory.predator.desc=Araignées, fourmilions et oiseaux exerçant une pression de prédation sur les patrouilleuses.
glossary.entry.accessory.pathogen.title=Pathogènes & Parasites (PATHOGEN_PARASITE)
glossary.entry.accessory.pathogen.desc=Champignons entomopathogènes (Cordyceps), microsporidies et acariens (Varroa) affectant la santé.
glossary.entry.accessory.diapause.title=Hivernation & Diapause Automatique
glossary.entry.accessory.diapause.desc=Mise en léthargie métabolique sous 10°C ou lors du raccourcissement automnal de la photopériode.
glossary.entry.accessory.r0.title=Taux de Transmission Pathogène (R0)
glossary.entry.accessory.r0.desc=Nombre moyen d'infections secondaires générées par un individu infecté dans la colonie.
glossary.entry.accessory.lat.title=Latitude & Photopériode Solaire
glossary.entry.accessory.lat.desc=La latitude définit la déclinaison solaire et la durée du jour tout au long de l'année, synchronisant la reproduction, l'amassage et l'hivernation.
