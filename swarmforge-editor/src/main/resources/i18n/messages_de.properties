# Nest Glossary
glossary.nest.wax_comb.title=Hexagonale Bienenwaben (WAX_COMB_HEXAGONAL)
glossary.nest.wax_comb.desc=Vertikale Wachswaben mit parallelen 3D-Hexagonalzellen (Honigbienen Apis mellifera).
glossary.nest.wax_pots.title=Wachs- & Propolistöpfe (WAX_POTS_CLUSTER)
glossary.nest.wax_pots.desc=Kugelförmige Töpfe aus Wachs und Propolis für Honig und Brut (Hummeln Bombus).
glossary.nest.paper_pedunculate.title=Gehängtes Papiernest (PAPER_PEDUNCULATE)
glossary.nest.paper_pedunculate.desc=Freihängendes Papiernest mit Schutzhülle, befestigt an einem Stängel (Wespen & Hornissen).
glossary.nest.cathedral.title=Kathedralen-Termitenhügel (CATHEDRAL_MOUND)
glossary.nest.cathedral.desc=Türme aus Speichelzement mit konvektiven Lüftungsschächten und Königskammern (Termiten).
glossary.nest.arboreal_silk.title=Baum-Seidennest (ARBOREAL_SILK_LEAF)
glossary.nest.arboreal_silk.desc=Kapseln aus lebenden Blättern, verwoben mit Larvenseide in den Baumkronen (Webameisen Oecophylla).
glossary.nest.fungi_vault.title=Unterirdische Pilzgärten (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.fungi_vault.desc=Tiefe unterirdische Gewölbe mit kultivierten Pilzgärten (Blattschneiderameisen Atta/Acromyrmex).
glossary.nest.carton.title=Karton-Nest (CARTON_NEST)
glossary.nest.carton.desc=Nester aus zerkleinertem Holz und Pflanzenteilen an Stämmen und Ästen (Crematogaster/Azteca).
glossary.nest.bamboo.title=Hohle Bambusstängel (BAMBOO_STEM_NEST)
glossary.nest.bamboo.desc=Rohrnest in hohlen Stängeln oder Bambus-Internodien (Pseudomyrmex).
glossary.nest.bivouac.title=Lebendes Biwaknest (BIVOUAC_LIVING_NEST)
glossary.nest.bivouac.desc=Temporäres lebendes Nest aus ineinandergehakten Arbeiterinnenkörpern (Wanderameisen Eciton).
glossary.nest.mound.title=Piniennadel-Hügel (MOUND)
glossary.nest.mound.desc=Parabolischer Tannennadel-Hügel zur Speicherung von Sonnenwärme (Rote Waldameise Formica rufa).
glossary.nest.wood.title=Totholz-Aushebung (TREE / DEAD_WOOD)
glossary.nest.wood.desc=Ausgehöhlte Gänge in morschemen Holz oder Baumherzen (Rossameisen Camponotus).
glossary.nest.subterranean.title=Unterirdische Gänge (MATURE / SIMPLE)
glossary.nest.subterranean.desc=Netzwerk aus unterirdischen Tunneln mit Eier- und Vorratskammern.

# Social Glossary
glossary.social.queen_mode.title=Königinnen-Sozialitätsmodus
glossary.social.queen_mode.desc=MONOGYN (1 einzellne Königin), POLYGYN (mehrere verteilte Königinnen), GAMERGATEN (fruchtbare fortpflanzungsfähige Arbeiterinnen).
glossary.social.king.title=Fortpflanzungskönig
glossary.social.king.desc=Schlüsselmerkmal von Termiten, bei denen das Männchen (König) dauerhaft an der Seite der Königin lebt.
glossary.social.nuptial.title=Hochzeitsflug / Schwärmen
glossary.social.nuptial.desc=AERIAL_SWARM (Luftschwarm), SWARM_DIVISION (Bienen-Schwarmteilung), BUDDING (Nestablegerung), IN_NEST (interne Paarung).
glossary.social.inhibition.title=Pheromonale Hemmung
glossary.social.inhibition.desc=Königinnen-Pheromone zur Unterdrückung der Eierstockentwicklung von Arbeiterinnen.

# Environment Glossary
glossary.env.moisture.title=Bodenfeuchtigkeit & Hygrorezeption (%)
glossary.env.moisture.desc=Wassergehalt des Substrats zur Vermeidung der Larvenaustrocknung und Erhaltung der Pilzkulturen.
glossary.env.temperature.title=Temperatur & Wärmeregulierung (°C)
glossary.env.temperature.desc=Thermergefälle zur Steuerung des ektothermen Stoffwechsels und des Brutwachstums.
glossary.env.co2.title=Kohlendioxid-Gehalt (CO₂ ppm)
glossary.env.co2.desc=CO₂-Schwellenwert zur Auslösung von Lüftungsschacht-Bauten gegen Erstickung in tiefen Nestern.
glossary.env.solar.title=Sonneneinstrahlung & Wärmefluss
glossary.env.solar.desc=Wärmezufuhr zur Ausrichtung der Hügel und zur morgendlichen Erwärmung der Brutkammern.
glossary.env.magnetic.title=Erdmagnetfeld-Wahrnehmung (µT)
glossary.env.magnetic.desc=Geomagnetische Empfindlichkeit zur Orientierung unter Tage ohne Lichtreize.
glossary.env.soil_layers.title=Bodenschichten & Reibung (Sand, Ton, Fels)
glossary.env.soil_layers.desc=Mechanische Stabilität und Aushebungswiderstand (undurchdringlicher Fels, loser Sand, idealer Lehm).

# Reasoning Glossary
glossary.reasoning.fsm.title=Endlicher Automat (FSM)
glossary.reasoning.fsm.desc=Deterministisches reaktives Verhalten mit Übergängen zwischen diskreten Zuständen.
glossary.reasoning.fuzzy.title=Fuzzy-Logik-System
glossary.reasoning.fuzzy.desc=Kontinuierliche Entscheidungsfindung basierend auf Wahrheitsgraden (z. B. Leicht hungrig, Stark bedroht).
glossary.reasoning.bdi.title=BDI (Beliefs-Desires-Intentions)
glossary.reasoning.bdi.desc=Vollständiges kognitives Modell: Umweltüberzeugungen, priorisierte Wünsche und aktive Zielabsichten.
glossary.reasoning.nn.title=Neuronales Netzwerk / RL-Agent
glossary.reasoning.nn.desc=Adaptive neuronale Architektur oder Q-Learning zur dynamischen Routenoptimierung.
glossary.reasoning.blackboard.title=Blackboard-Architektur
glossary.reasoning.blackboard.desc=Gemeinsamer globaler Speicherplatz für Kolonie-Notfallsignale.
glossary.reasoning.bulk.title=Massen- & Schwarmdynamik (Bulk)
glossary.reasoning.bulk.desc=Makroskopische musterorientierte Modellierung mit Massendichtefeldern für Riesenschwärme.

# Biomechanics Glossary
glossary.biomech.subgenual.title=Subgenualorgan
glossary.biomech.subgenual.desc=Vibrationssensor an den Beinen zur Erkennung von Substrat-Erschütterungen bei Alarmsignalen.
glossary.biomech.uv.title=Polarisierter UV-Himmelskompass
glossary.biomech.uv.desc=UV-Lichtsensoren zur Sonnenkompass-Navigation über weite Distanzen (Wüstenameisen Cataglyphis / Bienen).
glossary.biomech.mandible.title=Mandibelkraft (MPa)
glossary.biomech.mandible.desc=Beißkraftdruck zum Schneiden von Holz, Pflanzenfasern oder Zerlegen von Beute.
glossary.biomech.autothysis.title=Autothysis (Selbstaufopferung)
glossary.biomech.autothysis.desc=Selbstmörderisches Platzen von Drüsen zur Freisetzung von Abwehrklebstoff (Colobopsis explodens).
glossary.biomech.arolia.title=Tarsale Arolia-Haftpolster
glossary.biomech.arolia.desc=Adhäsionspolster an den Füßen für Halt auf glatten vertikalen Flächen oder Decken.

