# Glossary Entries & Categories
glossary.cat.nest=Nestarchitekturen
glossary.cat.social=Sozialstruktur & Königinnen
glossary.cat.env=Boden & GIS-Geologie
glossary.cat.reasoning=Kognitive Systeme & Entscheidungen
glossary.cat.sensors=Sensoren & Biomechanik
glossary.cat.accessory=Begleitarten, Beute & Erreger

glossary.entry.nest.wax_comb.title=Sechseckige Bienenwaben (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_comb.desc=Senkrechte Wachswaben mit 3D-parallelen sechseckigen Zellen (Apis mellifera).
glossary.entry.nest.wax_pots.title=Wachs- & Propolistöpfe (WAX_POTS_CLUSTER)
glossary.entry.nest.wax_pots.desc=Anhäufungen kugelförmiger Wachs- und Propolistöpfe für Nektar und Brut (Bombus).
glossary.entry.nest.paper.title=Hängendes Papiernest (PAPER_PEDUNCULATE)
glossary.entry.nest.paper.desc=Hängendes Papiernest aus zerkautem Holz mit Schutzhülle an einem Stiel (Wespen).
glossary.entry.nest.cathedral.title=Kathedralen-Termitenhügel (CATHEDRAL_MOUND)
glossary.entry.nest.cathedral.desc=Speichel-Zement-Türme mit konvektiven Belüftungsschächten (Termiten).
glossary.entry.nest.silk.title=Baum-Seidennest (ARBOREAL_SILK_LEAF)
glossary.entry.nest.silk.desc=Kapsel aus lebenden Blättern, zusammengewebt mit Larvenseide (Oecophylla).
glossary.entry.nest.fungi.title=Pilzgärten (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.fungi.desc=Tief unterirdische Höhlen für symbiotische Pilzkulturen (Atta/Acromyrmex).
glossary.entry.nest.carton.title=Holziges Kartonnest (CARTON_NEST)
glossary.entry.nest.carton.desc=Kartonnest aus zerkautem Holz an Stämmen und Ästen (Crematogaster/Azteca).
glossary.entry.nest.bivouac.title=Lebendes Biwaknest (BIVOUAC_LIVING_NEST)
glossary.entry.nest.bivouac.desc=Temporäres Nest aus ineinandergehakten Körpern von Arbeiterinnen (Eciton).
glossary.entry.nest.mound.title=Solar-Nadelkuppel (MOUND)
glossary.entry.nest.mound.desc=Parabolische Kuppel aus Tannennadeln zur Aufnahme von Sonnenwärme (Formica rufa).
glossary.entry.nest.wood.title=Totholzaushöhlung (TREE / DEAD_WOOD)
glossary.entry.nest.wood.desc=Gänge in morschems Holz oder Kernholz (Camponotus).

glossary.entry.social.gynic.title=Gynische Struktur (Monogynie / Polygynie)
glossary.entry.social.gynic.desc=MONOGYNIE (eine Königin), POLYGYNIE (mehrere Königinnen), GAMERGATES (fruchtbare Arbeiterinnen).
glossary.entry.social.king.title=Fortpflanzungskönig (Isoptera)
glossary.entry.social.king.desc=Hauptmerkmal bei Termiten, wo das Männchen (König) dauerhaft bei der Königin lebt.
glossary.entry.social.flight.title=Hochzeitsflug & Schwärmen
glossary.entry.social.flight.desc=AERIAL_SWARM (Luftwolke), SWARM_DIVISION (Schwarmteilung), BUDDING (Ablegerbildung), IN_NEST (Verpaarung im Nest).
glossary.entry.social.inhibition.title=Königliche Pheromonhemmung
glossary.entry.social.inhibition.desc=Von der Königin abgegebenes Pheromon zur Hemmung der Königinnendifferenzierung in der Brut.

glossary.entry.env.dim.title=Oberflächenabmessungen (Meter)
glossary.entry.env.dim.desc=Horizontaler Maßstab des simulierten Terrariums in realen Metern.
glossary.entry.env.depth.title=Unterirdische Tiefe (depthMeters)
glossary.entry.env.depth.desc=Vertikale Dicke des simulierten Bodens (0,2 m bis 5,0 m).
glossary.entry.env.res.title=Voxelauflösung (mm)
glossary.entry.env.res.desc=Millimetergenaue Präzision des 3D-Voxelgitters (z. B. 5mm/Voxel).
glossary.entry.env.sig.title=GPS-GIS-Import (DEM & Copernicus)
glossary.entry.env.sig.desc=Direkter 1-Klick-Import realer Höhendaten basierend auf GPS-Koordinaten.
glossary.entry.env.water.title=Bodenfeuchte & Grundwasserspiegel (%)
glossary.entry.env.water.desc=Wassergehalt des Substrats zur Verhinderung des Austrocknens von Larven.

glossary.entry.reasoning.bt.title=Verhaltensbaum (Behavior Tree)
glossary.entry.reasoning.bt.desc=Hierarchische Architektur basierend auf regelmäßig neu bewerteten Ausführungsknoten.
glossary.entry.reasoning.blackboard.title=Blackboard-Speichersystem
glossary.entry.reasoning.blackboard.desc=Dezentraler Speicherbereich zum Veröffentlichen und Lesen von Prioritäten der Kolonie.
glossary.entry.reasoning.fsm.title=Endlicher Zustandsautomat (FSM)
glossary.entry.reasoning.fsm.desc=Deterministisches reaktives Modell, das zwischen diskreten Zuständen wechselt.
glossary.entry.reasoning.bdi.title=BDI (Überzeugungen - Wünsche - Absichten)
glossary.entry.reasoning.bdi.desc=Kognitive Modellierung auf hoher Ebene: Umweltüberzeugungen, Prioritätswünsche und Handlungspläne.
glossary.entry.reasoning.fuzzy.title=Fuzzy-Logik-System
glossary.entry.reasoning.fuzzy.desc=Entscheidungssystem mit stetigen Zugehörigkeitsgraden zwischen 0 und 1.
glossary.entry.reasoning.hybrid.title=Kombiniertes Hybridsystem
glossary.entry.reasoning.hybrid.desc=Mehrschichtige Architektur aus strategischer BDI-Planung und reaktiver FSM-Ausführung.
glossary.entry.reasoning.snn.title=Spikendes Neuronales Netz (SNN)
glossary.entry.reasoning.snn.desc=Impulsbasiertes neuromorphes System mit verstärkendem Lernen.

glossary.entry.sensors.subgenual.title=Subgenualorgan (Schwingungswahrnehmung)
glossary.entry.sensors.subgenual.desc=Ultrasensibler Mechanorezeptor an der Tibia zur Erfassung von Bodenvibrationen.
glossary.entry.sensors.uv.title=UV-Polarisations-Himmelskompass
glossary.entry.sensors.uv.desc=Vektorielle Himmelsnavigation mithilfe der UV-Polarisation des Himmels (Cataglyphis / Bienen).
glossary.entry.sensors.mandible.title=Mandibelkraft & Scherkraft (MPa)
glossary.entry.sensors.mandible.desc=Beißkraft und maximaler mechanischer Druck in Megapascal.
glossary.entry.sensors.autothysis.title=Autothysis (Selbstmord-Explosion)
glossary.entry.sensors.autothysis.desc=Abwehrbedingtes Zerplatzen des Hinterleibs mit Freisetzung klebriger Sekrete (Colobopsis explodens).
glossary.entry.sensors.arolia.title=Tarsale Haftpolster (Arolia)
glossary.entry.sensors.arolia.desc=Strukturen zur Haftung an glatten vertikalen Wänden und Decken.

glossary.entry.accessory.flora.title=Flora & Pflanzliche Ressourcen (FLORA)
glossary.entry.accessory.flora.desc=Pflanzen, Samen und extraflorale Nektarien als Biomasse- und Zuckerquelle.
glossary.entry.accessory.aphids.title=Symbiotische Blattläuse & Honigtau (APHID_MUTUALIST)
glossary.entry.accessory.aphids.desc=Blattlauszucht und Ernte von zuckerhaltigem Honigtau gegen Schutz vor Räubern.
glossary.entry.accessory.prey.title=Beuteinsekten (PREY_INSECT)
glossary.entry.accessory.prey.desc=Raupen, Heimchen und Fliegen als wesentliche Proteinquelle für die Brut.
glossary.entry.accessory.predator.title=Spezialisierte Räuber (PREDATOR)
glossary.entry.accessory.predator.desc=Spinnen, Ameisenlöwen und Vögel, die Jagddruck auf die Kolonie ausüben.
glossary.entry.accessory.pathogen.title=Erreger & Parasiten (PATHOGEN_PARASITE)
glossary.entry.accessory.pathogen.desc=Entomopathogene Pilze (Cordyceps), Mikrosporidien und Milben (Varroa).
glossary.entry.accessory.diapause.title=Automatische Überwinterung & Diapause
glossary.entry.accessory.diapause.desc=Stoffwechselstarre unter 10°C oder bei Verkürzung der herbstlichen Photoperiode.
glossary.entry.accessory.r0.title=Erreger-Übertragungsrate (R0)
glossary.entry.accessory.r0.desc=Durchschnittliche Anzahl von Sekundärinfektionen pro infiziertem Individuum.
glossary.entry.accessory.lat.title=Breitengrad & Solare Photoperiode
glossary.entry.accessory.lat.desc=Der Breitengrad bestimmt die Sonnendeklinations- und Tageslängenänderungen im Jahresverlauf und synchronisiert Fortpflanzung, Sammelaktivität und Überwinterung.

