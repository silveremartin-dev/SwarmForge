glossary.engine.audio_synth.desc=Echtzeit-Soundsynthesizer zur Modellierung von Stridulation, Flügelbrummen und Umweltgeräuschen.
glossary.engine.audio_synth.title=Prozeduraler Audio-Synthesizer
glossary.engine.dt.desc=Physikalisches Zeitintervall zur Regelung der numerischen Integration (dt konfigurierbar).
glossary.engine.dt.title=Zeitschritt-Multiplikator (dt-Schritt & Sub-stepping)
glossary.engine.god_mode.desc=Modul für direkte Echtzeit-Eingriffe (Katastrophen, Ressourcenänderungen, Populationssteuerung).
glossary.engine.god_mode.title=Gott-Modus & System-Eingriffe
glossary.engine.multi_colony.desc=Gleichzeitige Simulation mehrerer konkurrierender oder symbiotischer Kolonien im selben Voxelraum.
glossary.engine.multi_colony.title=Multi-Kolonien & Dynamische Kastenverfolgung
glossary.engine.seed.desc=Deterministischer Zufalls-Seed für exakte 100%ige Reproduzierbarkeit in der Wissenschaft.
glossary.engine.seed.title=Deterministischer Seed (Master Seed)
glossary.engine.time_scale.desc=Umrechnung von Simulations-Ticks in reale Zeiteinheiten (Sekunden, Tage, Diapause).
glossary.engine.time_scale.title=Reale Zeitrechnung & Ökologische Uhr
glossary.env.co2.desc=CO₂-Konzentration in tiefen Gängen durch Respiration. Löst Belüftungsverhalten aus.
glossary.env.co2.title=Kohlendioxid (CO₂ ppm) & Belüftung
glossary.env.magnetic.desc=Erdfeld-Magnetorezeption über Magnetitpartikel zur Orientierung in absoluter Dunkelheit.
glossary.env.magnetic.title=Erdmagnetfeld (µT) & Magnetorezeption
glossary.env.moisture.desc=Bodenfeuchte in Prozent zur Erhaltung der Larvenhaut, Pilzgärten und Bodenelastizität.
glossary.env.moisture.title=Bodenfeuchtigkeit & Hygrorezeption (%)
glossary.env.pressure.desc=Luftdruckschwankungen zur Warnung vor Stürmen und Auslösen von Nestschließungen.
glossary.env.pressure.title=Luftdruck (hPa) & Barorezeption
glossary.env.soil_layers.desc=Physikalische Eigenschaften der Bodenschichten (Sand, Ton, Humus, Fels) für Grabgeschwindigkeiten.
glossary.env.soil_layers.title=Bodenschichten, Korngröße & Reibung
glossary.env.solar.desc=Intensität der Sonneneinstrahlung auf Kuppeln und Auswirkung auf die Morgenerwärmung.
glossary.env.solar.title=Sonneneinstrahlung & Wärmefluss
glossary.env.temperature.desc=Umgebungstemperatur bestimmt Stoffwechselrate, Entwicklungsdauer und Aktivität.
glossary.env.temperature.title=Temperatur & Thermoregulation (°C)
glossary.env.trail_pheromones.desc=Chemische Spuren zur Verbindung des Nests mit ergiebigen Nahrungsquellen.
glossary.env.trail_pheromones.title=Pheromonspuren & Flüchtigkeit
glossary.nest.arboreal_carton.desc=Ausgedehntes Kartontunnelnetz entlang von Ästen bis in die Baumkrone.
glossary.nest.arboreal_carton.title=Hängendes Baumgänge-Netzwerk (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=Baumnest aus zusammengewebten Blättern mithilfe von Seide produzierenden Larven (Oecophylla).
glossary.nest.arboreal_silk.title=Baum-Seidennest (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=Röhrennest in hohlen Bambusstängeln mit speziellem Kopfverschluss der Arbeiterinnen.
glossary.nest.bamboo.title=Hohle Bambusstängel (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=Temporäres dynamisches Nest aus den ineinandergehakten Körpern von Hunderttausenden Arbeiterinnen.
glossary.nest.bivouac.title=Lebendes Biwaknest (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=Schwammige Struktur aus zerkleinerten Pflanzenfasern und Kotzement an Baumstämmen.
glossary.nest.carton.title=Holziges Kartonnest (CARTON_NEST)
glossary.nest.cathedral.desc=Imposante Hügel von Termiten mit konvektiver Belüftung zur passiven Klimaregelung.
glossary.nest.cathedral.title=Kathedralen-Termitenhügel (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=Tief unterirdische Höhlen für symbiotische Pilzgärten (Leucoagaricus) von Blattschneiderameisen.
glossary.nest.fungi_vault.title=Pilzgärten (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=Baumnest in morschem Holz von Baumstämmen oder dicken Ästen.
glossary.nest.hollow_trunk_nest.title=Stammhöhlennest (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=Biologische Baustoffe: EARTH, WOOD_PULP_PAPER, BEESWAX, STERCORAL_CEMENT, SILK_WEAVE, PROPOLIS, CARTON_PULP, LIVING_INSECT_BODIES.
glossary.nest.materials.title=Biologische Baumaterialien
glossary.nest.mound.desc=Parabolische Kuppel aus Tannennadeln und Zweigen zur Solarerwärmung (Formica rufa).
glossary.nest.mound.title=Solar-Nadelkuppel (MOUND)
glossary.nest.paper_pedunculate.desc=Hängendes Papiernest aus zerkautem Holz und Speichel an einem dünnen Stiel.
glossary.nest.paper_pedunculate.title=Hängendes Papiernest (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=Entwicklungsstadien: Gründung (<200 Ind.), Etabliert (~25%), Ausgewachsen (100%), Superkolonie (>200%).
glossary.nest.stages.title=Reifestadien & Nestevolution
glossary.nest.subterranean.desc=Komplexes 3D-System unterirdischer Gänge und Kammern für Brut, Nahrung und Fluchtwege.
glossary.nest.subterranean.title=Unterirdische Gänge (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=Durch Kalkzementierung verstärkte unterirdische Struktur mit hoher Einsturzsicherheit.
glossary.nest.subterranean_lime.title=Kalkzement-Nester (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=Senkrechte sechseckige Waben aus reinem Bienenwachs zur optimalen Platznutzung und Isolation.
glossary.nest.wax_comb.title=Sechseckige Bienenwaben (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=Eiförmige Wachs- und Propolistöpfe von Hummeln zur Speicherung von Nektar und Pollen.
glossary.nest.wax_pots.title=Wachs- & Propolistöpfe (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=Gängesystem im Inneren von morschen Baunstümpfen oder Baumstämmen.
glossary.nest.wood.title=Totholzaushöhlung (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=Modulare Holzbeute mit beweglichen Rahmen zur Honigernte und Überwinterung.
glossary.nest.wooden_beehive.title=Holzbienenstock mit Rahmen (WOODEN_BEEHIVE)
glossary.reasoning.bt.desc=Hierarchische Entscheidungsstruktur (Verhaltensbaum) zur reaktiven Aufgabenauswahl.
glossary.reasoning.bt.title=Verhaltensbaum (Behavior Tree)
glossary.reasoning.blackboard.desc=Gemeinsamer Speicherbereich für Umweltsignale und Nestanforderungen ohne zentrale Steuerung.
glossary.reasoning.blackboard.title=Blackboard-Architektur
glossary.reasoning.fsm.desc=Deterministischer Zustandsautomat für Reaktionen auf Schwellenwerte (Ruhe -> Suche -> Transport).
glossary.reasoning.fsm.title=Endlicher Zustandsautomat (FSM)
glossary.reasoning.bdi.desc=Kognitives Agentenmodell mit Überzeugungen (Beliefs), Wünschen (Desires) und Absichten (Intentions).
glossary.reasoning.bdi.title=BDI (Überzeugungen - Wünsche - Absichten)
