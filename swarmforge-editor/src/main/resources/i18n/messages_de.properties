glossary.reasoning.fuzzy.title=Fuzzy-Logik (Fuzzy Logic)
glossary.reasoning.hybrid.desc=Mehrschichtige hybride Architektur aus BDI-Planung und FSM-Ausführung.
glossary.reasoning.hybrid.title=Hybrides Entscheidungsmodul
glossary.reasoning.nn.desc=Spikendes neuronales Netz mit verstärkendem Lernen zur Anpassung an Hindernisse.
glossary.reasoning.nn.title=Spikendes Neuronales Netz (SNN)
glossary.reasoning.bulk.desc=Makroskopische Schwarmmodellierung zur Hochleistungsberechnung großer Mengen.
glossary.reasoning.bulk.title=Massen-Schwarm-Simulation
glossary.reasoning.quorum.desc=Schwellenwert der Dichte zur kollektiven Bestätigung von Nistplatzentscheidungen.
glossary.reasoning.quorum.title=Quorum-Sensing-Erkennung
glossary.social.inhibition.desc=Ständige königliche Pheromonabgabe zur Hemmung der Ovarialentwicklung bei Arbeiterinnen.
glossary.social.inhibition.title=Königliche Pheromonhemmung
glossary.social.king.desc=Dauerhaftes männliches Fortpflanzungstier in monogamer Paarung bei Termiten.
glossary.social.king.title=Fortpflanzungskönig (Termiten)
