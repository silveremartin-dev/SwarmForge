# Nest Glossary
glossary.nest.wax_comb.title=Panales Hexagonales de Cera (WAX_COMB_HEXAGONAL)
glossary.nest.wax_comb.desc=Panales verticales de cera con celdas hexagonales 3D paralelas (Abejas domésticas Apis mellifera).
glossary.nest.wax_pots.title=Vasilijas de Cera y Propóleo (WAX_POTS_CLUSTER)
glossary.nest.wax_pots.desc=Cúmulos de vasijas esféricas de cera y propóleo para miel y cría (Abejorros Bombus).
glossary.nest.paper_pedunculate.title=Nido Colgante de Papel (PAPER_PEDUNCULATE)
glossary.nest.paper_pedunculate.desc=Nido colgante de papel mache fijado por un pedúnculo protector (Avispas y Avispones).
glossary.nest.cathedral.title=Termitero Catedral (CATHEDRAL_MOUND)
glossary.nest.cathedral.desc=Torretas de cemento salival con conductos de ventilación convectiva y cámaras reales (Termitas).
glossary.nest.arboreal_silk.title=Nido de Seda Arborícola (ARBOREAL_SILK_LEAF)
glossary.nest.arboreal_silk.desc=Cápsula de hojas vivas tejidas con seda larval en el dosel (Hormigas tejedoras Oecophylla).
glossary.nest.fungi_vault.title=Jardines de Hongos Subterráneos (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.fungi_vault.desc=Bóvedas subterráneas profundas que albergan jardines de hongos cultivados (Hormigas cortadoras Atta/Acromyrmex).
glossary.nest.carton.title=Nido Cartonado (CARTON_NEST)
glossary.nest.carton.desc=Nidos de madera masticada cartonada adheridos a troncos y ramas (Hormigas Crematogaster/Azteca).
glossary.nest.bamboo.title=Tallos Huecos de Bambú (BAMBOO_STEM_NEST)
glossary.nest.bamboo.desc=Nido tubular en el interior de tallos huecos o internodos de bambú (Hormigas Pseudomyrmex).
glossary.nest.bivouac.title=Vivac Vivo (BIVOUAC_LIVING_NEST)
glossary.nest.bivouac.desc=Nido temporal vivo formado por los cuerpos entrelazados de las obreras (Hormigas legionarias Eciton).
glossary.nest.mound.title=Domo de Acículas (MOUND)
glossary.nest.mound.desc=Domo parabólico de acículas de pino que atrapa el calor solar (Hormiga roja de la madera Formica rufa).
glossary.nest.wood.title=Excavación en Madera Muerta (TREE / DEAD_WOOD)
glossary.nest.wood.desc=Galerías excavadas en troncos en descomposición o madera viva (Hormigas carpinteras Camponotus).
glossary.nest.subterranean.title=Galerías Subterráneas (MATURE / SIMPLE)
glossary.nest.subterranean.desc=Red de túneles subterráneos elementales o maduros con cámaras de huevos y almacenamiento.

# Social Glossary
glossary.social.queen_mode.title=Modo de Socialidad de la Reina
glossary.social.queen_mode.desc=MONÓGINO (1 sola reina), POLÍGINO (múltiples reinas distribuidas), GAMERGATES (obreras fértiles reproductoras).
glossary.social.king.title=Rey Reproductor
glossary.social.king.desc=Característica clave de las termitas donde el macho reproductor (rey) vive permanentemente junto a la reina.
glossary.social.nuptial.title=Vuelo Nupcial / Enjambrazón
glossary.social.nuptial.desc=AERIAL_SWARM (enjambre aéreo), SWARM_DIVISION (división de enjambre de abejas), BUDDING (gemación de nido), IN_NEST (apareamiento interno).
glossary.social.inhibition.title=Inhibición Feromonal
glossary.social.inhibition.desc=Feromonas de la reina que bloquean el desarrollo ovárico de las obreras y evitan la diferenciación de nuevas reinas.

# Environment Glossary
glossary.env.moisture.title=Humedad del Suelo e Higrorrecepción (%)
glossary.env.moisture.desc=Contenido de agua del sustrato esencial para evitar la desecación de las larvas y mantener los cultivos de hongos.
glossary.env.temperature.title=Temperatura y Regulación Térmica (°C)
glossary.env.temperature.desc=Gradientes térmicos que regulan las tasas metabólicas ectotérmicas y el crecimiento del embrión.
glossary.env.co2.title=Nivel de Dióxido de Carbono (CO₂ ppm)
glossary.env.co2.desc=Umbral de CO₂ que desencadena la construcción de pozos de ventilación para evitar la asfixia en el nido.
glossary.env.solar.title=Radiación Solar y Flujo Térmico
glossary.env.solar.desc=Entrada de calor que orienta los domos y calienta las cámaras superiores durante la mañana.
glossary.env.magnetic.title=Percepción del Campo Magnético Terrestre (µT)
glossary.env.magnetic.desc=Sensibilidad geomagnética que permite a las termitas y hormigas orientarse sin luz visual.
glossary.env.soil_layers.title=Capas de Suelo y Fricción (Arena, Arcilla, Roca)
glossary.env.soil_layers.desc=Estabilidad mecánica y resistencia a la excavación (roca impenetrable, arena suelta, tierra franco-arcillosa).

# Reasoning Glossary
glossary.reasoning.fsm.title=Autómata de Estados Finitos (FSM)
glossary.reasoning.fsm.desc=Comportamiento reactivo determinista que transiciona entre estados discretos.
glossary.reasoning.fuzzy.title=Sistema de Lógica Difusa
glossary.reasoning.fuzzy.desc=Toma de decisiones continua basada en grados de verdad (ej. Ligeramente hambriento, Muy amenazado).
glossary.reasoning.bdi.title=BDI (Creencias-Deseos-Intenciones)
glossary.reasoning.bdi.desc=Modelo cognitivo completo: creencias sobre el entorno, deseos prioritarios e intenciones de acción.
glossary.reasoning.nn.title=Red Neuronal / Agente RL
glossary.reasoning.nn.desc=Arquitectura neuronal adaptativa o aprendizaje Q para optimización dinámica de rutas de forrajeo.
glossary.reasoning.blackboard.title=Arquitectura de Pizarra (Blackboard)
glossary.reasoning.blackboard.desc=Espacio de memoria global compartido donde los agentes especialistas publican señales de emergencia.
glossary.reasoning.bulk.title=Dinámica de Masas y Enjambres (Bulk)
glossary.reasoning.bulk.desc=Modelado macroscópico basado en campos de densidad de masa para grandes enjambres.

# Biomechanics Glossary
glossary.biomech.subgenual.title=Órgano Subgenual
glossary.biomech.subgenual.desc=Sensor vibratorio tibia-tarsal para detectar micro-percusiones del sustrato en señales de alarma.
glossary.biomech.uv.title=Brújula Celestial UV Polarizada
glossary.biomech.uv.desc=Sensores de luz UV polarizada para navegación solar a larga distancia (Hormigas del desierto Cataglyphis / Abejas).
glossary.biomech.mandible.title=Fuerza Mandibular (MPa)
glossary.biomech.mandible.desc=Presión de mordida para cortar madera muerta, fibra vegetal o desmembrar presas.
glossary.biomech.autothysis.title=Autothysis (Ruptura Suicida)
glossary.biomech.autothysis.desc=Ruptura suicida de glándulas hipertrofiadas que liberan pegamento defensivo tóxico (Colobopsis explodens).
glossary.biomech.arolia.title=Almohadillas Tarsales Arolia
glossary.biomech.arolia.desc=Almohadillas adhesivas para agarre en superficies lisas verticales o techos.

