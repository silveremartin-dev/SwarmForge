glossary.biomech.antennal_olfaction.desc=Sensilias olfativas en las antenas para la percepción estereoscópica de gradientes químicos.
glossary.biomech.antennal_olfaction.title=Sensibilidad Antenal y Olfato 3D
glossary.biomech.arolia.desc=Almohadillas adhesivas entre las uñas tarsales para caminar sobre superficies verticales y vidrio.
glossary.biomech.arolia.title=Almohadillas Tarsales (Arolios) y Adhesión
glossary.biomech.autothysis.desc=Mecanismo de defensa extremo donde las obreras hacen explotar su abdomen (Colobopsis explodens).
glossary.biomech.autothysis.title=Autotisis (Defensa Explosiva Suicida)
glossary.biomech.mandible.desc=Presión de cierre de las mandíbulas, desde el corte de hojas hasta mandíbulas trampa (200 km/h en Odontomachus).
glossary.biomech.mandible.title=Fuerza Mandibular y Potencia de Mandíbulas (MPa)
glossary.biomech.subgenual.desc=Órgano en la tibia muy sensible a microvibraciones del sustrato (100 a 1000 Hz).
glossary.biomech.subgenual.title=Órgano Subgenual
glossary.biomech.uv.desc=Navegación óptica mediante la polarización ultravioleta de la luz solar (Cataglyphis).
glossary.biomech.uv.title=Brújula Celestial UV y Polarización
