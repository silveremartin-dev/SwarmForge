sim.preset.desc.amazon=🌴 SCENARIO 2: NEOTROPICAL ECOSYSTEM & FUNGICULTURE (Atta sexdens)\nSimulates mandatory mutualistic symbiosis between leafcutter ants and Leucoagaricus gongylophorus basidiomycete fungus. Media/major workers cut fresh canopy foliage, transport it along pheromone highways on the forest floor, and chew it to create subterranean fungal gardens. Minima tend the mycelium and inoculate anti-Escovopsis antibiotic secretions.
sim.preset.desc.beehive=🐝 SCENARIO 5: APIS MELLIFERA COLONY ORGANIZATION (Subterranean Hive / Trunks)\nSimulation of a honeybee superorganism. Foragers perform waggle dances encoding direction in polar angle and distance to nectary patches. Internal brood thermal regulation at 35°C via wing beating and passive ventilation, royal jelly production by nurses.
sim.preset.desc.claustral=🔬 SCENARIO 1: CLAUSTRAL SOLITARY FOUNDATION (Lasius niger)\nDynamic post-nuptial summer flight modeling. A fertilized queen founds her colony in strict underground seclusion without external foraging. She catabolizes her own histolyzed wing muscles and lipid reserves to feed the first generation of nanitic workers (minima). Temperate undergrowth ecosystem with stabilized humidity (75-85%) and spring thermal gradient.
sim.preset.desc.granivore=🌾 ESCENARIO 3: ECOSISTEMA XÉRICO Y RECOLECTORAS GRANÍVORAS (Messor barbarus / Pogonomyrmex)
sim.preset.desc.supercolony=🌴 SCENARIO 8: INVASIVE POLYCALIC SUPERCOLONY (Linepithema humile)\nLarge-scale decentralized inter-nest network. Absence of inter-nest unicolonial aggressiveness and continuous flow of queens and workers between secondary nests (calies). Competition through aggressive exploitation and food resource monopolization.
sim.preset.desc.taiga=🌲 SCENARIO 7: BOREAL NEEDLE DOME & SOLAR THERMOREGULATION (Formica rufa)\nConiferous forest mountain colony. Construction of south-facing pine needle mounds capturing spring infrared radiation. Workers bask in the sun to transport accumulated heat into deep chambers (solarium thermal accumulation behavior).
sim.preset.desc.termites=🕳️ SCENARIO 6: SUBTERRANEAN CATHEDRAL MOUND & BIOCLIMATIZATION (Reticulitermes / Macrotermes)\nConstruction and maintenance of an architectural dome with thermodynamic convective ventilation. Worker termites digest wood lignocellulose via symbiotic protozoa and Termitomyces fungi while regulating CO2 concentrations and nest humidity.
sim.preset.desc.war=⚔️ SCENARIO 4: INTERSPECIFIC TERRITORIAL WAR & COMPETITION (Solenopsis vs Lasius)\nDirect territorial clash between invasive fire ants Solenopsis invicta (solenopsin alkaloid venom stings, aggressive mass recruitment) and native black ants Lasius niger (formic acid, mound defense). Intense competition for protein resources (arthropod carcasses) and honeydew-producing aphid colonies.
