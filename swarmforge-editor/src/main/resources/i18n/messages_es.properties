glossary.engine.audio_synth.desc=Sintetizador de sonido en tiempo real para estridulación, zumbidos y sonidos ambientales.
glossary.engine.audio_synth.title=Sintetizador de Audio Procedimental
glossary.engine.dt.desc=Paso de tiempo físico integrado para resolver ecuaciones de simulación (dt configurable).
glossary.engine.dt.title=Multiplicador de Paso Temporal (dt Step & Sub-stepping)
glossary.engine.god_mode.desc=Módulo de intervención directa en tiempo real (desastres, recursos, poblaciones).
glossary.engine.god_mode.title=Modo Dios e Intervenciones del Sistema
glossary.engine.multi_colony.desc=Simulación simultánea de múltiples colonias competidoras o simbióticas en el mismo espacio.
glossary.engine.multi_colony.title=Múltiples Colonias y Seguimiento de Castas
glossary.engine.seed.desc=Semilla aleatoria determinista para asegurar un 100% de reproducibilidad científica.
glossary.engine.seed.title=Semilla Determinista (Master Seed)
glossary.engine.time_scale.desc=Conversión de ciclos de simulación en unidades de tiempo reales (segundos, días, diapausa).
glossary.engine.time_scale.title=Escala Temporal Real y Reloj Ecológico
glossary.entry.accessory.aphids.desc=Cría de pulgones y recolección de melaza azucarada a cambio de protección.
glossary.entry.accessory.aphids.title=Pulgones Simbiontes y Melaza (APHID_MUTUALIST)
glossary.entry.accessory.diapause.desc=Letargo metabólico por debajo de 10°C o reducción del fotoperiodo otoñal.
glossary.entry.accessory.diapause.title=Hibernación Automática y Diapausa
glossary.entry.accessory.flora.desc=Plantas, semillas y nectarios extraflorales que aportan biomasa y azúcares.
glossary.entry.accessory.flora.title=Flora y Recursos Vegetales (FLORA)
glossary.entry.accessory.lat.desc=La latitud define la declinación solar y la duración del día a lo largo del año, sincronizando la reproducción, recolección e hibernación.
glossary.entry.accessory.lat.title=Latitud y Fotoperiodo Solar
glossary.entry.accessory.pathogen.desc=Hongos entomopatógenos (Cordyceps), microsporidios y ácaros (Varroa) que afectan la salud.
glossary.entry.accessory.pathogen.title=Patógenos y Parásitos (PATHOGEN_PARASITE)
glossary.entry.accessory.predator.desc=Arañas, hormigas león y aves que ejercen presión depredadora sobre la colonia.
glossary.entry.accessory.predator.title=Depredadores Especializados (PREDATOR)
glossary.entry.accessory.prey.desc=Orugas, grillos y moscas que aportan proteínas esenciales para el desarrollo larval.
glossary.entry.accessory.prey.title=Insectos Presa (PREY_INSECT)
glossary.entry.accessory.r0.desc=Número promedio de infecciones secundarias generadas por un individuo infectado.
glossary.entry.accessory.r0.title=Tasa de Transmisión del Patógeno (R0)
glossary.entry.accessory.trophic_web.desc=Red dinámica de interacciones presa-depredador que regula la biomasa y el aporte proteico en el ecosistema.
glossary.entry.accessory.trophic_web.title=Redes Tróficas y Cadenas Alimentarias
glossary.entry.accessory.commensalism.desc=Asociación biológica neutra a beneficiosa donde organismos cohabitan en el nido sin dañar la colonia.
glossary.entry.accessory.commensalism.title=Comensalismo y Mirmecofilia
glossary.entry.accessory.myrmecochory.desc=Transporte mutualista de semillas provistas de elaiosomas nutritivos recolectados por obreras.
glossary.entry.accessory.myrmecochory.title=Mirmecocoria y Dispersión de Semillas
glossary.entry.accessory.parasitoidism.desc=Insectos o ácaros especializados que se infiltran en nidos para explotar la cría o reservas.
glossary.entry.accessory.parasitoidism.title=Parasitoidismo y Parásitos de Nido
glossary.entry.social.polycalism.desc=Interconexión cooperativa de múltiples nidos satélite que comparten obreras, crías y comida sin agresividad.
glossary.entry.social.polycalism.title=Policalismo y Redes de Supercolonias
glossary.entry.env.microclimate.desc=Regulación térmica e hídrica precisa en bóvedas de galerías para prevenir la desecación y brotes de hongos.
glossary.entry.env.microclimate.title=Microclimat Subterráneo y Gradiente Hídrico
glossary.entry.env.depth.desc=Grosor vertical del suelo simulado (0.2m a 5.0m).
glossary.entry.env.depth.title=Profundidad Subterránea (depthMeters)
glossary.entry.env.dim.desc=Escala horizontal del terrario simulado en metros reales.
glossary.entry.env.dim.title=Dimensiones Superficiales (metros)
glossary.entry.env.res.desc=Precisión milimétrica de la rejilla de vóxeles 3D (ej. 5mm/vóxel).
glossary.entry.env.res.title=Resolución Vóxel (mm)
glossary.entry.env.sig.desc=Importación directa con 1 clic de datos reales de elevación basados en coordenadas GPS.
glossary.entry.env.sig.title=Importación SIG GPS (DEM y Copernicus)
glossary.entry.env.water.desc=Contenido de agua del sustrato necesario para prevenir la deshidratación de crías.
glossary.entry.env.water.title=Humedad del Suelo y Nivel Freático (%)
glossary.entry.nest.bivouac.desc=Nido temporal formado por los cuerpos entrelazados de obreras (Eciton).
glossary.entry.nest.bivouac.title=Nido Viviente en Vivac (BIVOUAC_LIVING_NEST)
glossary.entry.nest.carton.desc=Nido de cartón de madera masticada suspendido en troncos y ramas (Crematogaster/Azteca).
glossary.entry.nest.carton.title=Nido de Cartón Leñoso (CARTON_NEST)
glossary.entry.nest.cathedral.desc=Torres de cemento salival con conductos de ventilación convectiva (Termitas).
glossary.entry.nest.cathedral.title=Termitero Catedral (CATHEDRAL_MOUND)
glossary.entry.nest.fungi.desc=Cavernas subterráneas profundas que albergan cultivos de hongos simbiontes (Atta/Acromyrmex).
glossary.entry.nest.fungi.title=Bóvedas de Cultivos de Hongos (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.mound.desc=Domo parabólico de acículas de pino para captar calor solar (Formica rufa).
glossary.entry.nest.mound.title=Domo Solar de Acículas (MOUND)
glossary.entry.nest.paper.desc=Nido colgado de papel masticado unido por pedúnculo con envoltura protectora (Avispas).
glossary.entry.nest.paper.title=Nido Colgado de Papel (PAPER_PEDUNCULATE)
glossary.entry.nest.silk.desc=Cápsula de hojas vivas tejida con seda larval en el dosel (Oecophylla).
glossary.entry.nest.silk.title=Nido Arbóreo de Seda (ARBOREAL_SILK_LEAF)
glossary.entry.nest.wax_comb.desc=Panales de cera verticales con celdas hexagonales paralelas 3D (Apis mellifera).
glossary.entry.nest.wax_comb.title=Panales Hexagonales de Abejas (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_pots.desc=Cúmulos de vasijas esfēricas de cera y propóleo para néctar y crías (Bombus).
glossary.entry.nest.wax_pots.title=Vasijas de Cera y Propóleo (WAX_POTS_CLUSTER)
glossary.entry.nest.wood.desc=Galerías excavadas en madera en descomposición o duramen (Camponotus).
glossary.entry.nest.wood.title=Excavación en Madera Muerta (TREE / DEAD_WOOD)
glossary.entry.reasoning.bdi.desc=Modelado cognitivo de alto nivel: creencias ambientales, deseos prioritarios y planes de acción.
glossary.entry.reasoning.bdi.title=BDI (Creencias - Deseos - Intenciones)
glossary.entry.reasoning.blackboard.desc=Espacio de memoria descentralizado para publicar y leer necesidades prioritarias de la colonia.
glossary.entry.reasoning.blackboard.title=Sistema de Memoria Pizarra
glossary.entry.reasoning.bt.desc=Arquitectura jerárquica basada en nodos de ejecución reevaluados periódicamente.
glossary.entry.reasoning.bt.title=Árbol de Comportamiento (Behavior Tree)
glossary.entry.reasoning.fsm.desc=Modelo reactivo determinista que conmuta entre estados discretos.
glossary.entry.reasoning.fsm.title=Máquina de Estados Finitos (FSM)
glossary.entry.reasoning.fuzzy.desc=Motor de decisión difusa que utiliza grados de pertenencia continuos entre 0 y 1.
glossary.entry.reasoning.fuzzy.title=Motor de Lógica Difusa
glossary.entry.reasoning.hybrid.desc=Arquitectura híbrida que combina planificación estratégica BDI con ejecución reactiva FSM.
glossary.entry.reasoning.hybrid.title=Motor Híbrido Combinado
glossary.entry.reasoning.snn.desc=Motor neuromórfico por impulsos acoplado con aprendizaje por refuerzo.
glossary.entry.reasoning.snn.title=Red Neuronal de Impulsos (SNN)
glossary.entry.sensors.arolia.desc=Estructuras de adhesión cuticular para desplazamiento en cristales y techos lisos.
glossary.entry.sensors.arolia.title=Almohadillas Tarsales de Succión (Arolios)
glossary.entry.sensors.autothysis.desc=Ruptura abdominal defensiva que libera secreciones tóxicas pegajosas (Colobopsis explodens).
glossary.entry.sensors.autothysis.title=Autotisis (Ruptura Suicida)
glossary.entry.sensors.mandible.desc=Fuerza de mordida y presión mecánica máxima medida en MegaPascales.
glossary.entry.sensors.mandible.title=Fuerza Mandibular y Cizallamiento (MPa)
glossary.entry.sensors.subgenual.desc=Sensor mecanorreceptor ultrasensible en la tibia para detectar vibraciones del suelo.
glossary.entry.sensors.subgenual.title=Órgano Subgenual (Percepción de Vibraciones)
glossary.entry.sensors.uv.desc=Navegación celestial vectorial mediante polarización UV del cielo (Cataglyphis / Abejas).
glossary.entry.sensors.uv.title=Brújula de Luz Polarizada UV
glossary.entry.social.flight.desc=AERIAL_SWARM (nube aérea), SWARM_DIVISION (división de enjambre), BUDDING (gemación), IN_NEST (apareamiento interno).
glossary.entry.social.flight.title=Vuelo Nupcial y Enjambrazón
glossary.entry.social.gynic.desc=MONOGINIA (una reina), POLIGINIA (múltiples reinas), GAMERGATES (obreras reproductoras fértiles).
glossary.entry.social.gynic.title=Estructura Gínica (Monoginia / Poliginia)
glossary.entry.social.inhibition.desc=Feromona emitida por la reina para suprimir la diferenciación de nuevas reinas en la cría.
glossary.entry.social.inhibition.title=Inhibición Feromonal Real
glossary.entry.social.king.desc=Característica clave de termitas donde el macho (rey) vive permanentemente junto a la reina.
glossary.entry.social.king.title=Rey Reproductor (Isoptera)
glossary.env.co2.desc=Concentración de CO₂ en galerías profundas resultante de la respiración. Desencadena ventilación.
glossary.env.co2.title=Dióxido de Carbono (CO₂ ppm) y Ventilación
glossary.env.magnetic.desc=Detección del campo magnético terrestre para orientación subterránea en oscuridad total.
glossary.env.magnetic.title=Campo Magnético Terrestre (µT) y Magnetorrecepción
glossary.env.moisture.desc=Porcentaje de saturación de agua vital para crías, cultivos de hongos y estabilidad del suelo.
glossary.env.moisture.title=Humedad del Suelo e Higrorrecepción (%)
glossary.env.pressure.desc=Variaciones de presión barométrica que previenen tempestades y provocan el cierre del nido.
glossary.env.pressure.title=Presión Atmosférica (hPa) y Barorrecepción
glossary.env.soil_layers.desc=Propiedades físicas del suelo (arena, arcilla, humus, roca) para velocidad de excavación.
glossary.env.soil_layers.title=Capas del Suelo, Granulometría y Fricción
glossary.env.solar.desc=Intensidad de radiación solar directa que afecta el calentamiento del nido y la orientación.
glossary.env.solar.title=Radiación Solar y Flujo Térmico
glossary.env.temperature.desc=Temperatura ambiental que dicta la tasa metabólica, desarrollo larval y actividad.
glossary.env.temperature.title=Temperatura y Termorregulación (°C)
glossary.env.trail_pheromones.desc=Rastros químicos depositados por recolectoras para guiar a la colonia hacia el alimento.
glossary.env.trail_pheromones.title=Rastros de Feromonas y Volatilidad
glossary.link.wikipedia=🌐 Wikipedia
glossary.nest.arboreal_carton.desc=Red extendida de túneles de cartón a lo largo de ramas hasta el dosel.
glossary.nest.arboreal_carton.title=Red Aérea de Túneles (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=Nido arbóreo construido tejiendo hojas con seda producida por larvas (Oecophylla).
glossary.nest.arboreal_silk.title=Nido Arbóreo de Seda (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=Nido tubular que aprovecha internodos huecos de bambú sellados con cabezas de obreras especializadas.
glossary.nest.bamboo.title=Tallos Huecos de Bambú (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=Nido temporal dinámico formado exclusivamente por los cuerpos entrelazados de miles de obreras.
glossary.nest.bivouac.title=Nido Viviente en Vivac (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=Estructura esponjosa de fibras vegetales masticadas y cemento fecal adherida a troncos o rocas.
glossary.nest.carton.title=Nido de Cartón Leñoso (CARTON_NEST)
glossary.nest.cathedral.desc=Nidos monumentales de termitas con canales de ventilación convectiva para climatización pasiva.
glossary.nest.cathedral.title=Termitero Catedral (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=Bóvedas subterráneas profundas para albergar cultivos de hongos simbiontes de hormigas cortadoras.
glossary.nest.fungi_vault.title=Bóvedas de Cultivos de Hongos (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=Nido arbóreo excavado en la madera en descomposición de troncos de árboles.
glossary.nest.hollow_trunk_nest.title=Cavidad en Tronco Hueco (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=Materiales biológicos: EARTH, WOOD_PULP_PAPER, BEESWAX, STERCORAL_CEMENT, SILK_WEAVE, PROPOLIS, CARTON_PULP, LIVING_INSECT_BODIES.
glossary.nest.materials.title=Materiales Biológicos de Construcción
glossary.nest.mound.desc=Domo parabólico de acículas de pino que funciona como colector solar térmico (Formica rufa).
glossary.nest.mound.title=Domo Solar de Acículas (MOUND)
glossary.nest.paper_pedunculate.desc=Nido colgado de papel hecho de madera masticada y saliva, unido por un pedúnculo repelente.
glossary.nest.paper_pedunculate.title=Nido Colgado de Papel (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=Etapas de madurez: Fundación (<200 ind.), Establecida (~25%), Madura (100%), Supercolonia (>200%).
glossary.nest.stages.title=Etapas de Madurez y Evolución del Nido
glossary.nest.subterranean.desc=Red 3D de galerías subterráneas para crías, reina, almacén de alimentos y salidas de emergencia.
glossary.nest.subterranean.title=Galerías Subterráneas (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=Estructura subterránea reforzada cementando partículas de caliza con saliva contra erupciones.
glossary.nest.subterranean_lime.title=Nidos Cementados Calcáreos (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=Estructura vertical de panales hexagonales de cera construida por abejas para maximizar espacio.
glossary.nest.wax_comb.title=Panales Hexagonales de Cera (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=Cúmulo de vasijas ovoides de cera y propóleo de moscardones para almacenar miel y polen.
glossary.nest.wax_pots.title=Vasijas de Cera y Propóleo (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=Sistema de galerías excavadas directamente en la madera en descomposición de tocones o troncos.
glossary.nest.wood.title=Excavación en Madera Muerta (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=Colmena de madera modular con cuadros móviles para almacenamiento de miel y termorregulación.
glossary.nest.wooden_beehive.title=Colmena de Cuadros de Madera (WOODEN_BEEHIVE)
glossary.reasoning.bdi.desc=Modelo cognitivo basado en Creencias (Beliefs), Deseos (Desires) e Intenciones (Intentions).
glossary.reasoning.bdi.title=BDI (Creencias - Deseos - Intenciones)
glossary.reasoning.blackboard.desc=Espacio de memoria compartida donde los agentes leen y escriben señales ambientales.
glossary.reasoning.blackboard.title=Arquitectura Pizarra (Blackboard)
glossary.reasoning.bt.desc=Árbol de decisiones jerárquico para la selección reactiva de tareas según estímulos.
glossary.reasoning.bt.title=Árbol de Comportamiento (Behavior Tree)
glossary.reasoning.bulk.desc=Simulación macroscópica de enjambre para cálculo masivo de grandes poblaciones.
glossary.reasoning.bulk.title=Simulación Macroscópica de Enjambre
glossary.reasoning.fsm.desc=Máquina de estados finitos determinista para transiciones discretas (Reposo -> Búsqueda -> Transporte).
glossary.reasoning.fsm.title=Máquina de Estados Finitos (FSM)
glossary.reasoning.fuzzy.desc=Motor de lógica difusa que utiliza grados continuos de pertenencia entre 0 y 1.
glossary.reasoning.fuzzy.title=Lógica Difusa (Fuzzy Logic)
glossary.reasoning.hybrid.desc=Arquitectura híbrida multinivel que combina planificación BDI y ejecución FSM.
glossary.reasoning.hybrid.title=Motor de Decisión Híbrido
glossary.reasoning.nn.desc=Red neuronal de impulsos con aprendizaje por refuerzo adaptable a obstáculos.
glossary.reasoning.nn.title=Red Neuronal de Impulsos (SNN)
glossary.reasoning.quorum.desc=Umbral de densidad para la toma de decisiones colectivas sobre sitios de anidación.
glossary.reasoning.quorum.title=Detección por Quórum (Quorum Sensing)
glossary.search_prompt=🔍 Buscar parámetro, especie, arquitectura o concepto (ej. Perlin, SRTM, Cordyceps, BDI, Diapausa)...
glossary.social.inhibition.desc=Inhibición continua del desarrollo ovárico de las obreras por feromonas reales.
glossary.social.inhibition.title=Inhibición Feromonal Real
glossary.social.king.desc=Macho reproductor permanente en pareja monógama con la reina de termitas.
glossary.social.king.title=Rey Reproductor (Termitas)
glossary.social.nuptial.desc=Estrategias de dispersión: AERIAL_SWARM, SWARM_DIVISION, BUDDING.
glossary.social.nuptial.title=Vuelo Nupcial y Enjambrazón
glossary.social.polyethism.desc=División del trabajo por edad (polietismo de edad) o morfología (polietismo de casta).
glossary.social.polyethism.title=Polietismo de Casta y Edad
glossary.social.queen_mode.desc=Estructura reproductiva: MONOGYNE, POLYGYNE, GAMERGATES.
glossary.social.queen_mode.title=Modo de Reina y Estructura Reproductiva
glossary.social.stigmergy.desc=Mecanismo de coordinación indirecta mediante modificaciones en el entorno.
glossary.social.stigmergy.title=Estigmergia y Autoorganización
glossary.social.trophallaxis.desc=Intercambio de alimento líquido boca a boca para compartir nutrientes, microbios y hormonas.
glossary.social.trophallaxis.title=Trofalaquia y Intercambio de Recursos
glossary.species.desiccation.desc=Capacidad fisiológica de la epicutícula y los espiráculos para restringir la evaporación del agua corporal bajo baja humedad atmosférica y elevadas temperaturas.
glossary.species.desiccation.title=Resistencia a la Desecación Atmosférica
glossary.species.formic_acid.desc=Sustancia corrosiva defensiva y ofensiva (ácido metanoico) secretada por la glándula de veneno de las hormigas Formicinae, pulverizada a través del acidoporo para paralizar presas o repeler depredadores.
glossary.species.formic_acid.title=Ácido Fórmico y Armas Químicas
glossary.species.hydrocarbons.desc=Mezcla compleja de ceras, lípidos y alcanos que recubre el exoesqueleto de los insectos eusociales. Protege contra la desecación atmosférica y constituye el olor de colonia para el reconocimiento de compañeros e intrusos.
glossary.species.hydrocarbons.title=Hidrocarburos Cuticulares e Identidad Química
glossary.species.metabolism.desc=Tasa básica de consumo de reservas de nutrientes (azúcares, lípidos) requerida para la homeostasis celular y el esfuerzo mecánico durante la forrajación o excavación.
glossary.species.metabolism.title=Tasa Metabólica Basal y Gasto Energético
glossary.species.polymorphism.desc=Diferenciación morfológica de tamaño y forma entre obreras de una misma colonia. Las obreras minors cuidan la cría, mientras que las majors desarrollan cabezas hipertrofiadas para triturar semillas o defender el nido.
glossary.species.polymorphism.title=Polimorfismo de Obreras (Majors, Medias, Minors)
glossary.subtitle=Referencia completa que centraliza todos los parámetros de simulación, métricas biológicas, sensores, sustratos y nidos.
