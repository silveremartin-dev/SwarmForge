# === Expanded Pedagogical Glossary & Scientific Keys ===
glossary.species.hydrocarbons.title=Cuticular Hydrocarbons & Chemical Identity
glossary.species.hydrocarbons.desc=A complex blend of epicuticular waxes, lipids, and alkanes coating the insect exoskeleton. It prevents atmospheric desiccation and forms the chemical "colony odor" used for nestmate recognition and intruder detection.
glossary.species.formic_acid.title=Formic Acid & Chemical Weapons
glossary.species.formic_acid.desc=A corrosive defensive and offensive chemical (methanoic acid) secreted by the venom gland of Formicinae ants, sprayed via the acidopore to blind prey or deter predators.
glossary.species.metabolism.title=Basal Metabolic Rate & Energy Expenditure
glossary.species.metabolism.desc=The baseline rate of nutrient reserve consumption (sugars, lipids) required for cellular homeostasis and mechanical locomotion during foraging or excavation.
glossary.species.polymorphism.title=Worker Polymorphism (Majors, Medias, Minors)
glossary.species.polymorphism.desc=Morphological size and shape differentiation among workers within a single colony. Minor workers tend larvae, whereas majors develop enlarged heads and muscles for seed milling or defense.
glossary.species.desiccation.title=Atmospheric Desiccation Resistance
glossary.species.desiccation.desc=The physiological capacity of the epicuticle and spiracles to restrict body water evaporation under low atmospheric humidity and high ambient thermal stress.
