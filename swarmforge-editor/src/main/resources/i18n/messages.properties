glossary.biomech.antennal_olfaction.desc=Olfatory sensilla lining the antennae providing stereoscopic perception of chemical gradients. Allows individuals to decipher complex colony pheromone bouquets.
glossary.biomech.antennal_olfaction.title=Antennal Sensitivity & 3D Olfaction
glossary.biomech.arolia.desc=Flexible adhesive pads located between tarsal claws. Thanks to micro-capillary liquid film secretion, insects can walk on smooth vertical surfaces and glass.
glossary.biomech.arolia.title=Tarsal Pads (Arolia) & Adhesion
glossary.biomech.autothysis.desc=Extreme defense mechanism where workers violently contract abdominal muscles until rupture, releasing sticky toxic glue paralyzing invaders (Colobopsis explodens).
glossary.biomech.autothysis.title=Autothysis (Suicidal Exploding Defense)
glossary.biomech.mandible.desc=Mechanical closing pressure of mandibles. Ranges from delicate leaf cutting to catapult trap-jaw snapping in Odontomachus reaching 200 km/h.
glossary.biomech.mandible.title=Mandibular Force & Jaw Power (MPa)
glossary.biomech.subgenual.desc=Ultrasensitive chordotonal organ located in tibia. Detects substrate micro-vibrations (100 to 1000 Hz) to sense alarm signals or cave-ins.
glossary.biomech.subgenual.title=Subgenual Organ
glossary.biomech.uv.desc=Optical navigation system using ultraviolet sky polarization patterns. Allows desert ants (Cataglyphis) to return to nest in straight lines.
glossary.biomech.uv.title=UV Celestial Compass & Polarization
glossary.dialog.header=Detailed Guide to Biological Parameters, Climate & Architectures
glossary.dialog.title=📖 Glossary & Eusocial Design Guide
glossary.engine.audio_synth.desc=Real-time sound synthesizer modeling ant stridulation, wing hums, and ambient rain/wind via FM/subtractive synthesis.
glossary.engine.audio_synth.title=Procedural Audio Synthesizer
glossary.engine.dt.desc=Physical time step integrated into numerical simulation (configurable dt from 16.6 ms to 1s).
glossary.engine.dt.title=Time Step Multiplier (dt Step & Sub-stepping)
glossary.engine.god_mode.desc=Direct intervention module allowing climate disasters, resource adjustments, and population alterations in real time.
glossary.engine.god_mode.title=God Mode & System Interventions
glossary.engine.multi_colony.desc=Simultaneous handling of multiple competing or symbiotic colonies within the same voxel space.
glossary.engine.multi_colony.title=Multi-Colony & Dynamic Caste Tracking
glossary.engine.seed.desc=Master pseudo-random seed ensuring 100% deterministic reproducibility for scientific research.
glossary.engine.seed.title=Deterministic Master Seed
glossary.engine.time_scale.desc=Timestamping system converting simulation ticks into real-world time units (seconds, days, seasonal diapause).
glossary.engine.time_scale.title=Real Temporal Scale & Ecological Clock
glossary.env.co2.desc=CO₂ concentration in deep tunnels resulting from collective respiration. Triggers ventilation behaviors when exceeding thresholds (>2%).
glossary.env.co2.title=Carbon Dioxide (CO₂ ppm) & Ventilation
glossary.env.magnetic.desc=Geomagnetic field detection via body magnetite particles, aiding subterranean orientation in complete darkness.
glossary.env.magnetic.title=Earth Magnetic Field (µT) & Magnetoreception
glossary.env.moisture.desc=Substrate water saturation percentage vital for cuticular moisture, brood development, and fungus garden growth.
glossary.env.moisture.title=Soil Moisture & Hygroreception (%)
glossary.env.pressure.desc=Barometric pressure variations warning insects of incoming storms, triggering nest closure and flight halt.
glossary.env.pressure.title=Atmospheric Pressure (hPa) & Baroreception
glossary.env.soil_layers.desc=Physical properties of soil strata (sand, clay, humus, rock) determining excavation speed and collapse risk.
glossary.env.soil_layers.title=Soil Layers, Granulometry & Friction
glossary.env.solar.desc=Direct solar radiation intensity affecting mound warming, dew evaporation, and foraging trip orientation.
glossary.env.solar.title=Solar Radiation & Thermal Flux
glossary.env.temperature.desc=Ambient temperature dictating metabolic rate, embryonic development time, and foraging intensity.
glossary.env.temperature.title=Temperature & Thermoregulation (°C)
glossary.env.trail_pheromones.desc=Chemical trails deposited by foragers guiding colony movement to abundant food sources.
glossary.env.trail_pheromones.title=Pheromone Trails & Volatility
glossary.nest.arboreal_carton.desc=Extensive carton tunnel network along branches up to canopy level protecting foragers from UV and predators.
glossary.nest.arboreal_carton.title=Suspended Arboreal Nest (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=Arboreal pavilion constructed from living leaves woven together with silk produced by Oecophylla larvae.
glossary.nest.arboreal_silk.title=Arboreal Leaf Silk Nest (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=Tubular nest utilizing hollow stem internodes sealed with specialized worker cephalic plugs.
glossary.nest.bamboo.title=Hollow Bamboo Stems (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=Temporary dynamic architecture built exclusively from interlocking bodies of hundreds of thousands of workers.
glossary.nest.bivouac.title=Living Bivouac Nest (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=Spongy rigid envelope fashioned from chewed plant fibers and fecal cement attached to trunks or rocks.
glossary.nest.carton.title=Woody Carton Nest (CARTON_NEST)
glossary.nest.cathedral.desc=Towering mounds built by termites incorporating convective ventilation channels for passive microclimate regulation.
glossary.nest.cathedral.title=Cathedral Termite Mound (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=Subterranean vaults accommodating symbiotic Leucoagaricus fungus gardens maintained by leafcutter ants.
glossary.nest.fungi_vault.title=Fungus Garden Vaults (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=Arboreal nest excavated inside decaying wood of tree trunks or large branches.
glossary.nest.hollow_trunk_nest.title=Hollow Trunk Cavity (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=Biological construction substrates: EARTH, WOOD_PULP_PAPER, BEESWAX, STERCORAL_CEMENT, SILK_WEAVE, PROPOLIS, CARTON_PULP, LIVING_INSECT_BODIES.
glossary.nest.materials.title=Biological Construction Materials
glossary.nest.mound.desc=Parabolic pine-needle and twig dome serving as solar thermal collector for Formica rufa spring warming.
glossary.nest.mound.title=Solar Needle Mound (MOUND)
glossary.nest.paper_pedunculate.desc=Hanging paper nest formed from chewed wood fibers mixed with saliva attached via a narrow repellent-coated peduncle.
glossary.nest.paper_pedunculate.title=Hanging Paper Nest (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=Colony growth stages: Foundation (<200 ind.), Established (~25%), Mature (100%), Supercolony (>200%).
glossary.nest.stages.title=Maturity Stages & Nest Evolution
glossary.nest.subterranean.desc=3D network of subterranean tunnels and chambers for brood, queen, food storage, and escape routes.
glossary.nest.subterranean.title=Subterranean Galleries (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=Underground structure reinforced by cementing limestone particles with saliva for high erosion resistance.
glossary.nest.subterranean_lime.title=Calcareous Cement Nest (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=Vertical hexagonal wax comb structure constructed by honeybees maximizing storage efficiency and thermal insulation.
glossary.nest.wax_comb.title=Hexagonal Wax Comb (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=Cluster of ovoid wax and propolis pots built by bumblebees for honey and pollen storage.
glossary.nest.wax_pots.title=Wax & Propolis Pots Cluster (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=Longitudinal gallery system excavated directly inside decaying wood logs or tree stumps.
glossary.nest.wood.title=Dead Wood Excavation (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=Modular wooden beehive with vertical movable frames designed for honey storage and winter thermoregulation.
glossary.nest.wooden_beehive.title=Wooden Frame Beehive (WOODEN_BEEHIVE)
glossary.reasoning.bt.desc=Hierarchical behavior tree decision framework evaluating environmental triggers for reactive task selection.
glossary.reasoning.bt.title=Behavior Tree (BT)
glossary.reasoning.blackboard.desc=Shared memory architecture where agents leave environmental signals and read prioritized colony requests.
glossary.reasoning.blackboard.title=Blackboard Architecture
glossary.reasoning.fsm.desc=Deterministic reactive state machine transitioning between discrete states (Rest -> Forage -> Transport).
glossary.reasoning.fsm.title=Finite State Machine (FSM)
glossary.reasoning.bdi.desc=High-level cognitive agent architecture operating on Beliefs, Desires, and Intentions.
glossary.reasoning.bdi.title=BDI (Beliefs - Desires - Intentions)
glossary.reasoning.fuzzy.desc=Fuzzy logic engine using continuous membership degrees for smooth behavioral transitions.
glossary.reasoning.fuzzy.title=Fuzzy Logic Engine
glossary.reasoning.hybrid.desc=Multi-level hybrid architecture coupling high-level BDI planning with low-level FSM execution.
glossary.reasoning.hybrid.title=Hybrid Decision Engine
glossary.reasoning.nn.desc=Spiking neural network with reinforcement learning adapting to obstacles and predator threats.
glossary.reasoning.nn.title=Spiking Neural Network (SNN)
glossary.reasoning.bulk.desc=Macroscopic swarm density model computing aggregate crowd dynamics without individual tracking.
glossary.reasoning.bulk.title=Bulk Swarm Simulation
glossary.reasoning.quorum.desc=Density-dependent collective decision threshold preventing premature site selection.
glossary.reasoning.quorum.title=Quorum Sensing Detection
glossary.social.inhibition.desc=Continuous queen pheromone release inhibiting worker ovary development.
glossary.social.inhibition.title=Royal Pheromonal Inhibition
glossary.social.king.desc=Permanent male reproductive living in monogamous pair with termite queen.
glossary.social.king.title=Reproductive King (Termites)
glossary.social.nuptial.desc=Colony dispersal strategies: AERIAL_SWARM, SWARM_DIVISION, BUDDING.
glossary.social.nuptial.title=Nuptial Flight & Swarming
glossary.social.polyethism.desc=Division of labor based on age (age polyethism) or morphology/caste (caste polyethism).
glossary.social.polyethism.title=Caste & Age Polyethism
glossary.social.queen_mode.desc=Reproductive structure mode: MONOGYNE, POLYGYNE, GAMERGATES.
glossary.social.queen_mode.title=Queen Mode & Reproductive Structure
glossary.social.stigmergy.desc=Indirect coordination mechanism through environmental trace modifications driving self-organization.
glossary.social.stigmergy.title=Stigmergy & Self-Organization
glossary.social.trophallaxis.desc=Mouth-to-mouth or anus-to-mouth liquid food transfer conveying nutrients, gut microbes, and hormones.
glossary.social.trophallaxis.title=Trophallaxis & Resource Sharing
