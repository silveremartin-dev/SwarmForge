# Nest Glossary
glossary.nest.wax_comb.title=Hexagonal Honeycomb Combs (WAX_COMB_HEXAGONAL)
glossary.nest.wax_comb.desc=Vertical wax combs with 3D parallel hexagonal cells (Honeybees Apis mellifera).
glossary.nest.wax_pots.title=Wax & Propolis Pots (WAX_POTS_CLUSTER)
glossary.nest.wax_pots.desc=Clusters of spherical wax and propolis pots for honey, pollen, and brood (Bumblebees Bombus).
glossary.nest.paper_pedunculate.title=Pedunculate Paper Nest (PAPER_PEDUNCULATE)
glossary.nest.paper_pedunculate.desc=Hanging paper envelope nest attached by a central peduncle (Wasps & Hornets).
glossary.nest.cathedral.title=Cathedral Termite Mound (CATHEDRAL_MOUND)
glossary.nest.cathedral.desc=Salivary cement turrets with convective ventilation shafts and royal chambers (Termites).
glossary.nest.arboreal_silk.title=Arboreal Silk Leaf Nest (ARBOREAL_SILK_LEAF)
glossary.nest.arboreal_silk.desc=Living leaf capsules stitched with larval silk high in the canopy (Weaver ants Oecophylla).
glossary.nest.fungi_vault.title=Subterranean Fungus Gardens (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.fungi_vault.desc=Deep underground vaults harboring cultivated fungus gardens (Leafcutter ants Atta/Acromyrmex).
glossary.nest.carton.title=Carton Nest (CARTON_NEST)
glossary.nest.carton.desc=Masticated wood and fiber carton nests attached to trunks and branches (Crematogaster/Azteca ants).
glossary.nest.bamboo.title=Hollow Bamboo Stems (BAMBOO_STEM_NEST)
glossary.nest.bamboo.desc=Tubular nest inside hollow stems or bamboo internodes (Pseudomyrmex ants).
glossary.nest.bivouac.title=Living Bivouac Nest (BIVOUAC_LIVING_NEST)
glossary.nest.bivouac.desc=Temporary living nest formed by interlinked bodies of worker ants (Army ants Eciton).
glossary.nest.mound.title=Thatch Needle Mound (MOUND)
glossary.nest.mound.desc=Parabolic pine needle dome designed to trap solar heat (Red wood ants Formica rufa).
glossary.nest.wood.title=Dead Wood Excavation (TREE / DEAD_WOOD)
glossary.nest.wood.desc=Galleries excavated inside decaying logs or tree heartwood (Carpenter ants Camponotus).
glossary.nest.subterranean.title=Subterranean Galleries (MATURE / SIMPLE)
glossary.nest.subterranean.desc=Network of elementary or mature underground tunnels with egg and storage chambers.

# Social Glossary
glossary.social.queen_mode.title=Queen Sociality Mode
glossary.social.queen_mode.desc=MONOGYNOUS (1 single queen), POLYGYNOUS (multiple distributed queens), GAMERGATES (fertile worker reproducers).
glossary.social.king.title=Reproductive King
glossary.social.king.desc=Key termite feature where the reproductive male (king) lives permanently alongside the queen.
glossary.social.nuptial.title=Swarming / Nuptial Flight
glossary.social.nuptial.desc=AERIAL_SWARM (aerial cloud), SWARM_DIVISION (bee swarm split), BUDDING (nest budding), IN_NEST (internal mating).
glossary.social.inhibition.title=Pheromonal Inhibition
glossary.social.inhibition.desc=Queen primer pheromones preventing worker ovary development and blocking new queen differentiation.

# Environment Glossary
glossary.env.moisture.title=Soil Moisture & Hygroreception (%)
glossary.env.moisture.desc=Substrate water content essential to prevent larval desiccation and maintain fungal crops.
glossary.env.temperature.title=Temperature & Thermal Regulation (°C)
glossary.env.temperature.desc=Thermal gradients governing ectothermic metabolic rates and brood development speed.
glossary.env.co2.title=Carbon Dioxide Level (CO₂ ppm)
glossary.env.co2.desc=CO₂ threshold triggering convective ventilation shaft construction to avoid deep nest asphyxiation.
glossary.env.solar.title=Solar Radiation & Heat Flux
glossary.env.solar.desc=Thermal input driving dome orientation and morning heating of upper incubators.
glossary.env.magnetic.title=Geomagnetic Field Perception (µT)
glossary.env.magnetic.desc=Geomagnetic sensitivity allowing subterranean ants and termites to orient without light cues.
glossary.env.soil_layers.title=Soil Layers & Friction (Sand, Clay, Rock)
glossary.env.soil_layers.desc=Mechanical stability and excavation resistance (impenetrable rock, loose sand, optimal loam).

# Reasoning Glossary
glossary.reasoning.fsm.title=Finite State Machine (FSM)
glossary.reasoning.fsm.desc=Deterministic reactive behavior transitioning between discrete states (e.g., Forage -> Return Nest).
glossary.reasoning.fuzzy.title=Fuzzy Logic System
glossary.reasoning.fuzzy.desc=Continuous decision-making based on degrees of truth (e.g., Slightly Hungry, Highly Threatened).
glossary.reasoning.bdi.title=BDI (Beliefs-Desires-Intentions)
glossary.reasoning.bdi.desc=Full cognitive model: environmental beliefs, prioritized desires, and active goal intentions.
glossary.reasoning.nn.title=Neural Network / RL Agent
glossary.reasoning.nn.desc=Adaptive neural architecture or Q-learning model optimizing foraging routes dynamically.
glossary.reasoning.blackboard.title=Blackboard Architecture
glossary.reasoning.blackboard.desc=Shared global memory space where specialist agents post and process colony emergency signals.
glossary.reasoning.bulk.title=Bulk / Crowd Swarm Dynamics
glossary.reasoning.bulk.desc=Macroscopic pattern-oriented modeling using mass-density fields for mega-swarm simulations.

# Biomechanics Glossary
glossary.biomech.subgenual.title=Subgenual Organ
glossary.biomech.subgenual.desc=Tibia-tarsal vibrational sensor detecting substrate micro-percussions for panic alarms.
glossary.biomech.uv.title=Polarized UV Celestial Compass
glossary.biomech.uv.desc=UV polarized light sensors enabling long-distance solar compass navigation (Desert ants Cataglyphis / Bees).
glossary.biomech.mandible.title=Mandibular Force (MPa)
glossary.biomech.mandible.desc=Bite force pressure for cutting dead wood, fibrous plant material, or dismembering prey.
glossary.biomech.autothysis.title=Autothysis (Suicidal Rupture)
glossary.biomech.autothysis.desc=Suicidal bursting of hypertrophied glands releasing toxic defensive glue (Colobopsis explodens).
glossary.biomech.arolia.title=Tarsal Arolia Pads
glossary.biomech.arolia.desc=Adhesive footpads providing grip on smooth vertical glass or ceilings.

