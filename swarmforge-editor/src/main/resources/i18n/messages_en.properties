glossary.biomech.antennal_olfaction.desc=Stereoscopic chemical sensory perception via antennal sensilla, enabling precise 3D bouquet decoding.
glossary.biomech.antennal_olfaction.title=Antennal Sensitivity & 3D Olfaction
glossary.biomech.arolia.desc=Flexible adhesive tarsal pads utilizing micro-capillary liquid films to walk effortlessly on vertical glass and ceilings.
glossary.biomech.arolia.title=Tarsal Arolia Pads & Adhesion
glossary.biomech.autothysis.desc=Extreme defensive sacrifice where workers rupture abdominal walls to release sticky toxic secretions, immobilizing invaders (Colobopsis explodens).
glossary.biomech.autothysis.title=Autothysis (Suicidal Bursting)
glossary.biomech.mandible.desc=Mandibular bite pressure and strike velocity, ranging from leaf slicing to 200 km/h trap-jaw strikes in Odontomachus.
glossary.biomech.mandible.title=Mandibular Force & Trap-Jaw Speed (MPa)
glossary.biomech.subgenual.desc=Ultrasensitive chordotonal tibial sensor picking up substrate micro-percussions (100–1000 Hz) for panic and alarm signaling.
glossary.biomech.subgenual.title=Subgenual Organ
glossary.biomech.uv.desc=Optical navigation system utilizing sky UV polarization patterns, enabling desert ants (Cataglyphis) to return straight home after circuitous foraging trips.
glossary.biomech.uv.title=Polarized UV Celestial Compass
glossary.dialog.header=Detailed Guide to Biological Parameters, Climate & Nest Architectures
glossary.dialog.title=📖 Glossary & Eusocial Design Guide
glossary.engine.audio_synth.desc=Real-time sound engine generating insect stridulation, wingbeat frequencies (Hz), and ambient environmental sounds (rain, wind) via FM/subtractive WebAudio and Java Sound synthesis.
glossary.engine.audio_synth.title=Procedural Audio Synthesizer
glossary.engine.dt.desc=Physical and biological integration timestep (configurable dt from 16.6ms to 1s, up to 100x acceleration). Controls numerical integration (Euler/Verlet) for agent movement, velocity vectors, and voxel diffusion.
glossary.engine.dt.title=Time Step Multiplier (dt & Sub-stepping)
glossary.engine.god_mode.desc=Real-time intervention module allowing live injection of natural disasters (flash floods, acid rain), instant modification of trophic reserves (sugars, proteins, water), and forced creation or culling of entity populations.
glossary.engine.god_mode.title=God Mode & System Interventions
glossary.engine.multi_colony.desc=Simultaneous tracking of competing or symbiotic colonies within a unified voxel grid space. Each colony maintains isolated pheromone channels, caste ratio matrices, and real-time telemetry analytics.
glossary.engine.multi_colony.title=Multi-Colony System & Dynamic Caste Tracking
glossary.engine.seed.desc=64-bit pseudo-random master seed (e.g. Seed 42, LCG/Xoroshiro) guaranteeing 100% exact reproducible simulation runs, agent decision branches, and climate trajectories across platforms.
glossary.engine.seed.title=Deterministic Master Seed
glossary.engine.time_scale.desc=Temporal converter mapping raw simulation ticks into real physical time units (seconds, minutes, hours, seasonal diapause days) across all dashboards and exported CSV metrics.
glossary.engine.time_scale.title=Real Time-Scale & Ecological Clock
glossary.env.co2.desc=CO₂ concentration inside deep galleries resulting from thousand-worker respiration. Elevated levels (>2%) trigger convective air shaft opening or wing fanning.
glossary.env.co2.title=Carbon Dioxide Level (CO₂ ppm) & Ventilation
glossary.env.magnetic.desc=Geomagnetic sensing via magnetite nanocrystals in insect tissue, allowing orientation and tunnel alignment in pitch blackness.
glossary.env.magnetic.title=Geomagnetic Field Perception (µT) & Magnetoreception
glossary.env.moisture.desc=Substrate hydration percentage. Essential to prevent cuticle desiccation of eggs and larvae, while maintaining optimal fungal growth conditions and soil workability.
glossary.env.moisture.title=Soil Moisture & Hygroreception (%)
glossary.env.pressure.desc=Barometric pressure variations sensed by insects. Rapid drops signal incoming storms, prompting entry sealing and flight cessation.
glossary.env.pressure.title=Atmospheric Pressure (hPa) & Baroreception
glossary.env.soil_layers.desc=Geological substrate physical properties (loose sand, dense clay, rich loam, solid bedrock), determining excavation speed and collapse hazard.
glossary.env.soil_layers.title=Soil Layers, Grain Size & Friction
glossary.env.solar.desc=Direct solar radiation flux on the terrarium surface, driving mound heating, morning dew evaporation, and foraging trail activation.
glossary.env.solar.title=Solar Radiation & Thermal Flux
glossary.env.temperature.desc=Ambient air and nest temperature. Ectothermic metabolism, larval growth rate, and foraging activity scale directly with environmental thermal gradients.
glossary.env.temperature.title=Temperature & Thermal Regulation (°C)
glossary.env.trail_pheromones.desc=Chemical footprints deposited by foragers. Evaporation rates and continuous reinforcement establish chemical highways connecting nest to food sources.
glossary.env.trail_pheromones.title=Trail Pheromones & Volatility
glossary.nest.arboreal_carton.desc=Extensive roofed carton runways running along tree trunks and branches into the canopy, protecting foragers from UV radiation and avian predation.
glossary.nest.arboreal_carton.title=Suspended Arboreal Carton Runways (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=Canopy pavilion fashioned from living tree leaves folded and bound together by weaver ants (Oecophylla smaragdina). Workers maneuver live silk-producing larvae as weaving shuttles to bind leaves together.
glossary.nest.arboreal_silk.title=Arboreal Silk Leaf Nest (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=Tubular nesting strategy utilizing hollow bamboo internodes or twigs. Specialized arboreal ants (Pseudomyrmex, Camponotus truncatus) use phragmotic heads as living plugs to block narrow entry holes.
glossary.nest.bamboo.title=Hollow Bamboo Stems (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=Dynamic temporary nest formed entirely of the interlinked bodies of hundreds of thousands of worker ants (Eciton burchellii). Regulates brood core temperature and moves daily during nomadic hunting phases.
glossary.nest.bivouac.title=Living Bivouac Nest (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=Spongy structural matrix composed of chewed plant fibers and dried feces forming rigid alveolar envelopes. Attached to tree trunks or rocks by arboreal ants (Crematogaster, Azteca).
glossary.nest.carton.title=Carton Nest (CARTON_NEST)
glossary.nest.cathedral.desc=Towering spires of salivary cement, clay, and fecal mortar built by termites (Macrotermes, Nasutitermes). Incorporates convective thermosiphon ventilation shafts maintaining constant temperature, humidity, and low CO₂ deep within the royal chambers.
glossary.nest.cathedral.title=Cathedral Termite Mound (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=Deep subterranean vaults harboring symbiotic fungus gardens (Leucoagaricus) cultivated by leafcutter ants (Atta, Acromyrmex). Requires strict microclimate control (95-99% RH) and continuous waste evacuation.
glossary.nest.fungi_vault.title=Subterranean Fungus Gardens (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=Arboreal nest excavated inside living or decaying tree trunk wood (Camponotus, tree termites).
glossary.nest.hollow_trunk_nest.title=Tree Trunk Cavity Nest (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=Substrates and secretions used by insects: EARTH (soil/clay), WOOD_PULP_PAPER (salivary paper pulp), BEESWAX (stearic wax), STERCORAL_CEMENT (fecal mortar), SILK_WEAVE (larval silk), PROPOLIS (antibacterial plant resin), CARTON_PULP (masticated wood carton), LIVING_INSECT_BODIES (interlocked worker bodies).
glossary.nest.materials.title=Biological Construction Materials
glossary.nest.mound.desc=Parabolic mound of twigs, resin, and pine needles erected by wood ants (Formica rufa). Oriented southwards to function as a passive solar thermal collector warming the brood early in spring.
glossary.nest.mound.title=Thatch Needle Mound (MOUND)
glossary.nest.paper_pedunculate.desc=Aerial nest constructed from masticated weathered wood fiber mixed with saliva, forming waterproof paper envelope. Suspended from branches or eaves by a narrow peduncle coated in ant-repellent secretion (Polistes, Vespa wasps).
glossary.nest.paper_pedunculate.title=Pedunculate Paper Nest (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=Colony expansion cycle: Foundation (< 200 individuals, single royal chamber), Established (~25% adult size), Mature (100% adult size, full chamber distribution), Old Nest / Supercolony (> 200%, multi-shaft sprawling network).
glossary.nest.stages.title=Nest Maturity Stages & Evolution
glossary.nest.subterranean.desc=Complex 3D subterranean network of tunnels and specialized chambers for eggs, larvae, pupae, food reserves, and drainage wells.
glossary.nest.subterranean.title=Subterranean Galleries (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=Subterranean structure reinforced by cementing limestone particles with saliva and dissolved minerals. Exhibits high resistance against trampling collapses and heavy rain erosion.
glossary.nest.subterranean_lime.title=Calcareous Cement Nest (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=Vertical comb structures of pure wax secreted by sternal glands of honeybee workers (Apis mellifera). Perfect hexagonal geometry maximizes honey and brood storage volume per unit wax. Provides optimal thermal insulation and structural mechanical rigidity.
glossary.nest.wax_comb.title=Hexagonal Honeycomb Combs (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=Clusters of ovoid or spherical pots crafted from wax and propolis by bumblebees (Bombus spp.). Function as storage amphorae for liquid nectar and pollen or individual brood cells. Highly flexible layout adapting to irregular soil or rodent cavity spaces.
glossary.nest.wax_pots.title=Wax & Propolis Pots (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=Longitudinal galleries carved into decaying tree stumps or trunk heartwood (Camponotus pennsylvanicus). Leverages hardwood insulation to shield the colony from sub-zero winter temperatures and predators.
glossary.nest.wood.title=Dead Wood Excavation (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=Artificial modular wooden hive (Dadant/Langstroth) housing movable vertical frames. Standardized box layout optimized for honey harvest, ventilation, and winter thermal insulation.
glossary.nest.wooden_beehive.title=Wooden Beehive (WOODEN_BEEHIVE)
glossary.reasoning.bdi.desc=Full agentic cognitive architecture: internal beliefs about world state, prioritized desire goals, and active intention execution plans.
glossary.reasoning.bdi.title=BDI (Beliefs-Desires-Intentions)
glossary.reasoning.blackboard.desc=Shared global memory hub where specialized agents read and write colony-level alerts and priorities (e.g., water shortage, royal chamber expansion).
glossary.reasoning.blackboard.title=Blackboard Architecture
glossary.reasoning.bulk.desc=Macroscopic continuum modeling for mega-swarms, computing population mass dynamics without individual agent overhead.
glossary.reasoning.bulk.title=Bulk / Crowd Swarm Dynamics
glossary.reasoning.fsm.desc=Deterministic reactive agent architecture. Agents transition between discrete states (e.g., Idle -> Foraging -> Carrying -> Depositing) based on environmental triggers.
glossary.reasoning.fsm.title=Finite State Machine (FSM)
glossary.reasoning.fuzzy.desc=Smooth decision engine using continuous degrees of truth (e.g., "Moderately Moist", "High Hunger"), producing natural behavioral shifts.
glossary.reasoning.fuzzy.title=Fuzzy Logic Engine
glossary.reasoning.nn.desc=Adaptive neural network or Q-learning model enabling agents to learn obstacle avoidance and route optimization through trail trial-and-error.
glossary.reasoning.nn.title=Neural Network / Reinforcement Learning
glossary.reasoning.quorum.desc=Threshold density of consensus needed to trigger collective decisions such as nest relocation or swarm attacks.
glossary.reasoning.quorum.title=Quorum Sensing & Collective Choice
glossary.social.inhibition.desc=Primer chemical signal emitted continuously by the queen (e.g., 9-ODA in honeybees) suppressing worker ovary development and blocking spontaneous queen rearing.
glossary.social.inhibition.title=Royal Pheromonal Inhibition
glossary.social.king.desc=Permanent male reproducer living in a monogamous pair with the queen in Isoptera colonies. Participates in continuous fertilizing and pheromonal colony regulation.
glossary.social.king.title=Reproductive King (Termites)
glossary.social.nuptial.desc=Dispersal mechanism: AERIAL_SWARM (mass synchronized flight of alates on warm humid days), SWARM_DIVISION (colony splitting with mother queen), BUDDING (ground movement of queen and workers).
glossary.social.nuptial.title=Swarming / Nuptial Flight
glossary.social.polyethism.desc=Division of labor. Temporal polyethism means workers progress from nurse duty to nest building and finally outdoor foraging. Caste polyethism ties specialization to morphology.
glossary.social.polyethism.title=Caste & Temporal Polyethism
glossary.social.queen_mode.desc=Defines reproductive structure: MONOGYNOUS (single queen mother), POLYGYNOUS (multiple coexisting fertile queens), GAMERGATES (mated fertile workers acting as primary reproducers).
glossary.social.queen_mode.title=Queen Sociality Mode & Reproductive Polymorphism
glossary.social.stigmergy.desc=Indirect coordination system where environmental traces left by individual actions (soil pellet placement or trail pheromone) trigger and direct subsequent work by nestmates without central control.
glossary.social.stigmergy.title=Stigmergy & Self-Organization
glossary.social.trophallaxis.desc=Direct liquid food transfer stomodeally (mouth-to-mouth) or proctodeally (anal) between nestmates. Transports nutrients, gut symbionts, growth factors, and regulatory hormones.
glossary.social.trophallaxis.title=Trophallaxis & Shared Nutrition
