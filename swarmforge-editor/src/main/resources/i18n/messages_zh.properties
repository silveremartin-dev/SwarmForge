glossary.biomech.antennal_olfaction.desc=主要化学感觉知觉系统，能够检测挥发性化学梯度、痕迹信息素和同巢个体表皮碳氢化合物。
glossary.biomech.antennal_olfaction.title=触角嗅觉与信息素接收
glossary.biomech.arolia.desc=黏性脚垫，确保在光滑垂直玻璃或天花板上平稳行走。
glossary.biomech.arolia.title=跗节垫 (Arolia)
glossary.biomech.autothysis.desc=肥大腺体的自杀性破裂，释放有毒防御粘液 ( Colobopsis explodens)。
glossary.biomech.autothysis.title=自爆防御 (Autothysis)
glossary.biomech.mandible.desc=用于切割死木、植物纤维或解剖猎物的咬合压强。
glossary.biomech.mandible.title=上颚咬合力 (MPa)
glossary.biomech.subgenual.desc=胫节与跗节上的振动感受器，用于感知基质微震警报。
glossary.biomech.subgenual.title=膝下器 (Subgenual organ)
glossary.biomech.uv.desc=紫外偏振光感受器，实现长距离太阳罗盘导航 (沙漠蚁 Cataglyphis / 蜜蜂)。
glossary.biomech.uv.title=偏振紫外天体罗盘
glossary.dialog.header=生物学参数、气候与巢穴结构详细指南
glossary.dialog.title=📖 词汇表与真社会性设计指南
glossary.engine.audio_synth.desc=实时程序化音频合成，根据模拟遥测数据动态生成生物声学信号（摩擦发声、嗡嗡声等）。
glossary.engine.audio_synth.title=生物声学音频合成引擎
glossary.engine.dt.desc=固定数值积分时间步长，用于管理状态传播、碰撞更新和空间网格衰减。
glossary.engine.dt.title=增量时间（dt）与模拟步长
glossary.engine.god_mode.desc=上帝模式运行时间干预系统，允许即时生成个体、修改环境及引发灾害。
glossary.engine.god_mode.title=上帝模式与直接干预套件
glossary.engine.multi_colony.desc=多群体空间模拟基础设施，支持领地争端、种间战争和资源竞争。
glossary.engine.multi_colony.title=多群体竞争引擎
glossary.engine.seed.desc=64位确定性伪随机种子，用于控制程序化体素地形生成、生态分布和初始个体特征。
glossary.engine.seed.title=程序化世界种子
glossary.engine.time_scale.desc=时间缩放系数，调整真实时间与模拟速度的比率（从0.1倍慢动作至50倍极速）。
glossary.engine.time_scale.title=时间缩放比例因子
glossary.env.co2.desc=CO₂阈值，触发地下深巢构建对流通风井以防窒息。
glossary.env.co2.title=二氧化碳浓度 (CO₂ ppm)
glossary.env.magnetic.desc=地磁敏感性，使地下昆虫在无光环境下精确定位。
glossary.env.magnetic.title=地磁场感应 (µT)
glossary.env.moisture.desc=基质含水量，防止幼虫干燥失水并维持菌菇生长。
glossary.env.moisture.title=土壤湿度与湿度感受器 (%)
glossary.env.pressure.desc=气压变化趋势，影响婚飞触发、觅食活动阈值及灾害概率。
glossary.env.pressure.title=大气压动态
glossary.env.soil_layers.desc=机械稳定性与挖掘阻力 (坚硬岩石、松散沙土、理想壤土)。
glossary.env.soil_layers.title=土壤分层与摩擦 (沙土、黏土、岩石)
glossary.env.solar.desc=引导巢穴圆顶朝向并在清晨加热上层育幼室的热能输入。
glossary.env.solar.title=太阳辐射与热通量
glossary.env.temperature.desc=热度梯度，调控变温昆虫的新陈代谢与幼虫发育速度。
glossary.env.temperature.title=温度与体温调节 (°C)
glossary.env.trail_pheromones.desc=空间网格连续扩散图，存储化学向量痕迹并使用OpenCL加速衰减与蒸发计算。
glossary.env.trail_pheromones.title=迹线信息素扩散场
glossary.nest.arboreal_carton.desc=由咀嚼木浆与分泌物混合制成的悬挂式树栖纸质巢穴。
glossary.nest.arboreal_carton.title=树栖纸质巢穴结构
glossary.nest.arboreal_silk.desc=在树冠层使用幼虫吐丝缝合鲜活树叶缝制成的叶包巢 (织工蚁 Oecophylla)。
glossary.nest.arboreal_silk.title=树栖丝织叶巢 (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=利用竹子空心茎或节间筑成的管状巢穴 (伪切叶蚁 Pseudomyrmex)。
glossary.nest.bamboo.title=竹节空腔巢 (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=由工蚁身体相互勾连形成的临时活体巢穴 (行军蚁 Eciton)。
glossary.nest.bivouac.title=活体临时军营 (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=附着于树干与树枝上的咀嚼木纤维纸板巢 (举尾蚁 Crematogaster/Azteca)。
glossary.nest.carton.title=纸板状树巢 (CARTON_NEST)
glossary.nest.cathedral.desc=由唾液水泥粘合的塔楼，带对流通风井与王室 chambers (白蚁)。
glossary.nest.cathedral.title=教堂状白蚁丘 (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=深层地下洞穴，培育人工菌菇花园 (切叶蚁 Atta/Acromyrmex)。
glossary.nest.fungi_vault.title=地下真菌花园 (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=在树干或大树枝木质部内部凿空建造的树栖巢穴。
glossary.nest.hollow_trunk_nest.title=树干空腔巢穴 (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=昆虫使用的基质和分泌物：EARTH（土壤/粘液）、WOOD_PULP_PAPER（唾液纸浆）、BEESWAX（蜂蜡）、STERCORAL_CEMENT（粪便水泥）、SILK_WEAVE（幼虫丝）、PROPOLIS（蜂胶）、CARTON_PULP（咀嚼纸板）、LIVING_INSECT_BODIES（连锁工蜂/工蚁身体）。
glossary.nest.materials.title=生物建筑材料
glossary.nest.mound.desc=收集太阳热能的抛物线形松针土堆 (红林蚁 Formica rufa)。
glossary.nest.mound.title=松针松果圆顶巢 (MOUND)
glossary.nest.paper_pedunculate.desc=通过纸质柄悬挂并具保护外壳的纸浆巢穴 (胡蜂与黄蜂)。
glossary.nest.paper_pedunculate.title=悬挂纸质蜂巢 (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=群体扩张周期：创立阶段（<200个体，单一蚁后室）、建立阶段（~25%成年规模）、成熟阶段（100%成年规模，完整分舱分布）、古巢/超级群体（>200%，多天井蔓延网络）。
glossary.nest.stages.title=巢穴成熟阶段与演化
glossary.nest.subterranean.desc=具备卵室与储藏室的基础或成熟地下网状隧道。
glossary.nest.subterranean.title=地下隧道网 (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=开挖于土壤地层深处的高级地下加固穴窟与湿气通道。
glossary.nest.subterranean_lime.title=地下泥土与黏土拱顶巢穴结构
glossary.nest.wax_comb.desc=具有平行3D六角形巢室的垂直蜂蜡巢脾 (西方蜜蜂 Apis mellifera)。
glossary.nest.wax_comb.title=六角形蜂巢 (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=由蜂蜡和蜂胶构成的球形储粮及育幼罐簇 (熊蜂 Bombus)。
glossary.nest.wax_pots.title=蜡质与蜂胶壶 (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=在腐朽木材或树木心材中雕凿出的通道网 (木匠蚁 Camponotus)。
glossary.nest.wood.title=枯木雕凿巢 (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=标准木质组合蜂箱 (Dadant/Langstroth)，内置垂直可移动巢框。优化的箱体结构，有利于采蜜、通风和冬季保暖。
glossary.nest.wooden_beehive.title=木质蜂箱 (WOODEN_BEEHIVE)
glossary.reasoning.bdi.desc=完整认知模型：环境信念、优先欲望与行动意图。
glossary.reasoning.bdi.title=BDI 模型 (信念-欲望-意图)
glossary.reasoning.blackboard.desc=共享全局内存空间，专家 Agent 可在此发布与读取群体紧急信号。
glossary.reasoning.blackboard.title=黑板架构 (Blackboard)
glossary.reasoning.bulk.desc=基于质量密度场的宏观模式化建模，适用于超大规模蜂群模拟。
glossary.reasoning.bulk.title=群体宏观流体动力学 (Bulk)
glossary.reasoning.fsm.desc=确定性反应行为，在离散状态之间切换 (例如：觅食 -> 返巢)。
glossary.reasoning.fsm.title=有限状态机 (FSM)
glossary.reasoning.fuzzy.desc=基于真值程度的连续决策 (例如：轻微饥饿、高度受威胁)。
glossary.reasoning.fuzzy.title=模糊逻辑系统 (Fuzzy Logic)
glossary.reasoning.nn.desc=自适应神经结构或 Q-Learning 算法，动态优化觅食路线。
glossary.reasoning.nn.title=神经网络 / 强化学习 (RL Agent)
glossary.reasoning.quorum.desc=群体法定人数共识决策机制，个体相遇频率将触发集体行为质变（如搬迁）。
glossary.reasoning.quorum.title=法定人数感知与集体共识
glossary.social.inhibition.desc=蚁后分泌的信息素，可抑制工蚁卵巢发育并阻止新蚁后的分化。
glossary.social.inhibition.title=信息素抑制
glossary.social.king.desc=白蚁的核心特征，雄性蚁王终生陪伴在蚁后身旁。
glossary.social.king.title=繁殖蚁王
glossary.social.nuptial.desc=空中婚飞 AERIAL_SWARM、蜂群分群 SWARM_DIVISION、出芽分巢 BUDDING、巢内交配 IN_NEST。
glossary.social.nuptial.title=婚飞 / 分群模式
glossary.social.polyethism.desc=群体内部基于年龄（时间多工分工）或形态分级（形态多工分工）的劳动分工。
glossary.social.polyethism.title=劳动分工与多工分化
glossary.social.queen_mode.desc=单后制 MONOGYNOUS、多后制 POLYGYNOUS、补充繁殖蚁/可育工蚁 GAMERGATES。
glossary.social.queen_mode.title=蚁后社会性模式
glossary.social.stigmergy.desc=间接协调机制，个体对环境的印记修改将刺激和引导同伴的后续行动。
glossary.social.stigmergy.title=印迹协作与自组织
glossary.social.trophallaxis.desc=巢友间通过口对口或肛对口直接传递液体食物，输送营养、肠道共生体及调控激素。
glossary.social.trophallaxis.title=交哺行为与共享营养
