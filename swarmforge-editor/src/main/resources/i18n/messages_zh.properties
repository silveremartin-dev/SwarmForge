accessory.field.growth_rate=表面生长率 (g/m²/天):
accessory.field.growth_rate.tt=每平方米每天植物生物量产量或猎物再生速度。
accessory.field.hemisphere=演化半球:
accessory.field.hemisphere.tt=决定日历月份与生物季节之间的对应关系。
accessory.field.hunt_mode=捕猎 / 攻击模式:
accessory.field.hunt_mode.tt=捕获猎物或寄生的行为策略。
accessory.field.incubation_days=潜伏期 (天):
accessory.field.incubation_days.tt=从感染到出现亚致死效应或死亡的持续天数。
accessory.field.kill_rate=捕获率 (个/天):
accessory.field.kill_rate.tt=此捕食者每天捕获或消耗的最大个体数。
accessory.field.latitude=原产地纬度 (°N/°S):
accessory.field.latitude.tt=原产地纬度（北纬 °N，南纬 °S），用于计算光照周期与生命周期同步。
accessory.field.max_temp=最高生长温度 (°C):
accessory.field.max_temp.tt=高于此温度临界值时将发生严重热应激或死亡。
accessory.field.min_temp=最低生长温度 (°C):
accessory.field.min_temp.tt=低于此温度临界值时生长或繁殖停止。
accessory.field.mortality_rate=死亡率 (%/天):
accessory.field.mortality_rate.tt=受感染个体每天因感染死亡的百分比。
accessory.field.name=物种名称:
accessory.field.name.tt=生物的常用名或科学标识符。
accessory.field.opt_temp=最适温度 (°C):
accessory.field.opt_temp.tt=获得最大生长与繁殖速率的最适温度。
accessory.field.pathogen_vector=病原体媒介 / 疾病:
accessory.field.pathogen_vector.tt=疾病传播与扩散的主要途径。
accessory.field.pop_density=初始种群密度 (个/m²):
accessory.field.pop_density.tt=启动时每平方米引入的个体或生物数量。
accessory.field.target_caste=被捕食目标品级:
accessory.field.target_caste.tt=此捕食者优先猎捕的群体品级。
accessory.field.transmission_r0=传播率 R0:
accessory.field.transmission_r0.tt=患病个体产生的平均继发感染数。
