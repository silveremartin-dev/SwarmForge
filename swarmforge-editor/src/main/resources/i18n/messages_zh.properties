glossary.biomech.antennal_olfaction.desc=触角上的嗅觉感受器，用于对化学浓度梯度进行立体感知。
glossary.biomech.antennal_olfaction.title=触角敏感度与 3D 嗅觉
glossary.biomech.arolia.desc=位于爪间的中垫，用于在垂直光滑表面和玻璃上行走。
glossary.biomech.arolia.title=爪间中垫 (Arolia) 与粘附力
glossary.biomech.autothysis.desc=极端的防御机制，工蚁自爆腹部释放粘性毒液 (Colobopsis explodens)。
glossary.biomech.autothysis.title=自爆防御 (Autothysis)
glossary.biomech.mandible.desc=上颚闭合机械压力，涵盖切叶到陷阱颚弹击 (Odontomachus 可达 200 km/h)。
glossary.biomech.mandible.title=上颚闭合力 (MPa)
glossary.biomech.subgenual.desc=位于胫节的高灵敏弦音器官，用于感知底质微震动 (100-1000 Hz)。
glossary.biomech.subgenual.title=膝下器 (Subgenual Organ)
glossary.biomech.uv.desc=基于天空紫外线偏振模式的光学导航系统 (Cataglyphis)。
glossary.biomech.uv.title=UV 天空罗盘与偏振导航
