accessory.field.biomass_density=初始地表生物量 (g/m²):
accessory.field.biomass_density.tt=模拟开始时每平方米的生物质量。随生态缸总面积自动缩放。
accessory.field.biome=主要生物群落:
accessory.field.biome.tt=定义默认耐受性的原生气候区域。
accessory.field.category=生态分类:
accessory.field.category.tt=物种在生态缸生态系统中的营养级角色。
accessory.field.diapause=冬眠 / 滞育:
accessory.field.diapause.check=自动冬季滞育 (低于 10°C 时进入麻痹)
accessory.field.diapause.tt=当温度降至 10°C 以下或短日照时触发麻痹状态。
accessory.field.growth_rate=地表生长率 (g/m²/天):
accessory.field.growth_rate.tt=每平方米每天的植物生物量产量或猎物再生率。
accessory.field.hemisphere=演化半球:
accessory.field.hemisphere.tt=决定一年中月份与生物季节之间的对应关系。
accessory.field.hunt_mode=捕猎 / 攻击策略:
accessory.field.hunt_mode.tt=捕获猎物或寄生的行为策略。
accessory.field.incubation_days=潜伏期 (天):
accessory.field.incubation_days.tt=从感染到出现亚致死效应或死亡的天数。
accessory.field.kill_rate=捕获率 (个体/天):
accessory.field.kill_rate.tt=每只捕食者每天捕获或消耗的最大个体数。
accessory.field.latitude=原生栖息地纬度 (°N/°S):
accessory.field.latitude.tt=起源纬度（°N 代表北纬，°S 代表南纬），用于计算昼长。
accessory.field.max_temp=最高生长温度 (°C):
accessory.field.max_temp.tt=物种遭受严重热应激或死亡的最高温度。
accessory.field.min_temp=最低生长温度 (°C):
accessory.field.min_temp.tt=生长或繁殖停止的最低温度阈值。
accessory.field.mortality_rate=死亡率 (%/天):
accessory.field.mortality_rate.tt=每天因感染而死亡的被感染个体百分比。
accessory.field.name=物种名称:
accessory.field.name.tt=生物的俗名或科学标识符。
accessory.field.opt_temp=最佳生长温度 (°C):
accessory.field.opt_temp.tt=提供最大生长和繁殖速率的最佳温度。
accessory.field.pathogen_vector=病原体 / 疾病传播媒介:
accessory.field.pathogen_vector.tt=疾病的主要传播途径和扩散机制。
accessory.field.pop_density=初始种群密度 (个体/m²):
accessory.field.pop_density.tt=启动时每平方米引入的个体或生物数量。
accessory.field.target_caste=目标猎物阶级:
accessory.field.target_caste.tt=该捕食者优先捕猎的群体阶级。
accessory.field.transmission_r0=基本传染数 R0:
accessory.field.transmission_r0.tt=每个感染个体平均产生的二代感染数。
