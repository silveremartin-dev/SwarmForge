glossary.entry.nest.wax_comb.title=六角形蜂巢 (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_comb.desc=具有 3D 平行六角形巢室的垂直蜂蜡巢脾 (蜜蜂)。
glossary.entry.nest.wax_pots.title=蜡质与蜂胶罐集群 (WAX_POTS_CLUSTER)
glossary.entry.nest.wax_pots.desc=用于储存花蜜和育幼的球形蜡质与蜂胶罐集群 (熊蜂)。
glossary.entry.nest.paper.title=柄状悬挂纸巢 (PAPER_PEDUNCULATE)
glossary.entry.nest.paper.desc=通过巢柄悬挂的咀嚼木质纸巢，附带保护性外壳 (胡蜂与黄蜂)。
glossary.entry.nest.cathedral.title=教堂式白蚁丘 (CATHEDRAL_MOUND)
glossary.entry.nest.cathedral.desc=具有对流通风通道和蚁后室的唾液水泥塔 (白蚁)。
glossary.entry.nest.silk.title=树栖丝叶巢 (ARBOREAL_SILK_LEAF)
glossary.entry.nest.silk.desc=树冠中利用幼虫吐丝缝合活树叶构成的叶巢 (织叶蚁)。
glossary.entry.nest.fungi.title=地下真菌园拱顶 (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.fungi.desc=用于培育共生真菌园的深层地下洞穴 (切叶蚁)。
glossary.entry.nest.carton.title=木质纸浆巢 (CARTON_NEST)
glossary.entry.nest.carton.desc=悬挂在树干和树枝上的咀嚼木浆硬质纸巢 (举尾蚁/树栖蚁)。
glossary.entry.nest.bivouac.title=活体露营巢 (BIVOUAC_LIVING_NEST)
glossary.entry.nest.bivouac.desc=由工蚁身体互相扣合构成的临时活体巢穴 (行军蚁)。
glossary.entry.nest.mound.title=松针集热巢丘 (MOUND)
glossary.entry.nest.mound.desc=用于收集太阳热量的抛物线形松针巢丘 (红木蚁)。
glossary.entry.nest.wood.title=死木挖掘巢 (TREE / DEAD_WOOD)
glossary.entry.nest.wood.desc=在腐朽木材或心材内部挖掘的地道系统 (弓背蚁)。

glossary.entry.social.gynic.title=雌性繁殖结构 (单后制 / 多后制)
glossary.entry.social.gynic.desc=单后制 (每群单后), 多后制 (多后分布), 工蚁繁殖 (具繁殖能力的工蚁)。
glossary.entry.social.king.title=繁殖蚁王 (等翅目)
glossary.entry.social.king.desc=白蚁的关键特征，雄虫 (蚁王) 终生与蚁后生活在一起。
glossary.entry.social.flight.title=婚飞与分群
glossary.entry.social.flight.desc=空中婚飞 (婚飞云), 分群 (蜂群分裂), 分巢 (分出子巢), 巢内交配。
glossary.entry.social.inhibition.title=蚁后信息素抑制
glossary.entry.social.inhibition.desc=蚁后释放的信息素，用于抑制幼虫分化为新蚁后。

glossary.entry.env.dim.title=地表尺寸 (米)
glossary.entry.env.dim.desc=以实际米为单位的模拟生态缸水平尺度。
glossary.entry.env.depth.title=地下深度 (depthMeters)
glossary.entry.env.depth.desc=模拟土壤的垂直厚度 (0.2m 至 5.0m)。限制最大挖掘深度与地下水位。
glossary.entry.env.res.title=体素分辨率 (mm)
glossary.entry.env.res.desc=3D 土壤体素网格的毫米级精度 (例如 5mm/体素)。
glossary.entry.env.sig.title=GPS GIS 导入 (DEM 与 Copernicus)
glossary.entry.env.sig.desc=基于 GPS 坐标一键直接导入真实高程数据。
glossary.entry.env.water.title=土壤湿度与地下水位 (%)
glossary.entry.env.water.desc=防止幼虫脱水并维持幼虫发育所需的基质含水量。

glossary.entry.reasoning.bt.title=行为树 (Behavior Tree)
glossary.entry.reasoning.bt.desc=基于定期重新评估的执行节点的分层架构。
glossary.entry.reasoning.blackboard.title=黑板内存系统
glossary.entry.reasoning.blackboard.desc=共享的去中心化内存空间，允许个体在没有中央控制器的情况下发布和读取优先群体需求。
glossary.entry.reasoning.fsm.title=有限状态机 (FSM)
glossary.entry.reasoning.fsm.desc=在严格触发条件下在离散状态之间切换的确定性反应模型。
glossary.entry.reasoning.bdi.title=BDI (信念 - 欲望 - 意图)
glossary.entry.reasoning.bdi.desc=高级代理认知建模：环境信念、优先欲望和意图行动计划。
glossary.entry.reasoning.fuzzy.title=模糊逻辑引擎
glossary.entry.reasoning.fuzzy.desc=使用 0 到 1 之间连续隶属度的模糊决策引擎，实现平滑的行为过度。
glossary.entry.reasoning.hybrid.title=组合混合引擎
glossary.entry.reasoning.hybrid.desc=结合 BDI/决策树战略规划与反应式 FSM 或模糊控制的多层混合架构。
glossary.entry.reasoning.snn.title=脉冲神经网络 (SNN / 神经网)
glossary.entry.reasoning.snn.desc=结合强化学习的脉冲神经形态引擎，实现持续自适应。

glossary.entry.sensors.subgenual.title=膝下器 (震动感知)
glossary.entry.sensors.subgenual.desc=位于胫节上的超灵敏机械感受器，用于检测地面震动和警报鼓击。
glossary.entry.sensors.uv.title=UV 偏振光罗盘
glossary.entry.sensors.uv.desc=利用天空紫外线偏振的光学矢量天文导航 (沙漠蚁 / 蜜蜂)。
glossary.entry.sensors.mandible.title=上颚咬合力与剪切力 (MPa)
glossary.entry.sensors.mandible.desc=以兆帕为单位测量上颚闭合力与最大机械压力。
glossary.entry.sensors.autothysis.title=自爆防御 (自杀性破裂)
glossary.entry.sensors.autothysis.desc=释放粘性有毒分泌物的防御性腹部破裂 (爆炸蚁)。
glossary.entry.sensors.arolia.title=爪间吸附垫 (Arolia)
glossary.entry.sensors.arolia.desc=确保在光滑垂直墙壁和天花板上行动的角质吸附结构。

glossary.entry.accessory.flora.title=植物与植物资源 (FLORA)
glossary.entry.accessory.flora.desc=提供生物量和糖分的植物、种子与花外蜜腺。
glossary.entry.accessory.aphids.title=共生蚜虫与蜜露 (APHID_MUTUALIST)
glossary.entry.accessory.aphids.desc=养殖蚜虫并收集含糖蜜露，换取对捕食者的保护。
glossary.entry.accessory.prey.title=猎物昆虫 (PREY_INSECT)
glossary.entry.accessory.prey.desc=为幼虫发育提供必需蛋白质的毛毛虫、蟋蟀与蝇类。
glossary.entry.accessory.predator.title=专性捕食者 (PREDATOR)
glossary.entry.accessory.predator.desc=对巡逻工蚁施加捕食压力的蜘蛛、蚁蛉和鸟类。
glossary.entry.accessory.pathogen.title=病原体与寄生虫 (PATHOGEN_PARASITE)
glossary.entry.accessory.pathogen.desc=影响健康真菌 (虫草菌)、微孢子虫和螨虫 (蜂螨)。
glossary.entry.accessory.diapause.title=自动冬眠与滞育
glossary.entry.accessory.diapause.desc=低于 10°C 或秋季光照周期缩短时的代谢麻痹。
glossary.entry.accessory.r0.title=病原体传播率 (R0)
glossary.entry.accessory.r0.desc=一个被感染个体在群体中产生的平均二代感染数。
glossary.entry.accessory.lat.title=纬度与太阳光照周期
glossary.entry.accessory.lat.desc=纬度决定了全年太阳赤纬与昼长变化，同步群体的繁殖、觅食与冬眠活动。

