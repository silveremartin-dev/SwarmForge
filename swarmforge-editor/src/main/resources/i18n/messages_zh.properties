glossary.dialog.title=📖 术语表与社会性昆虫设计指南
glossary.editor.unsaved_title=Scientific Glossary - Unsaved Changes
glossary.engine.audio_synth.desc=实时声音合成器，用于模拟摩擦发音、翅鸣和环境雨声。
glossary.engine.audio_synth.title=程序化音频合成器
glossary.engine.dt.desc=用于数值积分物理方程的物理时间步长 (dt 可配置)。
glossary.engine.dt.title=时间步长倍率 (dt Step & Sub-stepping)
glossary.engine.god_mode.desc=实时直接干预模块，支持气候灾害、资源调整与种群控制。
glossary.engine.god_mode.title=上帝模式与系统干预
glossary.engine.multi_colony.desc=在同一体素空间中同时模拟多个竞争或共生群体。
glossary.engine.multi_colony.title=多群体与动态阶级追踪
glossary.engine.seed.desc=决定性伪随机种子，确保科研 100% 可重复性。
glossary.engine.seed.title=确定性主种子 (Master Seed)
glossary.engine.time_scale.desc=将模拟周期转换为真实时间单位（秒、天、滞育期）的时间戳系统。
glossary.engine.time_scale.title=真实时间尺度与生态钟
glossary.entry.accessory.aphids.desc=养殖蚜虫并收集含糖蜜露，换取对捕食者的保护。
glossary.entry.accessory.aphids.title=共生蚜虫与蜜露 (APHID_MUTUALIST)
glossary.entry.accessory.diapause.desc=低于 10°C 或秋季光照周期缩短时的代谢麻痹。
glossary.entry.accessory.diapause.title=自动冬眠与滞育
glossary.entry.accessory.flora.desc=提供生物量和糖分的植物、种子与花外蜜腺。
glossary.entry.accessory.flora.title=植物与植物资源 (FLORA)
glossary.entry.accessory.lat.desc=纬度决定了全年太阳赤纬与昼长变化，同步群体的繁殖、觅食与冬眠活动。
glossary.entry.accessory.lat.title=纬度与太阳光照周期
glossary.entry.accessory.pathogen.desc=影响健康真菌 (虫草菌)、微孢子虫和螨虫 (蜂螨)。
glossary.entry.accessory.pathogen.title=病原体与寄生虫 (PATHOGEN_PARASITE)
glossary.entry.accessory.predator.desc=对巡逻工蚁施加捕食压力的蜘蛛、蚁蛉和鸟类。
glossary.entry.accessory.predator.title=专性捕食者 (PREDATOR)
glossary.entry.accessory.prey.desc=为幼虫发育提供必需蛋白质的毛毛虫、蟋蟀与蝇类。
glossary.entry.accessory.prey.title=猎物昆虫 (PREY_INSECT)
glossary.entry.accessory.r0.desc=一个被感染个体在群体中产生的平均二代感染数。
glossary.entry.accessory.r0.title=病原体传播率 (R0)
glossary.entry.accessory.trophic_web.desc=调节生态系统中生物量和蛋白质供应的捕食者与猎物动态相互作用网络。
glossary.entry.accessory.trophic_web.title=食物网与食物链
glossary.entry.accessory.commensalism.desc=中性至有利的生物结合，生物共栖于巢穴中且不损害蚁群。
glossary.entry.accessory.commensalism.title=偏利共生与喜蚁现象
glossary.entry.accessory.myrmecochory.desc=由工蚁收集富含脂肪的油质体所推动的互利种子传播机制。
glossary.entry.accessory.myrmecochory.title=蚁播现象与种子传播
glossary.entry.accessory.parasitoidism.desc=专门侵入巢穴以剥削幼虫或食物储备的昆虫或螨虫。
glossary.entry.accessory.parasitoidism.title=拟寄生与巢穴寄生虫
glossary.entry.social.polycalism.desc=多个卫星巢穴之间的合作互联，无攻击性地共享工蚁、幼虫和食物。
glossary.entry.social.polycalism.title=多巢制与超级群体网络
glossary.entry.env.microclimate.desc=地道拱顶中精确的温度与湿度调节，以保护幼虫免受干燥和真菌感染。
glossary.entry.env.microclimate.title=地下微气候与湿度梯度
glossary.entry.env.depth.desc=模拟土壤的垂直厚度 (0.2m 至 5.0m)。限制最大挖掘深度与地下水位。
glossary.entry.env.depth.title=地下深度 (depthMeters)
glossary.entry.env.dim.desc=以实际米为单位的模拟生态缸水平尺度。
glossary.entry.env.dim.title=地表尺寸 (米)
glossary.entry.env.res.desc=3D 土壤体素网格的毫米级精度 (例如 5mm/体素)。
glossary.entry.env.res.title=体素分辨率 (mm)
glossary.entry.env.sig.desc=基于 GPS 坐标一键直接导入真实高程数据。
glossary.entry.env.sig.title=GPS GIS 导入 (DEM 与 Copernicus)
glossary.entry.env.water.desc=防止幼虫脱水并维持幼虫发育所需的基质含水量。
glossary.entry.env.water.title=土壤湿度与地下水位 (%)
glossary.entry.nest.bivouac.desc=由工蚁身体互相扣合构成的临时活体巢穴 (行军蚁)。
glossary.entry.nest.bivouac.title=活体露营巢 (BIVOUAC_LIVING_NEST)
glossary.entry.nest.carton.desc=悬挂在树干和树枝上的咀嚼木浆硬质纸巢 (举尾蚁/树栖蚁)。
glossary.entry.nest.carton.title=木质纸浆巢 (CARTON_NEST)
glossary.entry.nest.cathedral.desc=具有对流通风通道和蚁后室的唾液水泥塔 (白蚁)。
glossary.entry.nest.cathedral.title=教堂式白蚁丘 (CATHEDRAL_MOUND)
glossary.entry.nest.fungi.desc=用于培育共生真菌园的深层地下洞穴 (切叶蚁)。
glossary.entry.nest.fungi.title=地下真菌园拱顶 (SUBTERRANEAN_FUNGI_VAULT)
glossary.entry.nest.mound.desc=用于收集太阳热量的抛物线形松针巢丘 (红木蚁)。
glossary.entry.nest.mound.title=松针集热巢丘 (MOUND)
glossary.entry.nest.paper.desc=通过巢柄悬挂的咀嚼木质纸巢，附带保护性外壳 (胡蜂与黄蜂)。
glossary.entry.nest.paper.title=柄状悬挂纸巢 (PAPER_PEDUNCULATE)
glossary.entry.nest.silk.desc=树冠中利用幼虫吐丝缝合活树叶构成的叶巢 (织叶蚁)。
glossary.entry.nest.silk.title=树栖丝叶巢 (ARBOREAL_SILK_LEAF)
glossary.entry.nest.wax_comb.desc=具有 3D 平行六角形巢室的垂直蜂蜡巢脾 (蜜蜂)。
glossary.entry.nest.wax_comb.title=六角形蜂巢 (WAX_COMB_HEXAGONAL)
glossary.entry.nest.wax_pots.desc=用于储存花蜜和育幼的球形蜡质与蜂胶罐集群 (熊蜂)。
glossary.entry.nest.wax_pots.title=蜡质与蜂胶罐集群 (WAX_POTS_CLUSTER)
glossary.entry.nest.wood.desc=在腐朽木材或心材内部挖掘的地道系统 (弓背蚁)。
glossary.entry.nest.wood.title=死木挖掘巢 (TREE / DEAD_WOOD)
glossary.entry.reasoning.bdi.desc=高级代理认知建模：环境信念、优先欲望和意图行动计划。
glossary.entry.reasoning.bdi.title=BDI (信念 - 欲望 - 意图)
glossary.entry.reasoning.blackboard.desc=共享的去中心化内存空间，允许个体在没有中央控制器的情况下发布和读取优先群体需求。
glossary.entry.reasoning.blackboard.title=黑板内存系统
glossary.entry.reasoning.bt.desc=基于定期重新评估的执行节点的分层架构。
glossary.entry.reasoning.bt.title=行为树 (Behavior Tree)
glossary.entry.reasoning.fsm.desc=在严格触发条件下在离散状态之间切换的确定性反应模型。
glossary.entry.reasoning.fsm.title=有限状态机 (FSM)
glossary.entry.reasoning.fuzzy.desc=使用 0 到 1 之间连续隶属度的模糊决策引擎，实现平滑的行为过度。
glossary.entry.reasoning.fuzzy.title=模糊逻辑引擎
glossary.entry.reasoning.hybrid.desc=结合 BDI/决策树战略规划与反应式 FSM 或模糊控制的多层混合架构。
glossary.entry.reasoning.hybrid.title=组合混合引擎
glossary.entry.reasoning.snn.desc=结合强化学习的脉冲神经形态引擎，实现持续自适应。
glossary.entry.reasoning.snn.title=脉冲神经网络 (SNN / 神经网)
glossary.entry.sensors.arolia.desc=确保在光滑垂直墙壁和天花板上行动的角质吸附结构。
glossary.entry.sensors.arolia.title=爪间吸附垫 (Arolia)
glossary.entry.sensors.autothysis.desc=释放粘性有毒分泌物的防御性腹部破裂 (爆炸蚁)。
glossary.entry.sensors.autothysis.title=自爆防御 (自杀性破裂)
glossary.entry.sensors.mandible.desc=以兆帕为单位测量上颚闭合力与最大机械压力。
glossary.entry.sensors.mandible.title=上颚咬合力与剪切力 (MPa)
glossary.entry.sensors.subgenual.desc=位于胫节上的超灵敏机械感受器，用于检测地面震动和警报鼓击。
glossary.entry.sensors.subgenual.title=膝下器 (震动感知)
glossary.entry.sensors.uv.desc=利用天空紫外线偏振的光学矢量天文导航 (沙漠蚁 / 蜜蜂)。
glossary.entry.sensors.uv.title=UV 偏振光罗盘
glossary.entry.social.flight.desc=空中婚飞 (婚飞云), 分群 (蜂群分裂), 分巢 (分出子巢), 巢内交配。
glossary.entry.social.flight.title=婚飞与分群
glossary.entry.social.gynic.desc=单后制 (每群单后), 多后制 (多后分布), 工蚁繁殖 (具繁殖能力的工蚁)。
glossary.entry.social.gynic.title=雌性繁殖结构 (单后制 / 多后制)
glossary.entry.social.inhibition.desc=蚁后释放的信息素，用于抑制幼虫分化为新蚁后。
glossary.entry.social.inhibition.title=蚁后信息素抑制
glossary.entry.social.king.desc=白蚁的关键特征，雄虫 (蚁王) 终生与蚁后生活在一起。
glossary.entry.social.king.title=繁殖蚁王 (等翅目)
glossary.env.co2.desc=由于群体呼吸导致深层通道中的 CO₂ 浓度。超过 2% 时触发通风行为。
glossary.env.co2.title=二氧化碳 (CO₂ ppm) 与通风
glossary.env.magnetic.desc=通过体内的磁铁矿颗粒感知地体磁场，在全黑地下进行定向。
glossary.env.magnetic.title=地磁场 (µT) 与磁场感知
glossary.env.moisture.desc=基质水饱和度百分比，对幼虫发育、真菌园和外骨骼湿润至关重要。
glossary.env.moisture.title=土壤湿度与湿度感知 (%)
glossary.env.pressure.desc=气压变化可预警风暴并触发封巢行为。
glossary.env.pressure.title=大气压 (hPa) 与气压感知
glossary.env.soil_layers.desc=土壤层物理特性（沙土、粘土、腐殖质、岩石），决定挖掘速度与坍塌风险。
glossary.env.soil_layers.title=土壤地层、粒度与摩擦力
glossary.env.solar.desc=直射太阳辐射强度，影响巢丘加温与晨间觅食。
glossary.env.solar.title=太阳辐射与热通量
glossary.env.temperature.desc=环境温度决定新陈代谢率、胚胎发育时长和活动强度。
glossary.env.temperature.title=温度与体温调节 (°C)
glossary.env.trail_pheromones.desc=觅食者铺设的化学轨迹，引导群体通往丰饶食物源。
glossary.env.trail_pheromones.title=信息素轨迹与挥发性
glossary.link.wikipedia=🌐 维基百科
glossary.nest.arboreal_carton.desc=沿树枝延伸至树冠的纸浆地道网络，保护觅食者免受紫外线和捕食者伤害。
glossary.nest.arboreal_carton.title=树栖空中地道网 (ARBOREAL_CARTON)
glossary.nest.arboreal_silk.desc=利用幼虫分泌的丝将树叶缝合而成的树栖巢穴 (Oecophylla)。
glossary.nest.arboreal_silk.title=树栖丝叶巢 (ARBOREAL_SILK_LEAF)
glossary.nest.bamboo.desc=利用竹节空腔建成的管状巢穴，由专门工蚁的头部堵住入口。
glossary.nest.bamboo.title=竹节空腔巢 (BAMBOO_STEM_NEST)
glossary.nest.bivouac.desc=完全由成千上万工蚁身体互相扣合构成的临时动态巢穴。
glossary.nest.bivouac.title=活体露营巢 (BIVOUAC_LIVING_NEST)
glossary.nest.carton.desc=附着于树干或岩石上的海绵状硬质包膜，由咀嚼过的植物纤维和排泄物胶结而成。
glossary.nest.carton.title=木质纸浆巢 (CARTON_NEST)
glossary.nest.cathedral.desc=白蚁建造的巨大巢丘，内置对流通风通道以实现被动微气候调节。
glossary.nest.cathedral.title=教堂式白蚁丘 (CATHEDRAL_MOUND)
glossary.nest.fungi_vault.desc=切叶蚁深度地下拱顶，用于培育共生真菌园 (Leucoagaricus)。
glossary.nest.fungi_vault.title=真菌园拱顶 (SUBTERRANEAN_FUNGI_VAULT)
glossary.nest.hollow_trunk_nest.desc=在树干或大树枝的腐烂木质内部挖掘的树栖巢穴。
glossary.nest.hollow_trunk_nest.title=树干空腔巢 (HOLLOW_TRUNK_NEST)
glossary.nest.materials.desc=生物建筑基质: EARTH, WOOD_PULP_PAPER, BEESWAX, STERCORAL_CEMENT, SILK_WEAVE, PROPOLIS, CARTON_PULP, LIVING_INSECT_BODIES.
glossary.nest.materials.title=生物建筑材料
glossary.nest.mound.desc=由松针和细枝构成的抛物线形巢丘，充当太阳能集热器 (Formica rufa)。
glossary.nest.mound.title=松针集热巢丘 (MOUND)
glossary.nest.paper_pedunculate.desc=由咀嚼木质纤维与唾液混合制成的悬挂纸巢，通过一条附有避虫涂层的狭窄巢柄固定。
glossary.nest.paper_pedunculate.title=柄状悬挂纸巢 (PAPER_PEDUNCULATE)
glossary.nest.stages.desc=群体成熟阶段: 建立期 (<200个体), 成长期 (~25%), 成熟期 (100%), 超级群体 (>200%).
glossary.nest.stages.title=成熟阶段与巢穴演化
glossary.nest.subterranean.desc=地下 3D 隧道与巢室网络，用于育婴、蚁后居住、食物储存与逃生。
glossary.nest.subterranean.title=地下通道网络 (MATURE / SIMPLE)
glossary.nest.subterranean_lime.desc=通过唾液将石灰石颗粒胶结加固的地下结构，具有很高的抗冲刷能力。
glossary.nest.subterranean_lime.title=石灰胶结巢 (SUBTERRANEAN_LIME)
glossary.nest.wax_comb.desc=蜜蜂建造的垂直六角形蜂蜡结构，最大限度地提高储存效率和隔热性能。
glossary.nest.wax_comb.title=六角形蜂巢 (WAX_COMB_HEXAGONAL)
glossary.nest.wax_pots.desc=熊蜂建造的卵形蜡质与蜂胶罐集群，用于储存蜂蜜和花粉。
glossary.nest.wax_pots.title=蜡质与蜂胶罐集群 (WAX_POTS_CLUSTER)
glossary.nest.wood.desc=直接在腐烂木头或树桩内部挖掘的纵向地道系统。
glossary.nest.wood.title=死木挖掘巢 (TREE / DEAD_WOOD)
glossary.nest.wooden_beehive.desc=带有垂直活动巢框的模块化木制蜂箱，专为储蜜和冬季体温调节而设计。
glossary.nest.wooden_beehive.title=木框蜂箱 (WOODEN_BEEHIVE)
glossary.reasoning.bdi.desc=基于信念 (Beliefs)、欲望 (Desires) 和意图 (Intentions) 的高级认知代理架构。
glossary.reasoning.bdi.title=BDI 架构 (Beliefs - Desires - Intentions)
glossary.reasoning.blackboard.desc=共享内存架构，个体在其中写入环境信号并读取群体请求。
glossary.reasoning.blackboard.title=黑板架构 (Blackboard)
glossary.reasoning.bt.desc=分层行为树决策框架，根据环境刺激评估任务优先级。
glossary.reasoning.bt.title=行为树 (Behavior Tree)
glossary.reasoning.bulk.desc=宏观群体密度模型，在不追踪个体的状态下计算整体群动态。
glossary.reasoning.bulk.title=宏观群体模拟
glossary.reasoning.fsm.desc=确定性状态机，在离散状态之间进行转换（休息 -> 觅食 -> 搬运）。
glossary.reasoning.fsm.title=有限状态机 (FSM)
glossary.reasoning.fuzzy.desc=模糊逻辑引擎，使用 0 到 1 之间的连续隶属度实现平滑的行为过度。
glossary.reasoning.fuzzy.title=模糊逻辑 (Fuzzy Logic)
glossary.reasoning.hybrid.desc=多层混合架构，结合高级 BDI 规划与低级 FSM 执行。
glossary.reasoning.hybrid.title=混合决策引擎
glossary.reasoning.nn.desc=带强化学习的脉冲神经网络，能自适应避障与躲避捕食者。
glossary.reasoning.nn.title=脉冲神经网络 (SNN)
glossary.reasoning.quorum.desc=基于密度的集体决策阈值，防止过早选定筑巢点。
glossary.reasoning.quorum.title=法定人数感知 (Quorum Sensing)
glossary.search_prompt=🔍 搜索参数、物种、结构或概念 (如 Perlin, SRTM, Cordyceps, BDI, 滞育)...
glossary.social.inhibition.desc=蚁后持续释放信息素，抑制工蚁卵巢发育。
glossary.social.inhibition.title=蚁后信息素抑制
glossary.social.king.desc=与白蚁蚁后终生一夫一妻制的繁殖雄虫。
glossary.social.king.title=繁殖蚁王 (白蚁)
glossary.social.nuptial.desc=群体扩散策略: AERIAL_SWARM (空中婚飞), SWARM_DIVISION (分群), BUDDING (分巢)。
glossary.social.nuptial.title=婚飞与分群
glossary.social.polyethism.desc=按年龄 (年龄多分工) 或形态/阶级 (阶级多分工) 进行的劳动分工。
glossary.social.polyethism.title=阶级与年龄分工
glossary.social.queen_mode.desc=繁殖结构模式: MONOGYNE (单后), POLYGYNE (多后), GAMERGATES (工蚁繁殖)。
glossary.social.queen_mode.title=蚁后模式与繁殖结构
glossary.social.stigmergy.desc=通过改变环境迹象实现的间接协调机制，驱动群体自组织。
glossary.social.stigmergy.title=协同合成 (Stigmergy) 与自组织
glossary.social.trophallaxis.desc=口对口或肛对口的液体食物传递，用于分享营养、肠道微生物和激素。
glossary.social.trophallaxis.title=交哺现象 (Trophallaxis)
glossary.species.desiccation.desc=表皮与气门在低湿度和高温环境限制体内水分蒸发的生理机制。
glossary.species.desiccation.title=抗大气干燥耐受力
glossary.species.formic_acid.desc=由蚁亚科（Formicinae）蚂蚁毒腺分泌的腐蚀性防御和进攻性物质（甲酸），通过喷酸孔喷出以麻痹猎物或击退捕食者。
glossary.species.formic_acid.title=蚁酸与化学防御武器
glossary.species.hydrocarbons.desc=覆盖于真社会性昆虫外骨骼表面的腊质、脂质和烷烃复杂混合物。它能防止体水蒸发，并构成群体独特的“巢气”，用于识别同巢个体与入侵者。
glossary.species.hydrocarbons.title=表皮碳氢化合物与化学身份标识
glossary.species.metabolism.desc=昆虫维持细胞稳态以及在觅食或挖掘过程中进行机械运动所需的营养储备（糖类、脂类）基础消耗速率。
glossary.species.metabolism.title=基础代谢率与能量消耗
glossary.species.polymorphism.desc=同一群体工蚁阶级内部显著的形态尺寸与结构分化。小型工蚁负责照料幼虫，而兵蚁/大型工蚁长有硕大的头部和肌肉，用于碾碎坚硬种子或防御巢穴。
glossary.species.polymorphism.title=工蚁多型现象（大型、中型、小型工蚁）
