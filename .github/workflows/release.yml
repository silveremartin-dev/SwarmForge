name: SwarmForge Release Build & Publish

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0-beta.1)'
        required: false
        default: '1.0.0-beta.1'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Standalone Windows Distribution (jpackage)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build SwarmForge Modules & Dependencies
        shell: powershell
        run: |
          mvn -B clean install -pl swarmforge-editor -am -DskipTests
          mvn -B dependency:copy-dependencies -pl swarmforge-editor -am -DincludeScope=runtime -DoutputDirectory=target/libs

      - name: Package Standalone JRE & Native Release Bundles
        shell: powershell
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?(?<v>.+)') { $Matches.v } else { "${{ github.event.inputs.version }}" }
          if (-not $ver) { $ver = "1.0.0-beta.1" }
          Write-Host "Building release for version: $ver"
          .\scripts\package-release.ps1 -Version $ver -SkipBuild

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
